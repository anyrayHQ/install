name: Download a run artifact from S3
description: >-
  The read half of the S3 job-to-job handoff; pairs with s3-artifact-upload.
  Reads the same run+attempt scoped key the uploading job wrote.

  Like actions/download-artifact, this does NOT preserve file modes: S3 stores
  bytes, not the executable bit. Every consumer that runs a downloaded binary
  must chmod +x it, exactly as it already had to under upload-artifact v4.

inputs:
  bucket:
    description: >-
      CI artifacts bucket. Passed in by the caller because a composite action
      cannot read the `vars` context; only the workflow can.
    required: true
  name:
    description: Artifact name, matching the upload.
    required: true
  path:
    description: Directory to download into (created if absent).
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Download from S3
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        DEST_PATH: ${{ inputs.path }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail

        if [ -z "${BUCKET:-}" ]; then
          echo "::error::bucket input is empty. The caller must pass the CI_ARTIFACTS_BUCKET repository variable as the action's bucket input."
          exit 1
        fi

        src="s3://${BUCKET}/${GITHUB_REPOSITORY##*/}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${ARTIFACT_NAME}"

        # list_prefix <uri>: sets LISTED and returns 0 once the CLI answers
        # (exit 0 with keys, or exit 1 with no output: its answer for an empty
        # prefix). Any other exit is the CLI failing (252-255, or 127 when it
        # is absent) and is retried with backoff; after the last attempt it
        # returns 1 with LIST_RC and LIST_ERROR set. The CLI's own message (AWS
        # metadata, no content) is always printed: run 41794404528 lost a
        # release to a hidden CLI error read as "nothing uploaded".
        list_attempts=5
        list_prefix() {
          local uri=$1 attempt=1 delay=2 err_file
          err_file="$(mktemp)"
          while :; do
            LIST_RC=0
            LISTED="$(aws s3 ls "$uri" 2>"$err_file")" || LIST_RC=$?
            if [ "$LIST_RC" -le 1 ]; then
              sed -e '/^[[:space:]]*$/d' -e 's/^/  aws: /' "$err_file"
              rm -f "$err_file"
              return 0
            fi
            LIST_ERROR="$(tr -d '\r' < "$err_file" | grep -v '^[[:space:]]*$' | tail -n 1 || true)"
            echo "aws s3 ls ${uri} failed (exit ${LIST_RC}, attempt ${attempt}/${list_attempts}):"
            sed -e '/^[[:space:]]*$/d' -e 's/^/  aws: /' "$err_file"
            if [ "$attempt" -ge "$list_attempts" ]; then
              rm -f "$err_file"
              return 1
            fi
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
        }
        list_failed() {
          echo "::error::Could not list $1: the AWS CLI failed ${list_attempts} times (last exit ${LIST_RC}: ${LIST_ERROR//%/%25}). This is a CI or AWS fault, not a missing upload. Re-dispatch the whole workflow (same inputs)."
          exit 1
        }

        # An empty prefix means the producing job never uploaded. Fail here
        # rather than let the consumer proceed on an empty directory and
        # publish a release that is quietly missing a platform's binary.
        list_prefix "${src}/" || list_failed "$src"
        if [ -z "$LISTED" ]; then
          # Keys are attempt-scoped on purpose (a re-run must never read a
          # previous attempt's bytes), which makes "re-run failed jobs" a trap:
          # it re-runs only the CONSUMER, so it reads attempt N while the
          # producers wrote attempt N-1, and the honest-but-misleading message
          # below sends the operator hunting a producer that succeeded. Say so
          # explicitly when an earlier attempt holds the bytes.
          # Scan EVERY earlier attempt, not just the immediately preceding
          # one: re-running failed jobs twice leaves the producers' bytes two
          # or more attempts back, and checking only N-1 would fall through to
          # the message that blames a producer which in fact succeeded.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            found_attempt=""
            n=$((GITHUB_RUN_ATTEMPT - 1))
            while [ "$n" -ge 1 ]; do
              prev="s3://${BUCKET}/${GITHUB_REPOSITORY##*/}/${GITHUB_RUN_ID}-${n}/${ARTIFACT_NAME}"
              list_prefix "${prev}/" || list_failed "$prev"
              if [ -n "$LISTED" ]; then
                found_attempt="$n"
                break
              fi
              n=$((n - 1))
            done
            if [ -n "$found_attempt" ]; then
              echo "::error::'${ARTIFACT_NAME}' exists under attempt ${found_attempt} but not attempt ${GITHUB_RUN_ATTEMPT}. Artifact keys are attempt-scoped, so re-running FAILED JOBS ONLY can never work for this workflow: the producing jobs did not re-run. Re-dispatch the whole workflow instead (same inputs)."
              exit 1
            fi
          fi
          echo "::error::No objects under ${src} — the job that uploads '${ARTIFACT_NAME}' did not run or wrote nothing."
          exit 1
        fi

        mkdir -p "$DEST_PATH"
        aws s3 cp "${src}/" "$DEST_PATH" --recursive --only-show-errors
        echo "Downloaded '${ARTIFACT_NAME}' from ${src} into ${DEST_PATH}"
