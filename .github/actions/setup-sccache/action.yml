name: Set up sccache on the private CI artifacts bucket
description: >-
  Compile cache for the desktop app builds. The private monorepo's compiled output
  must never land in a public cache, so the backend is the private CI artifacts
  bucket only (never actions/cache), under sccache/connect-tray/<os>/, using the AWS
  credentials the job already assumed for the S3 handoff. Fail-open: any failure
  here leaves RUSTC_WRAPPER unset and the build runs uncached.

inputs:
  url:
    description: HTTPS URL of the pinned sccache release archive (.tar.gz or .zip).
    required: true
  sha256:
    description: Expected SHA-256 of that archive.
    required: true
  bucket:
    description: CI artifacts bucket (the caller passes vars.CI_ARTIFACTS_BUCKET).
    required: true
  os:
    description: Cache prefix segment, one of macos, windows, linux.
    required: true

runs:
  using: composite
  steps:
    - name: Fetch sccache (pinned + checksum-verified)
      uses: ./.github/actions/fetch-pinned
      with:
        url: ${{ inputs.url }}
        sha256: ${{ inputs.sha256 }}
        dest: ${{ runner.temp }}/sccache-archive
    - name: Start sccache against the private bucket
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        CACHE_OS: ${{ inputs.os }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/sccache-bin"
        mkdir -p "$dir"
        tar -xf "$RUNNER_TEMP/sccache-archive" -C "$dir"
        bin="$(find "$dir" -type f \( -name sccache -o -name sccache.exe \) | head -n 1)"
        bin_dir="$(dirname "$bin")"
        export PATH="$bin_dir:$PATH"
        export SCCACHE_BUCKET="$BUCKET"
        export SCCACHE_REGION=eu-central-1
        export SCCACHE_S3_KEY_PREFIX="sccache/connect-tray/${CACHE_OS}"
        export SCCACHE_IGNORE_SERVER_IO_ERROR=1
        if ! sccache --start-server; then
          echo '::warning::sccache did not start against the bucket; building uncached'
          exit 0
        fi
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          echo "SCCACHE_REGION=$SCCACHE_REGION"
          echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
        echo "$bin_dir" >> "$GITHUB_PATH"
