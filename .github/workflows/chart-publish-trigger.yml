name: Trigger chart publish

# Publishes the Helm chart on the MERGE that bumps it, instead of whenever the
# next prod promotion happens to come round.
#
# The chart is published by the MONOREPO (publish-chart.yml reads THIS repo's
# helm/Chart.yaml and pushes to the OCI registry + charts.anyray.ai). Nothing
# here ever told it a bump had landed, so a Chart.yaml change merged after the
# day's last publish just sat there. Shipped 2026-08-07: chart 0.5.0 — the
# breaking "drop the gateway PVC so it can run two pods" change — merged at
# 12:43, three hours after that day's last publish, and was installable by
# nobody until a human noticed. helm-chart-drift.yml would have reported it the
# next morning, which is a monitor doing its job late rather than a pipeline
# doing its job on time.
#
# This closes the loop: merge to main touching helm/Chart.yaml -> repository_dispatch
# -> the monorepo publishes. It also shrinks the exact window helm-chart-drift.yml
# documents as its reason for having no pull_request trigger ("between a
# Chart.yaml bump landing and the monorepo publish running") from up to a day
# down to the length of one publish run. The drift monitor stays as the backstop
# for whatever still slips: a failed publish, a hand-edited shelf, a bump pushed
# while the credential below is missing.
#
# AUTH: a short-lived anyray-pr-agent App installation token, scoped to the
# monorepo alone, never a long-lived PAT. `repository_dispatch` needs
# `contents: write`, which that App already carries; the workflow_dispatch REST
# call would have needed `actions: write`, which it does not have. That is the
# whole reason this is a repository_dispatch.

on:
  push:
    branches: [main]
    paths:
      - helm/Chart.yaml

# Nothing here reads or writes this repo beyond the checkout; the only
# credential is the minted App token, and it is used solely to leave this repo.
permissions:
  contents: read

concurrency:
  # A burst of chart bumps only needs the last one to win — the monorepo
  # publishes whatever main holds at the moment it runs, not what this event
  # carried. The publish itself is separately serialized on the monorepo side.
  group: chart-publish-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Degrade to a warning rather than a red wall when the App credential
      # isn't on this repo yet: a missing secret would otherwise fail every
      # chart bump, and the drift monitor already covers the resulting gap.
      # The secret is read into env and tested in `run:` — never referenced from
      # a step `if:`, which is a parse error that 422s the whole workflow.
      - name: Check the App credential is present
        id: cred
        env:
          APP_ID: ${{ secrets.ANYRAY_PR_AGENT_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ]; then
            echo '::warning::ANYRAY_PR_AGENT_APP_ID / ANYRAY_PR_AGENT_APP_PRIVATE_KEY are not set on this repo, so the chart publish was NOT triggered. Add them (GitHub App: anyray-pr-agent), or run "Publish Helm chart (standalone)" in anyrayHQ/monorepo by hand. helm-chart-drift.yml will flag the gap within a day.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App installation token
        id: appauth
        if: steps.cred.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ANYRAY_PR_AGENT_APP_ID }}
          private-key: ${{ secrets.ANYRAY_PR_AGENT_APP_PRIVATE_KEY }}
          # Scope the token to the one repo it needs to reach.
          owner: anyrayHQ
          repositories: monorepo

      - name: Tell the monorepo to publish the chart
        if: steps.cred.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.appauth.outputs.token }}
          # Bound to env, never interpolated into the script body.
          INSTALL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' helm/Chart.yaml | head -1)"
          gh api repos/anyrayHQ/monorepo/dispatches \
            -f event_type=install-chart-bump \
            -f "client_payload[install_sha]=$INSTALL_SHA" \
            -f "client_payload[chart_version]=${version:-unknown}"
          printf '::notice::dispatched install-chart-bump to anyrayHQ/monorepo for chart %s (%s)\n' \
            "${version:-unknown}" "$INSTALL_SHA"
