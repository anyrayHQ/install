name: Helm chart

# Validates the Helm chart and enforces the image-channel invariants.
#
# THE DEFAULT IS PINNED, AND MUST STAY PINNED. An existing release upgrades by
# re-reading values.yaml, so moving the default onto a moving channel would
# silently switch every deployment that never set a tag off its fixed build and
# start restarting its pods nightly, from a routine `helm upgrade`. Chart 0.6.0
# briefly shipped that default; it was corrected before the chart was ever
# published, and this job is what keeps it from coming back.
#
# Auto-update is opt-in with ONE value, image.tag=policy-stable, which both
# forces pullPolicy: Always and arms the autoUpdate roll. New installs get it
# because `setup.sh --k8s` writes it into the generated values file, not because
# the chart defaults to it. What this job pins:
#   * the default render pins every app image to the chart's appVersion, and
#     schedules no roll;
#   * the one-line opt-in produces a moving tag, Always, and exactly one roll;
#   * :latest never becomes a default — it is a legacy alias with no promotion
#     contract behind it.
# Also guards the CI-generated appVersion bump PR opened by the monorepo prod
# promotion.
on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:

# Read-only: the chart job only checks out the repo and runs helm lint/template.
permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
          token: ${{ github.token }}

      - name: Lint
        run: helm lint helm --set host=anyray.example.com --set postgres.storage=50Gi

      - name: Chart renders with default values, at scale, and autoscaled
        run: |
          set -euo pipefail
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi > /dev/null
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set gateway.persistence.enabled=false --set gateway.replicas=2 \
            --set optimizer.persistence.enabled=false --set optimizer.replicas=2 \
            > /dev/null
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set gateway.persistence.enabled=false --set gateway.autoscaling.enabled=true \
            --set optimizer.persistence.enabled=false --set optimizer.autoscaling.enabled=true \
            > /dev/null

      - name: appVersion must be a pinned vX.Y.Z (never a moving tag)
        run: |
          set -euo pipefail
          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/Chart.yaml | head -1)"
          echo "appVersion=$app"
          if ! printf '%s' "$app" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=helm/Chart.yaml::appVersion must be a pinned vX.Y.Z — production must not ship a moving tag like 'latest' (got '$app')"
            exit 1
          fi
          echo "APP_VERSION=$app" >> "$GITHUB_ENV"

      - name: Default render pins every app image to appVersion
        run: |
          set -euo pipefail
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi)"
          fail=0
          for c in gateway optimizer proxy endpoint-control; do
            if ! printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:${APP_VERSION}"; then
              echo "::error::default render does not pin ${c} to appVersion ${APP_VERSION} — an upgrade would move a running deployment off its fixed build:"
              printf '%s\n' "$render" | grep -E "image:.*/${c}:" || true
              fail=1
            fi
          done
          # A moving tag must never be the default, by any of its names.
          if printf '%s\n' "$render" | grep -Eq 'anyray/(gateway|optimizer|proxy|endpoint-control):(latest|stable|policy-stable)'; then
            echo "::error::default render uses a moving channel — production images must default to a pinned build"
            fail=1
          fi
          [ "$fail" = 0 ]

      - name: One-line opt-in turns the whole feature on
        run: |
          set -euo pipefail
          # image.tag=policy-stable is the entire documented opt-in: it must
          # produce the moving tag, the re-pull policy, AND the roll. If any of
          # the three stops following from that one value, the documented
          # instruction silently half-works.
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set-string image.tag=policy-stable)"
          fail=0
          for c in gateway optimizer proxy endpoint-control; do
            if ! printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:policy-stable"; then
              echo "::error::opt-in render does not put ${c} on the policy-stable channel"
              fail=1
            fi
          done
          # A moving tag whose pods never re-pull makes the whole scheme decorative.
          if [ "$(printf '%s\n' "$render" | grep -c 'imagePullPolicy: Always')" -lt 4 ]; then
            echo "::error::moving channel rendered without imagePullPolicy: Always"
            fail=1
          fi
          if [ "$(printf '%s\n' "$render" | grep -c 'kind: CronJob')" -ne 1 ]; then
            echo "::error::moving channel did not arm the autoUpdate roll"
            fail=1
          fi
          [ "$fail" = 0 ]

      - name: autoUpdate rolls only a tag that can actually move
        run: |
          set -euo pipefail
          render() {
            helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi "$@"
          }
          # NOTE: render once into a variable and match with grep on a here-string.
          # `helm ... | grep -q` is a trap under pipefail: grep -q exits at the
          # first match, the upstream helm/grep takes SIGPIPE, and pipefail turns
          # that into a step failure — intermittently, depending on buffering.
          default="$(render)"
          moving="$(render --set-string image.tag=policy-stable)"
          off="$(render --set-string image.tag=policy-stable --set autoUpdate.enabled=false)"

          # THE BACKWARDS-COMPATIBILITY ASSERTION. autoUpdate.enabled is true by
          # default, but at the pinned default tag it must render NOTHING: a
          # nightly restart onto an identical build is pure churn, and an
          # existing release that never set a tag must upgrade into exactly the
          # workloads it already ran. Skip, never fail — failing would turn that
          # upgrade into a render error and a red sync for every ArgoCD/Flux user.
          test "$(grep -c 'kind: CronJob' <<<"$default")" -eq 0
          test "$(grep -c 'anyray-updater' <<<"$default")" -eq 0

          # A tag that CAN move arms it.
          test "$(grep -c 'kind: CronJob' <<<"$moving")" -eq 1

          # Explicit opt-out still wins over a moving tag.
          test "$(grep -c 'kind: CronJob' <<<"$off")" -eq 0

          # The roll must never reach the Postgres StatefulSet, and must stay
          # inside this release: Deployments plus the instance selector.
          cronjob="$(awk '/^kind: CronJob$/,0' <<<"$moving")"
          grep -q -- '- deployment' <<<"$cronjob"
          grep -q -- "--selector" <<<"$cronjob"
          grep -q -- 'app.kubernetes.io/instance=' <<<"$cronjob"
          if grep -q -- 'statefulset' <<<"$cronjob"; then
            echo "::error::the autoUpdate roll references a StatefulSet — it must only restart Deployments"
            exit 1
          fi

          # Namespaced Role only. A ClusterRole here would be a privilege bug.
          test "$(grep -c '^kind: ClusterRole' <<<"$moving")" -eq 0

      - name: An upgrade from the previous chart changes no workload
        run: |
          set -euo pipefail
          # The regression this whole PR exists to prevent, asserted directly:
          # render the PREVIOUS published chart and this one with the same
          # (empty) user values, and require the workload output to be identical.
          # Anything that moves here is a behaviour change an operator would get
          # from a routine `helm upgrade` without asking for one.
          prev="$(mktemp -d)"
          helm pull oci://public.ecr.aws/anyray/anyray --untar --untardir "$prev" >/dev/null 2>&1 || {
            echo "note: could not pull the published chart; skipping the diff"
            exit 0
          }
          args=(--set host=anyray.example.com --set postgres.storage=50Gi)
          # appVersion legitimately differs between the two charts, so compare
          # with the image tags normalised: this asserts the SHAPE is unchanged.
          norm() { sed -E 's#(anyray/[a-z-]+):v[0-9]+\.[0-9]+\.[0-9]+#\1:PINNED#g'; }
          helm template t "$prev/anyray" "${args[@]}" | norm > /tmp/prev.yaml
          helm template t helm "${args[@]}" | norm > /tmp/curr.yaml
          if ! diff -u /tmp/prev.yaml /tmp/curr.yaml > /tmp/chart.diff; then
            echo "::warning::the default render differs from the published chart:"
            head -80 /tmp/chart.diff
            # Only a NEW workload or a changed image reference is a compatibility
            # break; other additive changes (labels, probes) are normal chart work.
            if grep -E '^\+(kind: (CronJob|StatefulSet|Deployment)|.*image:)' /tmp/chart.diff; then
              echo "::error::an upgrade would add a workload or change an image — not backwards compatible"
              exit 1
            fi
          fi

      - name: policy-stable is the only supported moving channel
        run: |
          set -euo pipefail
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set-string image.tag=policy-stable)"
          for c in gateway optimizer proxy endpoint-control; do
            printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:policy-stable"
          done
          test "$(printf '%s\n' "$render" | grep -c 'imagePullPolicy: Always')" -ge 4
