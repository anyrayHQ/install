name: Helm chart

# Validates the Helm chart and enforces the image-channel invariants.
#
# From chart 0.6.0 images DEFAULT to the moving `policy-stable` channel, paired
# with the autoUpdate CronJob, so a Kubernetes install keeps itself current the
# way Compose and the AWS stack already do. Two things this job still guards,
# because they are what made the old pinned default safe:
#   * `policy-stable` is the ONLY moving channel we ship by default. `:latest`
#     must never become the default: it is a legacy alias with no promotion
#     contract behind it.
#   * PINNING STILL WORKS. With image.tag="" every app image must resolve to the
#     chart's fixed appVersion, so a GitOps repo that pins gets exactly the
#     reproducible, auditable build it did before.
# Also guards the CI-generated appVersion bump PR opened by the monorepo prod
# promotion.
on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:

# Read-only: the chart job only checks out the repo and runs helm lint/template.
permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
          token: ${{ github.token }}

      - name: Lint
        run: helm lint helm --set host=anyray.example.com --set postgres.storage=50Gi

      - name: Chart renders with default values, at scale, and autoscaled
        run: |
          set -euo pipefail
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi > /dev/null
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set gateway.persistence.enabled=false --set gateway.replicas=2 \
            --set optimizer.persistence.enabled=false --set optimizer.replicas=2 \
            > /dev/null
          helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set gateway.persistence.enabled=false --set gateway.autoscaling.enabled=true \
            --set optimizer.persistence.enabled=false --set optimizer.autoscaling.enabled=true \
            > /dev/null

      - name: appVersion must be a pinned vX.Y.Z (never a moving tag)
        run: |
          set -euo pipefail
          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/Chart.yaml | head -1)"
          echo "appVersion=$app"
          if ! printf '%s' "$app" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=helm/Chart.yaml::appVersion must be a pinned vX.Y.Z — production must not ship a moving tag like 'latest' (got '$app')"
            exit 1
          fi
          echo "APP_VERSION=$app" >> "$GITHUB_ENV"

      - name: Default render follows policy-stable, never :latest
        run: |
          set -euo pipefail
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi)"
          fail=0
          for c in gateway optimizer proxy endpoint-control; do
            if ! printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:policy-stable"; then
              echo "::error::default render does not put ${c} on the policy-stable channel:"
              printf '%s\n' "$render" | grep -E "image:.*/${c}:" || true
              fail=1
            fi
          done
          # :latest is a legacy alias with no promotion contract behind it, so it
          # must never become the default even though the default is now moving.
          if printf '%s\n' "$render" | grep -Eq 'anyray/(gateway|optimizer|proxy|endpoint-control):latest'; then
            echo "::error::default render uses the legacy :latest alias — the supported moving channel is policy-stable"
            fail=1
          fi
          # A moving tag whose pods never re-pull is the failure mode that makes
          # the whole scheme decorative. Assert the pairing, not just the tag.
          if [ "$(printf '%s\n' "$render" | grep -c 'imagePullPolicy: Always')" -lt 4 ]; then
            echo "::error::default render follows a moving channel without imagePullPolicy: Always"
            fail=1
          fi
          [ "$fail" = 0 ]

      - name: Pinning still works — image.tag="" resolves every app image to appVersion
        run: |
          set -euo pipefail
          # The guarantee a GitOps repo depends on, and the old default. It has to
          # keep working now that it is opt-in rather than automatic.
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set-string image.tag="")"
          fail=0
          for c in gateway optimizer proxy endpoint-control; do
            if ! printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:${APP_VERSION}"; then
              echo "::error::pinned render does not resolve ${c} to appVersion ${APP_VERSION}:"
              printf '%s\n' "$render" | grep -E "image:.*/${c}:" || true
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      - name: autoUpdate rolls only a tag that can actually move
        run: |
          set -euo pipefail
          base=(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi)
          # Default: the channel moves, so the roll is scheduled.
          test "$("${base[@]}" | grep -c 'kind: CronJob')" -eq 1

          # Pinned tag with autoUpdate left at its default true. This MUST render
          # and MUST omit the CronJob rather than fail: every install predating
          # 0.6.0 pins its tag, so failing here would turn their first upgrade
          # into a render error and a red sync for every ArgoCD/Flux user. A
          # nightly restart onto an identical build is pure churn.
          # Must be >= the chart's HA floor, or an unrelated guard rejects the
          # render first and this proves nothing about the CronJob.
          pinned="$("${base[@]}" --set-string image.tag="$APP_VERSION")"
          test "$(printf '%s\n' "$pinned" | grep -c 'kind: CronJob')" -eq 0

          # Explicit opt-out on a moving tag.
          test "$("${base[@]}" --set autoUpdate.enabled=false | grep -c 'kind: CronJob')" -eq 0

          # The roll must never be able to touch the Postgres StatefulSet, and
          # must stay inside this release: Deployments + the instance selector.
          "${base[@]}" | grep -A12 'kind: CronJob' | grep -q -- '- deployment'
          "${base[@]}" | grep -A16 'kind: CronJob' | grep -q -- '--selector'

          # Namespaced Role only. A ClusterRole here would be a privilege bug.
          test "$("${base[@]}" | grep -c '^kind: ClusterRole')" -eq 0

      - name: policy-stable is the only supported moving channel
        run: |
          set -euo pipefail
          render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
            --set-string image.tag=policy-stable)"
          for c in gateway optimizer proxy endpoint-control; do
            printf '%s\n' "$render" | grep -q "public.ecr.aws/anyray/${c}:policy-stable"
          done
          test "$(printf '%s\n' "$render" | grep -c 'imagePullPolicy: Always')" -ge 4
