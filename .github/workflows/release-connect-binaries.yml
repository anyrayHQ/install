name: Release anyray-connect binaries

# Compiles the published `anyray-connect` npm package into standalone,
# zero-dependency executables (no Node required on the developer's machine) and
# attaches them to a GitHub Release here. The hosted `connect.sh` / `connect.ps1`
# installers download these so a developer can connect with a single curl/irm
# line — nothing to install.
#
# Source of truth is the PUBLIC npm package (anyray-connect), so this workflow
# never needs access to the private monorepo. Run it after publishing a new
# anyray-connect version to npm.
#
# Code signing (RFC 0010 §6, secret names in RELEASING.md): the darwin
# binaries are Developer ID-signed + notarized, the windows binary is
# Authenticode-signed, and the linux binaries are additionally packaged as
# .deb/.rpm (GPG detach-signed once the release key exists). Every signing
# step is conditional on its secrets being configured — with no secrets set
# the binaries publish byte-identical to an unsigned run; the .deb/.rpm are
# additive assets either way. SHA256SUMS is generated in the release job,
# AFTER signing, because signing rewrites the binaries.
#
# Release integrity (two independent paths, both in the release job):
#   - SHA256SUMS is GPG detach-signed to SHA256SUMS.asc with the same release
#     key, so the checksum file the installers fetch is not merely self-
#     consistent with a release an attacker could have rewritten end to end.
#     Secret-gated like the package signing above.
#   - actions/attest-build-provenance records signed build provenance for every
#     shipped executable and package. Not secret-gated — it runs off the
#     workflow's OIDC identity — so `gh attestation verify` works from the next
#     release onwards.
# connect.sh / connect.ps1 verify checksums today but do NOT yet require either
# signature; making that mandatory is a deliberate follow-up, and it can only
# land after a real release has actually published these assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'anyray-connect npm version to compile (e.g. 0.3.0, or "latest")'
        required: true
        default: 'latest'
      min_version:
        description: 'MANDATORY release: install on machines below this version even if they opted out (blank = normal release)'
        required: false
        default: ''
      dry_run:
        description: 'Test run: build + sign + notarize + exercise the on-demand Mac fleet, but do NOT publish a GitHub release (no customer-facing change). Signed binaries are uploaded as a workflow artifact for inspection.'
        required: false
        type: boolean
        default: false
      staging:
        description: 'Staging release: publish the SAME signed binaries under a connect-staging-v<version> pre-release tag, so a tester can fetch a real build by URL without changing anything customers receive. Ignored when dry_run is set.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.5'

      - name: Fetch the published package
        id: pkg
        env:
          # Via env (not inline) so the dispatch input can't be shell-injected.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Validate the input shape: a semver or the literal 'latest'.
          case "$VERSION_INPUT" in
            latest|[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::invalid version input: $VERSION_INPUT"; exit 1 ;;
          esac
          npm pack "anyray-connect@${VERSION_INPUT}"
          tar xzf anyray-connect-*.tgz
          # Resolve the concrete version even when 'latest' was requested.
          VERSION="$(node -p "require('./package/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          test -f package/dist/index.js

      - name: Install runtime dependencies for bundling
        working-directory: package
        run: |
          set -euo pipefail
          # anyray-connect gained a runtime dep (zod) on 2026-07-20; the packed
          # npm tarball ships dist/ but no node_modules, so `bun build --compile`
          # can't resolve the bare `import { z } from "zod"`. Install prod deps
          # here for Bun to bundle into each --compile output — the emitted
          # binaries stay self-contained; the dep only has to exist at build time.
          # --ignore-scripts: never run lifecycle scripts from fetched deps.
          bun install --production --ignore-scripts

      - name: Compile standalone binaries (Bun)
        run: |
          set -euo pipefail
          mkdir -p out
          # Bun target -> output asset name. Windows gets a .exe.
          build() {
            bun build --compile --minify --target="$1" package/dist/index.js --outfile "out/$2"
          }
          build bun-darwin-arm64  anyray-connect-darwin-arm64
          build bun-darwin-x64    anyray-connect-darwin-x64
          build bun-linux-x64     anyray-connect-linux-x64
          build bun-linux-arm64   anyray-connect-linux-arm64
          build bun-windows-x64   anyray-connect-windows-x64.exe
          # SHA256SUMS is generated in the release job, after the signing jobs
          # — codesign/signtool rewrite the binaries, so a checksum taken here
          # would not match the released bytes.
          ls -lh out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-unsigned
          path: out/
          if-no-files-found: error

  # Developer ID-signs + notarizes the two darwin binaries when the Apple
  # secrets are configured; with them unset every step below no-ops and the
  # binaries pass through byte-identical.
  # Allocate a macOS signing runner ON DEMAND: create the MAC_ARM CodeBuild
  # fleet + ephemeral runner project, used only for this release, torn down in
  # teardown-mac. Runs on the Linux runner and assumes a scoped GitHub-OIDC role
  # to drive the fleet lifecycle (scripts/mac-fleet.sh). Net cost is one
  # 24h-minimum EC2 Mac charge per release (~$15-16), never a standing bill.
  provision-mac:
    needs: build
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write # assume the fleet-lifecycle role via OIDC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_MAC_FLEET_ROLE_ARN }}
          aws-region: eu-central-1
      - run: ./scripts/mac-fleet.sh up

  # Developer ID-signs + notarizes the two darwin binaries on the on-demand Mac
  # using Apple's own codesign + notarytool — the only tooling that correctly
  # signs Bun-compiled binaries (rcodesign/quill mishandle the x64 Mach-O and
  # produce a signature that verifies but won't launch; proven by E2E).
  sign-macos:
    needs: provision-mac
    runs-on: codebuild-anyray-install-runner-mac-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      # GitHub Actions can't read `secrets.*` in a step `if:` — map the secrets
      # into job env and gate each step on `env.X != ''` instead.
      APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      - name: Sign the darwin binaries (Developer ID)
        if: env.APPLE_SIGNING_CERT_P12 != ''
        run: |
          set -euo pipefail
          # Throwaway keychain: the cert never touches the login keychain and
          # the always() step below destroys it even when signing fails.
          KEYCHAIN="$RUNNER_TEMP/anyray-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No inactivity auto-lock — a long notarization wait must not lock the
          # key out mid-build.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign resolves signing identities through the DEFAULT keychain and
          # the SESSION search list — not the `-d user` list. On a fresh CI Mac
          # those point at an empty login keychain, so `find-identity` (which
          # takes an explicit keychain arg) sees the identity but `codesign
          # --sign <hash>` reports "no identity found". Make the throwaway
          # keychain the default and put it on the session search list.
          security default-keychain -s "$KEYCHAIN"
          printf '%s' "$APPLE_SIGNING_CERT_P12" | base64 -d > "$RUNNER_TEMP/signing-cert.p12"
          security import "$RUNNER_TEMP/signing-cert.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$APPLE_SIGNING_CERT_PASSWORD" -A -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing-cert.p12"
          # Allow codesign to use the imported key non-interactively; the
          # command dumps key attributes on success, so discard its stdout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN"
          # Diagnostics: what actually landed in the throwaway keychain.
          echo "--- codesigning identities (all / valid-only) ---"
          security find-identity -p codesigning "$KEYCHAIN" || true
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          # Select by name WITHOUT -v: on a fresh CI keychain the Developer ID
          # chain often can't establish anchor trust for the `-v` validity
          # filter (no login keychain, no OCSP), so `-v` hides an identity that
          # signs perfectly well. The key + cert are ours; codesign validates
          # the real signature afterwards.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_CERT_P12 imported no Developer ID Application identity (see diagnostics above)"
            exit 1
          fi
          echo "using signing identity $IDENTITY"
          # Bun-compiled binaries embed JavaScriptCore, which allocates JIT
          # pages at startup; the hardened runtime (mandatory for notarization)
          # forbids that without the allow-jit entitlement, and the signed
          # binary then dies on EVERY machine with "Ran out of executable
          # memory" the moment it launches. Caught by the local E2E rehearsal
          # (signed + notarized real v0.11.81 binaries; allow-jit alone is the
          # minimal sufficient set — keep it minimal, each extra entitlement
          # weakens the hardening story the EDR/transparency docs sell).
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Artifact transfer strips file modes (actions/upload-artifact v4
          # documents this) — the post-sign smoke run below would otherwise die
          # with "Permission denied". Harmless for the published assets: both
          # consumers (connect.sh, selfUpdate.ts) chmod after download.
          chmod +x out/anyray-connect-darwin-*
          for bin in out/anyray-connect-darwin-*; do
            codesign --force --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --identifier ai.anyray.connect --sign "$IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            # The signed binary must still RUN — a signature that verifies but
            # aborts at launch is exactly the failure the entitlement fixes.
            # Only the arm64 slice can execute on the arm64 runner.
            case "$bin" in
              *darwin-arm64) "$bin" --help > /dev/null ;;
            esac
          done

      - name: Notarize the darwin binaries
        # Needs the Developer ID signature from the step above plus the App
        # Store Connect API key. A bare mach-o binary CANNOT be stapled —
        # `xcrun stapler staple` only applies to bundles/dmg/pkg — so the
        # notarized binary ships as-is and Gatekeeper fetches the ticket online.
        # SEAM (RFC 0010 tray .app): when the desktop tray ships as a .app
        # bundle, extend this job to sign the bundle, notarize its zip, then
        # `xcrun stapler staple` the .app so first launch verifies offline.
        if: env.APPLE_SIGNING_CERT_P12 != '' && env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_KEY" | base64 -d > "$RUNNER_TEMP/notary-key.p8"
          for bin in out/anyray-connect-darwin-*; do
            zip="$RUNNER_TEMP/$(basename "$bin").zip"
            ditto -c -k "$bin" "$zip"
            status="$(xcrun notarytool submit "$zip" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json | jq -r '.status // "unknown"')"
            if [ "$status" != "Accepted" ]; then
              echo "::error::notarization failed for $(basename "$bin") (status: $status)"
              exit 1
            fi
          done

      - name: Delete the throwaway keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing-cert.p12" "$RUNNER_TEMP/notary-key.p8"
          if [ -f "$RUNNER_TEMP/anyray-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/anyray-signing.keychain-db"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-darwin
          path: out/anyray-connect-darwin-*
          if-no-files-found: error

  # Always release the Mac, even if signing failed — an orphaned fleet bills a
  # standing Mac. Runs on the Linux runner with the same OIDC lifecycle role.
  teardown-mac:
    needs: sign-macos
    if: ${{ always() }}
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_MAC_FLEET_ROLE_ARN }}
          aws-region: eu-central-1
      - run: ./scripts/mac-fleet.sh down

  # Authenticode-signs the windows binary when the cert secrets are
  # configured; otherwise it passes through byte-identical.
  sign-windows:
    needs: build
    runs-on: codebuild-anyray-install-runner-win-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      # Same pattern as sign-macos: secrets into env, gate on `env.X != ''`.
      WINDOWS_SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      - name: Sign the windows binary (Authenticode)
        if: env.WINDOWS_SIGNING_CERT_PFX != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX))
          # signtool ships with the Windows SDK. NOTE: on the CodeBuild
          # windows-base image the SDK may be absent — when the Windows cert is
          # provisioned and this step first goes live, it may need a pinned
          # SDK/choco install step above. Inert until then (secret-gated).
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error 'signtool.exe not found on the runner' }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD out\anyray-connect-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed ($LASTEXITCODE)" }
          & $signtool verify /pa out\anyray-connect-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed ($LASTEXITCODE)" }

      - name: Remove the decoded certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'signing-cert.pfx')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-windows
          path: out/anyray-connect-windows-x64.exe
          if-no-files-found: error

  # Packages the linux binaries as .deb/.rpm — ADDITIVE assets; the bare
  # binaries keep publishing exactly as before and stay untouched. Once the
  # GPG release key is provisioned the packages are detach-signed and the
  # public key ships alongside them.
  package-linux:
    needs: build
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      # Same pattern as sign-macos: secrets into env, gate on `env.X != ''`.
      LINUX_SIGNING_GPG_KEY: ${{ secrets.LINUX_SIGNING_GPG_KEY }}
      LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
      # nfpm is pinned by version AND tarball checksum; bump both together
      # (checksums.txt on the nfpm release page).
      NFPM_PIN: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      # For ci/nfpm.yaml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      - name: Fetch nfpm (pinned by version + checksum)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/nfpm.tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_PIN}/nfpm_${NFPM_PIN}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  ${RUNNER_TEMP}/nfpm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm

      - name: Build .deb/.rpm packages
        env:
          NFPM_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pkgs
          for arch in x64 arm64; do
            case "$arch" in
              x64)   export NFPM_ARCH=amd64 ;;
              arm64) export NFPM_ARCH=arm64 ;;
            esac
            export NFPM_BIN="out/anyray-connect-linux-${arch}"
            "$RUNNER_TEMP/nfpm" package -f ci/nfpm.yaml -p deb -t pkgs/
            "$RUNNER_TEMP/nfpm" package -f ci/nfpm.yaml -p rpm -t pkgs/
          done
          ls -lh pkgs

      - name: GPG-sign the packages and export the public key
        if: env.LINUX_SIGNING_GPG_KEY != ''
        run: |
          set -euo pipefail
          # Isolated GNUPGHOME; the always() step below removes it.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_GPG_KEY" | gpg --batch --quiet --import
          KEYID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          if [ -z "$KEYID" ]; then
            echo "::error::LINUX_SIGNING_GPG_KEY contains no secret key"
            exit 1
          fi
          for pkg in pkgs/*.deb pkgs/*.rpm; do
            # Passphrase over fd 0, never argv.
            printf '%s' "$LINUX_SIGNING_GPG_PASSPHRASE" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEYID" \
              --armor --detach-sign --output "${pkg}.asc" "$pkg"
            gpg --batch --verify "${pkg}.asc" "$pkg"
          done
          gpg --batch --armor --export "$KEYID" > pkgs/anyray-connect-signing-key.asc

      - name: Delete the imported GPG key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: pkgs/
          if-no-files-found: error

  release:
    needs: [build, sign-macos, sign-windows, package-linux]
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write # create the release + upload assets
      id-token: write # attest-build-provenance: mint the short-lived Sigstore signing certificate
      attestations: write # attest-build-provenance: record the provenance bundle on this repo
    env:
      # Same pattern as package-linux (a step `if:` cannot read `secrets.*`, so
      # the secrets are mapped into job env and each step gates on `env.X != ''`).
      # The key is imported HERE as well as in package-linux on purpose: jobs run
      # on different runners and share no GNUPGHOME, and SHA256SUMS is generated
      # in THIS job — after the signing jobs, because signing rewrites the bytes.
      LINUX_SIGNING_GPG_KEY: ${{ secrets.LINUX_SIGNING_GPG_KEY }}
      LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
    steps:
      # The CodeBuild AL2 runner image ships no gh CLI (hosted ubuntu does) —
      # install it pinned by version + sha256, same discipline as nfpm below.
      - name: Install gh CLI
        run: |
          set -euo pipefail
          V=2.76.1
          SHA=18367ca38b4462889ae38fba6a18c53a4c2818b6af309bbe53d0810bb06036e9
          curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_amd64.tar.gz"
          echo "${SHA}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          install -m 0755 "/tmp/gh_${V}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      # gh release create needs a git checkout to resolve the repo + create the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assemble the release assets: unsigned set first, then the signed
      # darwin/windows binaries overwrite their unsigned copies (a no-op when
      # the signing steps were skipped), then the linux packages.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-darwin
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-windows
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: assets

      - name: Generate SHA256SUMS (after signing — signing rewrites the binaries)
        run: |
          set -euo pipefail
          # Name-keyed lookups on both consumers — connect.sh (awk '$2==asset')
          # and the self-updater (parseSha256Sums) — so the package/signature
          # lines are additive and harmless; the binary lines are what they
          # always were. connect-update.json is written AFTER this on purpose:
          # the mandatory-release marker never appears in SHA256SUMS.
          ( cd assets && sha256sum -- * > SHA256SUMS )
          cat assets/SHA256SUMS

      - name: GPG-sign SHA256SUMS
        # Closes the loop the checksums alone leave open. connect.sh /
        # connect.ps1 verify a downloaded binary against SHA256SUMS, but an
        # UNSIGNED SHA256SUMS fetched from the same release is only an integrity
        # check against corruption: whoever can alter the release can alter the
        # binary and its checksum line together. A detached signature makes the
        # checksum file verifiable against a key that never lives in the release.
        #
        # The import is repeated here rather than reused from package-linux:
        # that job runs on a different runner, its GNUPGHOME is $RUNNER_TEMP on
        # ITS machine, and it is torn down when the job ends. Same key, same
        # import mechanism, same passphrase handling (loopback pinentry,
        # passphrase over fd 0, never argv) — deliberately not a second pattern.
        #
        # Secret-gated exactly like every other signing step in this workflow
        # (RELEASING.md: signing is strictly conditional on the secrets being
        # configured), so a release cut before the key is provisioned publishes
        # what it does today. Once the key IS set there is no soft failure: the
        # step runs under `set -euo pipefail` with no `|| true` and no
        # continue-on-error, so a signing or verification failure fails the job
        # before anything is published.
        if: env.LINUX_SIGNING_GPG_KEY != ''
        run: |
          set -euo pipefail
          # Isolated GNUPGHOME; the always() step below removes it.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_GPG_KEY" | gpg --batch --quiet --import
          KEYID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          if [ -z "$KEYID" ]; then
            echo "::error::LINUX_SIGNING_GPG_KEY contains no secret key"
            exit 1
          fi
          # Passphrase over fd 0, never argv.
          printf '%s' "$LINUX_SIGNING_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEYID" \
            --armor --detach-sign --output assets/SHA256SUMS.asc assets/SHA256SUMS
          # Verify against the bytes that will actually be uploaded.
          gpg --batch --verify assets/SHA256SUMS.asc assets/SHA256SUMS
          # The public key ships from package-linux as anyray-connect-signing-key.asc
          # and is already listed in SHA256SUMS (it was in assets/ when the sums
          # were taken). Both steps gate on the same secret, so it is present
          # whenever this step runs — assert rather than silently publish a
          # signature nobody can check.
          if [ ! -f assets/anyray-connect-signing-key.asc ]; then
            echo "::error::SHA256SUMS.asc was produced but the public key asset is missing; the release would be unverifiable"
            exit 1
          fi
          # Fingerprint is public data. Logged so a release can be checked
          # against the fingerprint recorded in RELEASING.md.
          gpg --batch --with-colons --fingerprint "$KEYID" \
            | awk -F: '/^fpr/ {print "signing key fingerprint: " $10; exit}'

      - name: Delete the imported GPG key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - name: Attest build provenance for the released binaries
        # Independent of the GPG lane and NOT secret-gated: provenance is minted
        # from this workflow's own OIDC identity, so it works on the very next
        # release. `gh attestation verify` then proves a downloaded binary was
        # built by THIS workflow, from THIS repo, at THIS commit — which a
        # checksum published beside the binary can never establish.
        #
        # Skipped on dry_run: an attestation is a permanent, publicly queryable
        # record, and dry_run is defined as making no customer-facing change.
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # Explicit list rather than `assets/*`: that would also sweep in
          # SHA256SUMS, the detached .asc signatures and the public key (whose
          # integrity the GPG signature already carries) and, on a mandatory
          # release, connect-update.json. Every entry here is a shipped
          # executable or package, and each is always produced — the .deb/.rpm
          # are built unconditionally by package-linux — so no glob can go empty
          # and silently attest less than the release contains.
          subject-path: |
            assets/anyray-connect-darwin-arm64
            assets/anyray-connect-darwin-x64
            assets/anyray-connect-linux-arm64
            assets/anyray-connect-linux-x64
            assets/anyray-connect-windows-x64.exe
            assets/*.deb
            assets/*.rpm

      - name: Mark the release mandatory (optional)
        # anyray-connect self-updates on a ~30 min tick and reads this asset ONLY
        # when the developer opted out (`anyray-connect update --auto off`). A
        # minVersion above their installed version overrides that opt-out — the
        # lever for a security or correctness fix, not for ordinary releases.
        # Absent asset (the normal case) = the opt-out stands.
        if: ${{ github.event.inputs.min_version != '' }}
        env:
          # Via env (not inline) so the dispatch input can't be shell-injected.
          MIN_VERSION: ${{ github.event.inputs.min_version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$MIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::min_version must be a plain semver (e.g. 0.11.72)"
            exit 1
          fi
          # A floor above the binaries in this very release can never be met:
          # the updater refuses to install a version that would still leave the
          # machine below it, so the release would be a silent no-op for exactly
          # the opted-out seats it was cut to reach. Fail loudly instead.
          if [[ "$(printf '%s\n%s\n' "$MIN_VERSION" "$VERSION" | sort -V | head -n1)" != "$MIN_VERSION" ]]; then
            echo "::error::min_version ($MIN_VERSION) is above the version being released ($VERSION); no machine could satisfy it."
            exit 1
          fi
          jq -n --arg min "$MIN_VERSION" '{minVersion: $min}' > assets/connect-update.json
          cat assets/connect-update.json

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          STAGING: ${{ inputs.staging }}
        run: |
          set -euo pipefail
          # A staging release is the SAME signed, notarized, checksummed asset
          # set — only where it lands differs. Separate tag, and never `latest`.
          #
          # `--latest=false` IS THE WHOLE SAFETY PROPERTY, and it is the same
          # hazard the fleetd lane documents: `connect.sh`, `connect.ps1` and
          # the self-updater all fetch from `releases/latest/download`, and
          # GitHub hands "latest" to whichever release published most recently.
          # Without it, publishing a staging build would silently become the
          # binary every developer and every fleet machine downloads — a
          # staging lane that ships to production is worse than no staging lane.
          if [ "$STAGING" = "true" ]; then
            TAG="connect-staging-v${VERSION}"
          else
            TAG="connect-v${VERSION}"
          fi
          # Notes go through a file rather than an inline --notes string: the
          # verification section is multi-line. Static prose lives in QUOTED
          # heredocs (nothing expands, so no shell metacharacter in the markdown
          # can ever be interpreted); the two dynamic values are printf'd
          # separately. Code samples are 4-space-indented blocks, not fenced —
          # keeps backticks out of the shell entirely.
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "Standalone \`anyray-connect\` ${VERSION} executables for the zero-install \`connect.sh\` / \`connect.ps1\` installers. No Node required. Built from the public npm package."
            cat <<'NOTESHEAD'
          ## Verifying what you downloaded
          NOTESHEAD
            # Only advertise the OpenPGP path when the signature is really
            # here. Until the release key is provisioned it is not, and notes
            # promising an asset that does not exist are worse than silence.
            if [ -f assets/SHA256SUMS.asc ]; then
              cat <<'NOTESGPG'

          SHA256SUMS carries a detached OpenPGP signature, SHA256SUMS.asc, made with the Anyray release key published here as anyray-connect-signing-key.asc. Check the checksum file before you trust any checksum in it:

              gpg --import anyray-connect-signing-key.asc
              gpg --verify SHA256SUMS.asc SHA256SUMS
              sha256sum --ignore-missing --check SHA256SUMS

          Compare the fingerprint gpg reports on import against the one recorded in RELEASING.md before trusting the key.
          NOTESGPG
            fi
            cat <<'NOTESPROV'

          Every executable and package here also carries build provenance, attested to the workflow, repository and commit that produced it. This is independent of the checksums, and lets you establish where a file came from without trusting this page:

          NOTESPROV
            printf '    gh attestation verify anyray-connect-linux-x64 --repo %s\n' "$REPO"
          } > "$NOTES"
          cat "$NOTES"
          # Idempotent: replace an existing release for this version.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ "$STAGING" = "true" ]; then
            gh release create "$TAG" \
              --title "anyray-connect ${VERSION} (staging binaries)" \
              --notes "Staging build of anyray-connect ${VERSION}, for testing before a customer-facing release. Same signing and checksums as a real release; deliberately NOT \`latest\`, so \`connect.sh\`, \`connect.ps1\` and the self-updater are unaffected and no customer receives this build. Fetch a binary by its explicit tag URL, never through \`releases/latest/download\`." \
              --latest=false \
              --prerelease \
              assets/*
            # Say it out loud in the log: a human reading a green run needs to
            # see that `latest` did not move.
            echo "Published STAGING release $TAG (pre-release, not latest)."
            gh release view --json tagName,isLatest,isPrerelease \
              --jq '"verify: tag=\(.tagName) isLatest=\(.isLatest) isPrerelease=\(.isPrerelease)"' "$TAG"
            # Fail rather than leave a staging build masquerading as the real
            # one. `--latest=false` is the guard; this proves it took effect.
            if [ "$(gh release view "$TAG" --json isLatest --jq .isLatest)" != "false" ]; then
              echo "::error::staging release $TAG became 'latest' — connect.sh and the self-updater would serve it to every customer"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --title "anyray-connect ${VERSION} (binaries)" \
              --notes-file "$NOTES" \
              assets/*
          fi

      # dry_run: prove the whole build->sign->notarize->fleet path without a
      # customer-facing release. The signed, checksummed asset set is inspectable.
      - name: Upload assembled assets (dry run — not published)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-release-assets
          path: assets/
          if-no-files-found: error
