name: Release anyray-connect binaries

# Compiles the published `anyray-connect` npm package into standalone,
# zero-dependency executables (no Node required on the developer's machine) and
# attaches them to a GitHub Release here. The hosted `connect.sh` / `connect.ps1`
# installers download these so a developer can connect with a single curl/irm
# line — nothing to install.
#
# Source of truth is the PUBLIC npm package (anyray-connect), so this workflow
# never needs access to the private monorepo. Run it after publishing a new
# anyray-connect version to npm.
#
# Code signing (RFC 0010 §6, setting names in RELEASING.md): the darwin
# binaries are Developer ID-signed + notarized on an on-demand Mac; the macOS
# MDM package is additionally Installer-signed, notarized, and stapled; the Windows
# binary is Authenticode-signed by jsign against a certificate held by **Azure
# Artifact Signing** (on the LINUX runner — jsign is pure Java, so no Windows
# runner is involved), and the linux binaries are additionally packaged as
# .deb/.rpm and GPG detach-signed. SHA256SUMS is generated in the release job,
# AFTER signing, because signing rewrites the binaries.
#
# EVERY LANE IS MANDATORY, and `signing-preflight` enforces that before anything
# builds — see its comment for why. The per-step `if: env.X != ''` gates below
# are retained (they make an unconfigured fork fail legibly rather than deep
# inside a signer) but on a real release they can no longer be false. Do not
# reintroduce "unset means skip" as the release posture: that is precisely how
# every connect release to date shipped an unsigned `.exe`.
#
# Release integrity (two independent paths, both in the release job):
#   - SHA256SUMS is GPG detach-signed to SHA256SUMS.asc with the same release
#     key, so the checksum file the installers fetch is not merely self-
#     consistent with a release an attacker could have rewritten end to end.
#     Mandatory, like the package signing above.
#   - actions/attest-build-provenance records signed build provenance for every
#     shipped executable and package. Not secret-gated — it runs off the
#     workflow's OIDC identity — so `gh attestation verify` works from the next
#     release onwards.
# connect.sh / connect.ps1 verify checksums today but do NOT yet require either
# signature; making that mandatory is a deliberate follow-up, and it can only
# land after a real release has actually published these assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'anyray-connect npm version to compile (e.g. 0.3.0, or "latest")'
        required: true
        default: 'latest'
      min_version:
        description: 'MANDATORY release: install on machines below this version even if they opted out (blank = normal release)'
        required: false
        default: ''
      dry_run:
        description: 'Test run: build + sign + notarize + exercise the on-demand Mac fleet, but do NOT publish a GitHub release (no customer-facing change). Signed assets are uploaded as a workflow artifact for inspection.'
        required: false
        type: boolean
        default: false
      staging:
        description: 'Staging release: publish the SAME signed assets under a connect-staging-v<version> pre-release tag, so a tester can fetch a real build by URL without changing anything customers receive. Ignored when dry_run is set.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # EVERY signing lane must be configured before anything is built.
  #
  # Each lane below is individually gated on one secret/variable being non-empty
  # (`if: env.X != ''`), which was the right posture while they were being landed
  # one at a time — a half-configured repo still cut releases. It is the wrong
  # posture now, and it has already cost us the thing it was supposed to make
  # safe: `AWS_SIGNING_ROLE_ARN` was never set, so the Windows job skipped in
  # silence and EVERY connect release to date shipped an unsigned `.exe`. Nobody
  # noticed for a year, because a skipped step and a signed one look identical
  # from the outside — both are a green run with assets attached.
  #
  # So the gate moved here, ahead of the work: an unconfigured lane fails the
  # release instead of quietly downgrading it. The per-step `if:` conditions stay
  # exactly as they are — with this job as a `needs:` on the signers, they can no
  # longer evaluate false on a real release, and they still let a hand-run in a
  # fork (where no secrets exist) fail here with one legible message instead of
  # deep inside jsign.
  #
  # Adding a signing lane means adding it to this list. If a lane is ever
  # deliberately retired, delete its entry here in the same commit — never leave
  # it listed and unset, which is how this trap re-arms.
  signing-preflight:
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      # A step `if:` cannot read `secrets.*`, and neither can a job-level `if:` —
      # so the values are mapped into env and checked in a `run:` block, the same
      # shape the per-lane gates already use.
      APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
      AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_PROFILE: ${{ vars.AZURE_SIGNING_ACCOUNT_PROFILE }}
      LINUX_SIGNING_GPG_KEY: ${{ secrets.LINUX_SIGNING_GPG_KEY }}
      LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
    steps:
      - name: Every signing lane must be configured
        run: |
          set -euo pipefail
          missing=''
          # Only the NAMES are echoed on failure, never the values — several of
          # these are credentials and this repository is public.
          for name in \
            APPLE_SIGNING_CERT_P12 APPLE_SIGNING_CERT_PASSWORD \
            APPLE_INSTALLER_CERT_P12 APPLE_INSTALLER_CERT_PASSWORD \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID \
            AZURE_SIGNING_CLIENT_ID AZURE_SIGNING_TENANT_ID \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT_PROFILE \
            LINUX_SIGNING_GPG_KEY LINUX_SIGNING_GPG_PASSPHRASE; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::signing is not fully configured — refusing to cut a release that would ship unsigned or unverifiable artifacts. Missing:$missing (see RELEASING.md for where each one comes from)"
            exit 1
          fi
          echo 'all signing lanes configured: macOS (Developer ID + notarization), Windows (Azure Artifact Signing), Linux (GPG)'

  build:
    needs: signing-preflight
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # >= 1.3.6. On 1.3.5 `--compile-exec-argv` (added below by #335 for
          # system-CA trust) prepends the exec argv to the REAL argv and parses
          # the lot in one pass, so Bun ate the leading run of the CLI's own
          # flags before connect saw them: `--help`/`-h` printed BUN's help,
          # `--version`/`-v` printed BUN's version (1.3.5) instead of connect's,
          # and `-y`/`-V` died `error: Invalid Argument` with exit 1 — `-y` being
          # the documented scripted-rollout flag. Parsing stopped at the first
          # positional, so `connect sync -y` worked and `connect -y` did not,
          # which is why it read as a cosmetic help-text nit for a whole release.
          #
          # Do NOT "fix" this by appending `--` or a sentinel to the exec-argv
          # string. It does stop Bun eating the flags — by silently dropping
          # --use-system-ca, reinstating the #335 TLS-interception bug. The flag
          # still shows up in process.execArgv, so it looks correct; only a real
          # trust-store probe (validate-artifacts.yml) catches it. The two
          # behaviours are the same parse pass on 1.3.5 and cannot be separated.
          bun-version: '1.3.14'

      - name: Fetch the published package
        id: pkg
        env:
          # Via env (not inline) so the dispatch input can't be shell-injected.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Validate the input shape: a semver or the literal 'latest'.
          case "$VERSION_INPUT" in
            latest|[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::invalid version input: $VERSION_INPUT"; exit 1 ;;
          esac
          npm pack "anyray-connect@${VERSION_INPUT}"
          tar xzf anyray-connect-*.tgz
          # Resolve the concrete version even when 'latest' was requested.
          VERSION="$(node -p "require('./package/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          test -f package/dist/index.js
          test -f package/native/macos/Package.swift

      - name: Install runtime dependencies for bundling
        working-directory: package
        run: |
          set -euo pipefail
          # anyray-connect gained a runtime dep (zod) on 2026-07-20; the packed
          # npm tarball ships dist/ but no node_modules, so `bun build --compile`
          # can't resolve the bare `import { z } from "zod"`. Install prod deps
          # here for Bun to bundle into each --compile output — the emitted
          # binaries stay self-contained; the dep only has to exist at build time.
          # --ignore-scripts: never run lifecycle scripts from fetched deps.
          bun install --production --ignore-scripts

      - name: Compile standalone binaries (Bun)
        run: |
          set -euo pipefail
          mkdir -p out
          # Bun target -> output asset name. Windows gets a .exe.
          #
          # --compile-exec-argv="--use-system-ca": trust the CA roots the MACHINE
          # trusts, not only Bun's bundled Mozilla list. Behind a TLS-inspecting
          # corporate proxy the MDM installs a root into the system store; curl
          # reads that store and the binary did not, so `curl … | sh` downloaded
          # fine and the very next step failed `SELF_SIGNED_CERT_IN_CHAIN`
          # against app.anyray.ai. The remedy we printed (NODE_EXTRA_CA_CERTS)
          # fixes one shell but NOT the LaunchAgent daemon or the drift watcher,
          # which never inherit it — so those kept failing silently.
          #
          # It ADDS to the bundled roots rather than replacing them (verified: a
          # system store holding ONLY a private root still verifies app.anyray.ai,
          # registry.npmjs.org and api.github.com), so public TLS is unaffected.
          #
          # A compiled binary cannot take this from argv or BUN_OPTIONS — both are
          # ignored — so it has to be baked in at build time. Bun does NOT validate
          # the string: a typo compiles and runs, silently unflagged. The guard a
          # typo cannot survive is connect/src/binarySmoke.test.ts in the monorepo
          # ("standalone binary trusts the machine's CA store"), which checks it
          # against a real system trust store. Keep this flag and that test in step.
          build() {
            bun build --compile --minify --compile-exec-argv="--use-system-ca" \
              --target="$1" package/dist/index.js --outfile "out/$2"
          }
          build bun-darwin-arm64  anyray-connect-darwin-arm64
          build bun-darwin-x64    anyray-connect-darwin-x64
          build bun-linux-x64     anyray-connect-linux-x64
          build bun-linux-arm64   anyray-connect-linux-arm64
          build bun-windows-x64   anyray-connect-windows-x64.exe
          # SHA256SUMS is generated in the release job, after the signing jobs
          # — codesign/jsign rewrite the binaries, so a checksum taken here
          # would not match the released bytes.
          ls -lh out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-unsigned
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-helper-source
          path: package/native/macos/
          if-no-files-found: error

  # Developer ID-signs + notarizes the two darwin binaries. The per-step gates
  # below still check the Apple secrets, but `signing-preflight` has already
  # failed the run if any is missing, so on a real release they cannot be false
  # and an unsigned binary cannot pass through.
  # Allocate a macOS signing runner ON DEMAND: create the MAC_ARM CodeBuild
  # fleet + ephemeral runner project, with teardown-mac removing the runner.
  # Runs on the Linux runner and assumes a scoped GitHub-OIDC role to drive the
  # fleet lifecycle (scripts/mac-fleet.sh).
  #
  # Cost is one 24h-minimum EC2 Mac charge per DAY the lane runs, not per
  # release: teardown deliberately leaves the fleet so every run inside that
  # already-paid window reuses the same Mac. Deleting it per release re-bought
  # the minimum each time (~$720/mo for 2.7h of use) — see `down` in
  # scripts/mac-fleet.sh.
  provision-mac:
    needs: build
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write # assume the fleet-lifecycle role via OIDC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_MAC_FLEET_ROLE_ARN }}
          aws-region: eu-central-1
      - run: ./scripts/mac-fleet.sh up

  # Developer ID-signs + notarizes the two darwin binaries and the universal
  # macOS installer on the on-demand Mac
  # using Apple's own codesign + notarytool — the only tooling that correctly
  # signs Bun-compiled binaries (rcodesign/quill mishandle the x64 Mach-O and
  # produce a signature that verifies but won't launch; proven by E2E).
  sign-macos:
    needs: [build, provision-mac]
    runs-on: codebuild-anyray-install-runner-mac-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # GitHub Actions can't read `secrets.*` in a step `if:` — map the secrets
      # into job env and gate each step on `env.X != ''` instead.
      APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-helper-source
          path: native/macos

      - name: Build the universal macOS package payload
        run: |
          set -euo pipefail
          arm_scratch="$RUNNER_TEMP/anyray-helper-arm64"
          x64_scratch="$RUNNER_TEMP/anyray-helper-x64"
          swift build --package-path native/macos --configuration release \
            --product anyray-device-proof --arch arm64 --scratch-path "$arm_scratch"
          swift build --package-path native/macos --configuration release \
            --product anyray-device-proof --arch x86_64 --scratch-path "$x64_scratch"
          arm_bin_dir="$(swift build --package-path native/macos --configuration release \
            --product anyray-device-proof --arch arm64 --scratch-path "$arm_scratch" \
            --show-bin-path)"
          x64_bin_dir="$(swift build --package-path native/macos --configuration release \
            --product anyray-device-proof --arch x86_64 --scratch-path "$x64_scratch" \
            --show-bin-path)"
          test -x "$arm_bin_dir/anyray-device-proof"
          test -x "$x64_bin_dir/anyray-device-proof"

          root="$RUNNER_TEMP/anyray-connect-pkgroot"
          scripts="$RUNNER_TEMP/anyray-connect-pkgscripts"
          mkdir -p \
            "$root/usr/local/bin" \
            "$root/usr/local/lib/anyray-connect" \
            "$root/Library/LaunchAgents" \
            "$scripts"
          lipo -create \
            out/anyray-connect-darwin-arm64 \
            out/anyray-connect-darwin-x64 \
            -output "$root/usr/local/bin/anyray-connect"
          lipo -create \
            "$arm_bin_dir/anyray-device-proof" \
            "$x64_bin_dir/anyray-device-proof" \
            -output "$root/usr/local/lib/anyray-connect/anyray-device-proof"
          chmod 0755 \
            "$root/usr/local/bin/anyray-connect" \
            "$root/usr/local/lib/anyray-connect/anyray-device-proof"

          cat > "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>ai.anyray.connect.managed-enroll</string>
            <key>ProgramArguments</key>
            <array>
              <string>/usr/local/bin/anyray-connect</string>
              <string>__anyray-managed-enroll</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
            <!-- Package after profile: RunAtLoad enrolls immediately. Package
                 before profile: WatchPaths starts the job when MDM creates the
                 preference. A later transient enrollment failure exits nonzero
                 and KeepAlive retries it, throttled to five minutes. -->
            <key>WatchPaths</key>
            <array>
              <string>/Library/Managed Preferences/ai.anyray.connect.plist</string>
            </array>
            <key>KeepAlive</key>
            <dict>
              <key>SuccessfulExit</key>
              <false/>
            </dict>
            <key>ThrottleInterval</key>
            <integer>300</integer>
            <key>ProcessType</key>
            <string>Background</string>
            <key>LimitLoadToSessionType</key>
            <string>Aqua</string>
            <key>StandardOutPath</key>
            <string>/dev/null</string>
            <key>StandardErrorPath</key>
            <string>/dev/null</string>
          </dict>
          </plist>
          PLIST
          chmod 0644 "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist"
          plutil -lint "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist"
          test "$(plutil -extract RunAtLoad raw -o - \
            "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist")" = true
          test "$(plutil -extract WatchPaths.0 raw -o - \
            "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist")" \
            = '/Library/Managed Preferences/ai.anyray.connect.plist'
          test "$(plutil -extract KeepAlive.SuccessfulExit raw -o - \
            "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist")" = false
          test "$(plutil -extract ThrottleInterval raw -o - \
            "$root/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist")" = 300

          cat > "$scripts/postinstall" <<'SCRIPT'
          #!/bin/sh
          # Load the agent for the current desktop user. New logins are handled
          # automatically by /Library/LaunchAgents.
          console_user="$(/usr/bin/stat -f '%Su' /dev/console 2>/dev/null || true)"
          case "$console_user" in
            ''|root|loginwindow|_mbsetupuser) exit 0 ;;
          esac
          console_uid="$(/usr/bin/id -u "$console_user" 2>/dev/null || true)"
          [ -n "$console_uid" ] || exit 0
          domain="gui/$console_uid"
          label="$domain/ai.anyray.connect.managed-enroll"
          agent='/Library/LaunchAgents/ai.anyray.connect.managed-enroll.plist'
          /bin/launchctl bootout "$label" >/dev/null 2>&1 || true
          /bin/launchctl bootstrap "$domain" "$agent" >/dev/null 2>&1 || true
          /bin/launchctl kickstart -k "$label" >/dev/null 2>&1 || true
          exit 0
          SCRIPT
          chmod 0755 "$scripts/postinstall"

          lipo -archs "$root/usr/local/bin/anyray-connect" | grep -q 'arm64'
          lipo -archs "$root/usr/local/bin/anyray-connect" | grep -q 'x86_64'
          lipo -archs "$root/usr/local/lib/anyray-connect/anyray-device-proof" | grep -q 'arm64'
          lipo -archs "$root/usr/local/lib/anyray-connect/anyray-device-proof" | grep -q 'x86_64'

      - name: Sign the darwin binaries and package payload (Developer ID Application)
        if: env.APPLE_SIGNING_CERT_P12 != ''
        run: |
          set -euo pipefail
          # Throwaway keychain: the cert never touches the login keychain and
          # the always() step below destroys it even when signing fails.
          KEYCHAIN="$RUNNER_TEMP/anyray-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf '%s' "$KEYCHAIN_PASSWORD" \
            > "$RUNNER_TEMP/anyray-keychain-password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No inactivity auto-lock — a long notarization wait must not lock the
          # key out mid-build.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign resolves signing identities through the DEFAULT keychain and
          # the SESSION search list — not the `-d user` list. On a fresh CI Mac
          # those point at an empty login keychain, so `find-identity` (which
          # takes an explicit keychain arg) sees the identity but `codesign
          # --sign <hash>` reports "no identity found". Make the throwaway
          # keychain the default and put it on the session search list.
          security default-keychain -s "$KEYCHAIN"
          printf '%s' "$APPLE_SIGNING_CERT_P12" | base64 -d > "$RUNNER_TEMP/signing-cert.p12"
          security import "$RUNNER_TEMP/signing-cert.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$APPLE_SIGNING_CERT_PASSWORD" -A -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing-cert.p12"
          # Allow codesign to use the imported key non-interactively; the
          # command dumps key attributes on success, so discard its stdout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN"
          # Diagnostics: what actually landed in the throwaway keychain.
          echo "--- codesigning identities (all / valid-only) ---"
          security find-identity -p codesigning "$KEYCHAIN" || true
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          # Select by name WITHOUT -v: on a fresh CI keychain the Developer ID
          # chain often can't establish anchor trust for the `-v` validity
          # filter (no login keychain, no OCSP), so `-v` hides an identity that
          # signs perfectly well. The key + cert are ours; codesign validates
          # the real signature afterwards.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_CERT_P12 imported no Developer ID Application identity (see diagnostics above)"
            exit 1
          fi
          echo "using signing identity $IDENTITY"
          # Bun-compiled binaries embed JavaScriptCore, which allocates JIT
          # pages at startup; the hardened runtime (mandatory for notarization)
          # forbids that without the allow-jit entitlement, and the signed
          # binary then dies on EVERY machine with "Ran out of executable
          # memory" the moment it launches. Caught by the local E2E rehearsal
          # (signed + notarized real v0.11.81 binaries; allow-jit alone is the
          # minimal sufficient set — keep it minimal, each extra entitlement
          # weakens the hardening story the EDR/transparency docs sell).
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Artifact transfer strips file modes (actions/upload-artifact v4
          # documents this) — the post-sign smoke run below would otherwise die
          # with "Permission denied". Harmless for the published assets: both
          # consumers (connect.sh, selfUpdate.ts) chmod after download.
          chmod +x out/anyray-connect-darwin-*
          for bin in out/anyray-connect-darwin-*; do
            codesign --force --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --identifier ai.anyray.connect --sign "$IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            # The signed binary must still RUN — a signature that verifies but
            # aborts at launch is exactly the failure the entitlement fixes.
            # Only the arm64 slice can execute on the arm64 runner.
            case "$bin" in
              *darwin-arm64) "$bin" --help > /dev/null ;;
            esac
          done

          root="$RUNNER_TEMP/anyray-connect-pkgroot"
          universal_connect="$root/usr/local/bin/anyray-connect"
          helper="$root/usr/local/lib/anyray-connect/anyray-device-proof"
          codesign --force --options runtime --timestamp \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --identifier ai.anyray.connect --sign "$IDENTITY" "$universal_connect"

          # Derive the Apple Team Identifier from the identity that actually
          # signed a probe copy. Do not duplicate it in a repo variable: the
          # certificate is the authority, and validating the fixed shape before
          # writing XML prevents a malformed value from becoming an entitlement.
          team_probe="$RUNNER_TEMP/anyray-device-proof-team-id-probe"
          cp "$helper" "$team_probe"
          codesign --force --sign "$IDENTITY" "$team_probe"
          codesign --verify --strict --verbose=2 "$team_probe"
          signature_metadata="$(codesign -d --verbose=4 "$team_probe" 2>&1)"
          TEAM_ID="$(printf '%s\n' "$signature_metadata" \
            | awk -F= '$1 == "TeamIdentifier" {print $2}')"
          if ! printf '%s\n' "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::could not derive a valid 10-character Apple Team Identifier from the Developer ID Application identity"
            exit 1
          fi
          rm -f "$team_probe"

          # The helper does no JIT. It gets only the identity entitlements that
          # let its permanent, non-exportable private key live in the user's
          # Data Protection Keychain. The Bun/main entitlement file above stays
          # unchanged and continues to contain allow-jit only.
          helper_application_id="${TEAM_ID}.ai.anyray.connect.device-proof"
          cat > "$RUNNER_TEMP/device-proof-entitlements.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.application-identifier</key>
            <string>${helper_application_id}</string>
            <key>com.apple.developer.team-identifier</key>
            <string>${TEAM_ID}</string>
            <key>keychain-access-groups</key>
            <array>
              <string>${helper_application_id}</string>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/device-proof-entitlements.plist"
          codesign --force --options runtime --timestamp \
            --entitlements "$RUNNER_TEMP/device-proof-entitlements.plist" \
            --identifier ai.anyray.connect.device-proof \
            --sign "$IDENTITY" "$helper"
          codesign --verify --strict --verbose=2 "$universal_connect"
          codesign --verify --strict --verbose=2 "$helper"

          # Verify the signature contains exactly the helper's three intended
          # entitlements. This catches an omitted entitlement file, a wrong Team
          # Identifier, or accidental inheritance of Bun's allow-jit permission.
          embedded_entitlements="$RUNNER_TEMP/device-proof-embedded-entitlements.plist"
          codesign -d --entitlements :- "$helper" > "$embedded_entitlements"
          plutil -lint "$embedded_entitlements"
          plutil -convert json -o - "$embedded_entitlements" \
            | jq -e --arg app_id "$helper_application_id" --arg team_id "$TEAM_ID" '
                type == "object"
                and ((keys | sort) == ([
                  "com.apple.application-identifier",
                  "com.apple.developer.team-identifier",
                  "keychain-access-groups"
                ] | sort))
                and .["com.apple.application-identifier"] == $app_id
                and .["com.apple.developer.team-identifier"] == $team_id
                and .["keychain-access-groups"] == [$app_id]
              ' > /dev/null

          # Exercise the exact operation Connect uses with a fresh, canonical
          # gateway-verification challenge. Creating and using the permanent key
          # here proves the signed helper can access the Data Protection Keychain.
          issued_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          nonce="$(openssl rand -hex 16)"
          challenge="$(jq -cnS \
            --arg deployment_id 'dep_release_smoke' \
            --arg issued_at "$issued_at" \
            --arg nonce "$nonce" \
            '{deploymentId: $deployment_id, issuedAt: $issued_at, nonce: $nonce}')"
          encoded_challenge="$(printf '%s' "$challenge" \
            | openssl base64 -A \
            | tr '+/' '-_' \
            | tr -d '=')"
          sign_request="$(jq -cn --arg data "$encoded_challenge" \
            '{v: 1, operation: "sign", data: $data}')"
          sign_response="$(printf '%s' "$sign_request" | "$helper")"
          printf '%s\n' "$sign_response" | jq -e '
            type == "object"
            and ((keys | sort) == (["devPublicKey", "operation", "signature", "v"] | sort))
            and .v == 1
            and .operation == "sign"
            and (.devPublicKey | type == "string"
              and startswith("-----BEGIN PUBLIC KEY-----\n")
              and contains("\n-----END PUBLIC KEY-----"))
            and (.signature | type == "string" and test("^[A-Za-z0-9_-]+$"))
          ' > /dev/null
          "$universal_connect" --help > /dev/null

      - name: Notarize the darwin binaries
        # Needs the Developer ID signature from the step above plus the App
        # Store Connect API key. A bare mach-o binary CANNOT be stapled —
        # `xcrun stapler staple` only applies to bundles/dmg/pkg — so the
        # notarized binary ships as-is and Gatekeeper fetches the ticket online.
        # SEAM (RFC 0010 tray .app): when the desktop tray ships as a .app
        # bundle, extend this job to sign the bundle, notarize its zip, then
        # `xcrun stapler staple` the .app so first launch verifies offline.
        if: env.APPLE_SIGNING_CERT_P12 != '' && env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_KEY" | base64 -d > "$RUNNER_TEMP/notary-key.p8"
          for bin in out/anyray-connect-darwin-*; do
            zip="$RUNNER_TEMP/$(basename "$bin").zip"
            ditto -c -k "$bin" "$zip"
            status="$(xcrun notarytool submit "$zip" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json | jq -r '.status // "unknown"')"
            if [ "$status" != "Accepted" ]; then
              echo "::error::notarization failed for $(basename "$bin") (status: $status)"
              exit 1
            fi
          done

      - name: Build and sign the macOS installer (Developer ID Installer)
        if: env.APPLE_INSTALLER_CERT_P12 != ''
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anyray-connect-pkgroot"
          scripts="$RUNNER_TEMP/anyray-connect-pkgscripts"
          unsigned_pkg="$RUNNER_TEMP/anyray-connect-unsigned.pkg"
          pkgbuild \
            --root "$root" \
            --scripts "$scripts" \
            --identifier ai.anyray.connect \
            --version "$VERSION" \
            --install-location / \
            --ownership recommended \
            "$unsigned_pkg"

          KEYCHAIN="$RUNNER_TEMP/anyray-signing.keychain-db"
          KEYCHAIN_PASSWORD_FILE="$RUNNER_TEMP/anyray-keychain-password"
          # The application-signing step created this keychain. Keep its random
          # password only in a 0600 file between steps; never put it in output.
          test -f "$KEYCHAIN_PASSWORD_FILE"
          KEYCHAIN_PASSWORD="$(cat "$KEYCHAIN_PASSWORD_FILE")"
          printf '%s' "$APPLE_INSTALLER_CERT_P12" \
            | base64 -d > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "$KEYCHAIN" -f pkcs12 \
            -P "$APPLE_INSTALLER_CERT_PASSWORD" -A -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/installer-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN"
          echo '--- installer identities in the throwaway keychain ---'
          security find-identity -v "$KEYCHAIN" || true
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" \
            | awk '/Developer ID Installer/ {print $2; exit}')"
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::APPLE_INSTALLER_CERT_P12 imported no Developer ID Installer identity (see diagnostics above)"
            exit 1
          fi
          echo "using installer signing identity $INSTALLER_IDENTITY"
          productsign --sign "$INSTALLER_IDENTITY" \
            "$unsigned_pkg" out/anyray-connect.pkg
          pkgutil --check-signature out/anyray-connect.pkg
          payload_files="$(pkgutil --payload-files out/anyray-connect.pkg)"
          printf '%s\n' "$payload_files"
          printf '%s\n' "$payload_files" | grep -Eq '^\.?/?usr/local/bin/anyray-connect$'
          printf '%s\n' "$payload_files" \
            | grep -Eq '^\.?/?usr/local/lib/anyray-connect/anyray-device-proof$'
          printf '%s\n' "$payload_files" \
            | grep -Eq '^\.?/?Library/LaunchAgents/ai\.anyray\.connect\.managed-enroll\.plist$'

      - name: Notarize and staple the macOS installer
        if: env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          pkg=out/anyray-connect.pkg
          status="$(xcrun notarytool submit "$pkg" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | jq -r '.status // "unknown"')"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed for anyray-connect.pkg (status: $status)"
            exit 1
          fi
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl -a -vvv -t install "$pkg"

      - name: Delete the throwaway keychain
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/signing-cert.p12" \
            "$RUNNER_TEMP/installer-cert.p12" \
            "$RUNNER_TEMP/notary-key.p8" \
            "$RUNNER_TEMP/anyray-keychain-password" \
            "$RUNNER_TEMP/anyray-device-proof-team-id-probe" \
            "$RUNNER_TEMP/device-proof-entitlements.plist" \
            "$RUNNER_TEMP/device-proof-embedded-entitlements.plist" \
            "$RUNNER_TEMP/anyray-connect-unsigned.pkg"
          if [ -f "$RUNNER_TEMP/anyray-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/anyray-signing.keychain-db"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-darwin
          path: |
            out/anyray-connect-darwin-*
            out/anyray-connect.pkg
          if-no-files-found: error

  # Always remove the RUNNER, even if signing failed — the webhook is the part a
  # fork actor could otherwise reach. The fleet is left in place on purpose: the
  # Mac's 24h minimum is already paid and is not refunded by deleting it, so
  # releasing it early only makes the next run re-buy the window. AWS reclaims
  # the host when the window closes. Runs on the Linux runner with the same OIDC
  # lifecycle role.
  teardown-mac:
    needs: sign-macos
    if: ${{ always() }}
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_MAC_FLEET_ROLE_ARN }}
          aws-region: eu-central-1
      - run: ./scripts/mac-fleet.sh down

  # Authenticode-signs the windows binary through Azure Artifact Signing
  # (formerly Trusted Signing), driven by jsign. The per-step
  # `AZURE_SIGNING_CLIENT_ID` gates below are retained, but the lane is no longer
  # "inert until configured": `signing-preflight` fails the run when any of the
  # four Azure variables is missing, so an unset lane is a failed release rather
  # than a silently unsigned `.exe` — which is exactly how this lane shipped
  # unsigned binaries for a year.
  #
  # WHY NOT A .pfx, WHICH THIS JOB ONCE EXPECTED. Since June 2023 the
  # CA/Browser Forum requires code-signing private keys to live on FIPS 140-2
  # Level 2 hardware, so no CA issues an exportable PFX for an OV/EV
  # code-signing certificate any more. The old `signtool /f cert.pfx /p pass`
  # shape could therefore never have been fed by a certificate bought today —
  # the job was not merely dormant, it was written against a model that no
  # longer exists. A hardware token is equally unusable here: there is no USB
  # port on a cloud runner. That leaves a cloud-held key.
  #
  # WHY AZURE, HAVING PREVIOUSLY CHOSEN AWS KMS. The KMS lane was correct in
  # shape and never ran: KMS stores only a private key, so it still needed an
  # OV/EV certificate bought from a CA in the Microsoft Trusted Root Program
  # (~$200-600/yr) issued against a CSR from that key. That certificate was
  # never purchased, so `AWS_SIGNING_ROLE_ARN` stayed unset and every release to
  # date shipped an unsigned .exe. Azure is itself the CA: one $9.99/mo
  # subscription covers key custody AND the certificate, and the identity
  # validation Anyray already completed (Othentic Labs LTD, Israel — on the
  # Public Trust eligibility list) is the same organization vetting a commercial
  # CA would have charged for. The second cloud is the price; a signing lane
  # that actually has a certificate behind it is what it buys. The KMS key
  # `alias/anyray-codesign-windows` is retired: disabled and scheduled for
  # deletion on 2026-09-23 (it never signed anything — CloudTrail evidence is in
  # RELEASING.md, "Decommissioning AWS").
  #
  # THE 3-DAY CERTIFICATE, AND WHY TIMESTAMPING IS LOAD-BEARING HERE. Azure
  # issues a fresh short-lived certificate per signing operation — 3 days of
  # validity, not the 1-3 years a purchased certificate carries. An
  # un-timestamped signature would therefore go invalid THREE DAYS after the
  # release, on every machine that already installed it. jsign enables
  # timestamping automatically for this storetype for exactly that reason, and
  # the verify step below asserts the countersignature independently rather than
  # trusting that behavior to stay true across a jsign bump.
  #
  # NO WINDOWS RUNNER. jsign is a pure-Java Authenticode implementation, so this
  # runs on the ordinary Linux runner: no CodeBuild windows fleet, no Windows
  # SDK download, no signtool, and specifically none of Microsoft's own
  # SignTool + .NET 8 + dlib stack, which is Windows-only. That keeps the
  # slowest and most fragile part of the old lane deleted.
  #
  # Apple's lane keeps using a p12 (`APPLE_SIGNING_CERT_P12`) because Apple
  # imposes no equivalent hardware requirement. The two are not inconsistent.
  #
  # SETUP. Order matters: the certificate's subject comes from the identity
  # validation Microsoft performs, not from anything in this file.
  #   1. Identity validation (portal only — the CLI cannot do this) must be
  #      Completed for the legal entity that should appear as the Windows
  #      publisher. Anyray's is `Othentic Labs LTD`. Confirm the name BEFORE
  #      creating the profile: it is baked into every certificate issued under
  #      it, and changing it means redoing validation.
  #   2. Create a certificate profile of type **Public Trust** against that
  #      validation. `PublicTrustTest` chains to a test root that Windows does
  #      NOT trust — it is for rehearsal only and must never sign a release.
  #   3. Register an Entra app, add a federated credential for this repo, and
  #      grant its service principal the **Artifact Signing Certificate Profile
  #      Signer** role. Scope it to the certificate profile, not the whole
  #      account — that role is what permits signing, and Owner/Contributor
  #      deliberately do NOT include it.
  #   4. Set the four `AZURE_SIGNING_*` repo variables below. None is a secret:
  #      OIDC federation means there is no client secret to store, which is the
  #      main reason to prefer it over a password-based service principal.
  sign-windows:
    needs: build
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      # Federated (OIDC) auth to Entra, so there is no client secret to store or
      # rotate. The token minted here is exchanged for an Azure access token
      # scoped to the signing API, good for ~1 hour.
      id-token: write
    env:
      # Non-secret coordinates; OIDC carries the credential. Gating on the
      # client id keeps the "unset means skip" posture the macOS lane uses.
      AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
      AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
      # Regional data-plane endpoint of the signing account, from the account's
      # Overview blade ("Account URI"). NOT the ARM management endpoint.
      # Paste the portal's value as-is: jsign normalizes the full URL form
      # (`https://neu.codesigning.azure.net/`) and the bare-host form the jsign
      # docs use to the identical request URL — verified by running both against
      # the live service, which produced byte-identical request URLs.
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      # "<account>/<certificate-profile>" — jsign's --alias for this storetype.
      AZURE_SIGNING_ACCOUNT_PROFILE: ${{ vars.AZURE_SIGNING_ACCOUNT_PROFILE }}
      # Bump both together. The checksum is of the GitHub release asset and was
      # cross-checked byte-identical against Maven Central (net/jsign/jsign).
      # TRUSTEDSIGNING requires jsign >= 7.0; do not downgrade below that.
      JSIGN_VERSION: '7.5'
      JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
    steps:
      # For scripts/verify-authenticode.py. This job did not check out the repo
      # before, because the old verify step shelled out to a package it
      # (incorrectly) expected to install.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      # Fail before doing any work if the lane is half-configured. A partial set
      # would otherwise surface as an opaque jsign or OAuth error minutes later.
      - name: Preflight — signing configuration must be complete
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        run: |
          set -euo pipefail
          missing=''
          [ -n "$AZURE_SIGNING_TENANT_ID" ] || missing="$missing AZURE_SIGNING_TENANT_ID"
          [ -n "$AZURE_SIGNING_ENDPOINT" ] || missing="$missing AZURE_SIGNING_ENDPOINT"
          [ -n "$AZURE_SIGNING_ACCOUNT_PROFILE" ] || missing="$missing AZURE_SIGNING_ACCOUNT_PROFILE"
          if [ -n "$missing" ]; then
            echo "::error::missing Azure signing configuration:$missing"
            exit 1
          fi
          # "<account>/<profile>" is jsign's --alias contract for this
          # storetype. Getting it wrong produces a 403 from the signing API that
          # reads like a permissions problem, so check the shape here instead.
          case "$AZURE_SIGNING_ACCOUNT_PROFILE" in
            */*/*|/*|*/) echo "::error::AZURE_SIGNING_ACCOUNT_PROFILE must be exactly '<account>/<certificate-profile>'"; exit 1 ;;
            */*) : ;;
            *) echo "::error::AZURE_SIGNING_ACCOUNT_PROFILE must be '<account>/<certificate-profile>', got a value with no '/'"; exit 1 ;;
          esac

          # ALLOW-LIST THE ENDPOINT. jsign POSTs the signing bearer token to
          # whatever host this names, so an unconstrained repo variable is an
          # outbound request with a config-controlled destination — the
          # `js/request-forgery` shape, in workflow config rather than code. An
          # `http://` value would put a token that can sign releases as Othentic
          # Labs LTD on the wire in clear; a wrong host would hand it to someone
          # else. Match on structure, never a substring: `.codesigning.azure.net`
          # as a dotted SUFFIX, so `evil-codesigning.azure.net.attacker.tld`
          # cannot pass (security-patterns.md, the URL-substring rule).
          # `https://<label>.codesigning.azure.net` with an optional trailing
          # slash and NOTHING else — no path, query or userinfo. A glob like
          # `https://*.codesigning.azure.net/` looks right and is not: `*`
          # matches slashes, so `https://attacker.tld/?x=.codesigning.azure.net`
          # satisfies it. Anchoring the whole string is what closes that, and
          # this rejected it under test.
          # Strip the scheme and any single trailing slash, then require what
          # remains to be a bare host: no slash left (so no path or query), no
          # '@' (no userinfo), only host characters.
          endpoint_host="${AZURE_SIGNING_ENDPOINT#https://}"
          endpoint_host="${endpoint_host%/}"
          case "$AZURE_SIGNING_ENDPOINT" in
            https://*)
              case "$endpoint_host" in
                *[!a-zA-Z0-9.-]*) endpoint_ok='' ;;                       # '/', '@', ':' …
                *[!/.].codesigning.azure.net) endpoint_ok=1 ;;            # dotted suffix
                *) endpoint_ok='' ;;
              esac
              ;;
            *) endpoint_ok='' ;;
          esac
          if [ -z "${endpoint_ok:-}" ]; then
            echo "::error::AZURE_SIGNING_ENDPOINT must be exactly https://<region>.codesigning.azure.net (the account's Account URI, no path or query), got '${AZURE_SIGNING_ENDPOINT}'"
            exit 1
          fi

          # A tenant id is a GUID and lands in a URL path. Cheap to prove.
          # 8-4-4-4-12 hex: written out as explicit character classes because a
          # glob's `?` matches ANY character, so `[0-9a-fA-F]????????` would
          # accept eight arbitrary bytes after one hex digit.
          hex='[0-9a-fA-F]'
          # shellcheck disable=SC2254 # intentional glob, must not be quoted
          case "$AZURE_SIGNING_TENANT_ID" in
            $hex$hex$hex$hex$hex$hex$hex$hex-$hex$hex$hex$hex-$hex$hex$hex$hex-$hex$hex$hex$hex-$hex$hex$hex$hex$hex$hex$hex$hex$hex$hex$hex$hex) : ;;
            *) echo "::error::AZURE_SIGNING_TENANT_ID must be a GUID (8-4-4-4-12 hex)"; exit 1 ;;
          esac

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Install jsign (pinned + checksum-verified)
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" \
            "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          echo "${JSIGN_SHA256}  $RUNNER_TEMP/jsign.jar" | sha256sum -c -

      # DELIBERATELY hand-rolled instead of `azure/login` or
      # `azure/trusted-signing-action`. connect 0.11.140-142 published to npm
      # with no binaries behind them because a merged PR introduced Azure
      # signing actions that the org Actions ALLOW-LIST did not carry: the run
      # died at startup, the dispatching job went green, and three releases
      # shipped nothing. Adding a new third-party action here would re-arm
      # exactly that trap in exactly this job. curl and jq are already on the
      # runner and need no allow-list entry, and the exchange below is a
      # documented OAuth2 client-credentials flow, not a private protocol.
      - name: Mint an Azure access token (GitHub OIDC → Entra federation)
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        run: |
          set -euo pipefail
          umask 077
          # `api://AzureADTokenExchange` is the fixed audience an Entra
          # federated credential expects; it is not a per-tenant value.
          #
          # The runtime token goes in via --config on stdin, NOT `-H`.
          # ACTIONS_ID_TOKEN_REQUEST_TOKEN is the ROOT credential of this chain
          # — it mints OIDC tokens for any audience for the life of the job —
          # and curl arguments are world-readable through /proc/<pid>/cmdline.
          # Protecting the two derived JWTs while passing this one in argv was
          # backwards.
          #
          # --proto-redir, not just --proto: --proto constrains the FIRST
          # transfer only, so with -L still on, a 307 would re-send the
          # Authorization header (and below, the assertion in the POST body) to
          # whatever host the redirect names, over any scheme.
          gh_jwt="$(printf 'header = "Authorization: Bearer %s"\n' \
              "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -fsSL --proto '=https' --proto-redir '=https' --config - \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | jq -er '.value')"
          # Mask FIRST. With client id and tenant id being non-secret repo
          # variables, this JWT alone mints the signing token — so a later `-v`
          # or `set -x` added while debugging would drop a live signing
          # credential into a PUBLIC repository's workflow log.
          echo "::add-mask::$gh_jwt"
          printf '%s' "$gh_jwt" > "$RUNNER_TEMP/gh-oidc.jwt"
          # Both JWTs travel via --data-urlencode @file rather than -d: curl
          # arguments are world-readable through /proc/<pid>/cmdline, and these
          # are bearer credentials.
          # --data-urlencode throughout rather than hand-encoded -d values: the
          # scope and assertion-type are full of ':' and '/' and a mis-encoded
          # one fails as an unhelpful "invalid_request".
          # --fail-with-body rather than -f: every way this exchange fails
          # (subject mismatch, missing role assignment, wrong tenant) is an
          # AADSTS code in the response body, and -f throws that body away,
          # leaving a bare `curl: (22)`. This lane's whole history is opaque
          # failures; the AADSTS code is the one thing that shortens the next
          # diagnosis. It stays fail-closed — the exit status is unchanged.
          if ! resp="$(curl -fsSL --fail-with-body \
            --proto '=https' --proto-redir '=https' \
            "https://login.microsoftonline.com/${AZURE_SIGNING_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=${AZURE_SIGNING_CLIENT_ID}" \
            --data-urlencode 'scope=https://codesigning.azure.net/.default' \
            --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            --data-urlencode "client_assertion@$RUNNER_TEMP/gh-oidc.jwt")"; then
            # Print only the two error fields, never the whole body.
            echo "::error::Entra token exchange failed: $(printf '%s' "$resp" \
              | jq -r '[.error, .error_description] | map(select(.)) | join(": ")' 2>/dev/null \
              | head -c 400)"
            exit 1
          fi
          access_token="$(printf '%s' "$resp" | jq -er '.access_token')"
          unset resp
          rm -f "$RUNNER_TEMP/gh-oidc.jwt"
          # Mask before the value can reach a log through any later command.
          echo "::add-mask::$access_token"
          printf '%s' "$access_token" > "$RUNNER_TEMP/azure-signing.token"

      - name: Sign the windows binary (jsign + Azure Artifact Signing)
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        run: |
          set -euo pipefail
          # --storepass takes the access token, passed as `file:` so the bearer
          # credential never enters argv — /proc/<pid>/cmdline is readable by
          # any process on the runner, and this token can sign releases.
          # VERIFIED against the pinned jsign 7.5, not just read in the docs: a
          # `file:` password signs successfully where the same file holding the
          # WRONG password fails, which is only possible if the prefix is being
          # resolved rather than passed through as a literal string.
          #
          # The token file is written with `printf '%s'` (no trailing newline)
          # because the file's bytes ARE the password.
          #
          # No --certfile: unlike the KMS path, the service returns the
          # certificate chain, and jsign makes an extra API call to fetch the
          # current one before signing. Supplying a chain here would be stale by
          # construction — Azure issues a new certificate per signing operation.
          #
          # No --tsaurl/--tsmode either: jsign turns timestamping on
          # automatically for this storetype precisely because the certificates
          # live 3 days. The verify step asserts the countersignature landed
          # rather than assuming that default holds.
          java -jar "$RUNNER_TEMP/jsign.jar" \
            --storetype TRUSTEDSIGNING \
            --keystore "$AZURE_SIGNING_ENDPOINT" \
            --storepass "file:$RUNNER_TEMP/azure-signing.token" \
            --alias "$AZURE_SIGNING_ACCOUNT_PROFILE" \
            --alg SHA-256 \
            --name 'Anyray Connect' \
            --url 'https://anyray.ai' \
            out/anyray-connect-windows-x64.exe

      # Verify OUT OF BAND rather than trusting jsign's exit code. A release
      # that reports success while shipping an unsigned binary is the failure
      # mode this whole lane exists to prevent, and it is exactly what the old
      # gated step did for months.
      #
      # THE PREVIOUS VERSION OF THIS STEP COULD NEVER HAVE RUN. It began
      # `sudo apt-get install osslsigncode`. This runner is
      # `amazonlinux2-x86_64-standard:5.0`, which despite its name is Amazon
      # Linux 2023: there is no apt, and osslsigncode is not in the AL2023
      # repositories either, so an `apt`->`dnf` swap would not have fixed it.
      # Nothing caught this because the job was gated on a variable that was
      # never set, so the whole lane skipped on every release. A verification
      # step that cannot execute is worse than none: it reads like a guarantee.
      #
      # So verification is now a checked-in script using only python3 and
      # openssl, both already on the runner — no package install, no compile,
      # nothing fetched at release time except the pinned trust anchor.
      #
      # It asserts five things, and each was rehearsed to FAIL on the case it
      # exists to catch (see the script's own header for the oracle comparison):
      #   1. a signature is present;
      #   2. the digest recomputed from the shipped bytes matches the digest the
      #      signature attests — the check that makes the others meaningful,
      #      since without it a signature lifted from another file would pass;
      #   3. the chain verifies to a PINNED anchor, not the system store;
      #   4. the signature is timestamped;
      #   5. the publisher is Othentic Labs LTD.
      #
      # THE ANCHOR IS A REAL TRUST ASSERTION, NOT A TAUTOLOGY. The KMS lane
      # verified against the very chain it had just signed with, which could only
      # ever answer "is this file signed by that certificate". Azure's chain is
      # public and fixed, so this pins the actual root — Microsoft Identity
      # Verification Root Certificate Authority 2020, the root Windows ships and
      # every Trusted Signing certificate chains to. A signature that verifies
      # against it is one Windows will accept, which is the question worth asking.
      # Microsoft's timestamp authority (`Microsoft Public RSA Timestamping CA
      # 2020`) chains to that SAME root — confirmed by fetching a live token from
      # timestamp.acs.microsoft.com and verifying its leaf against this exact
      # certificate — so one anchor covers both.
      #
      # WHAT COULD NOT BE REHEARSED is a real Azure-issued chain, because no
      # certificate profile existed when this was written. That the code-signing
      # leaf roots at this same CA is Microsoft's documented behavior, verified
      # here only for the TSA. If the first real run fails at "does not chain to
      # the pinned trust anchor" while jsign reports success, read the chain out
      # of the signature and re-pin — do NOT drop the anchor to make it pass.
      - name: Verify the signature
        if: env.AZURE_SIGNING_CLIENT_ID != ''
        env:
          # Published at aka.ms/RootCerts. Pinned by digest: a trust anchor
          # fetched over the network and used unverified is not an anchor.
          MS_ROOT_URL: 'https://www.microsoft.com/pkiops/certs/Microsoft%20Identity%20Verification%20Root%20Certificate%20Authority%202020.crt'
          MS_ROOT_SHA256: 5367f20c7ade0e2bca790915056d086b720c33c1fa2a2661acf787e3292e1270
          # The legal entity behind the Completed identity validation. This
          # account carries several validations, so a profile built against the
          # wrong one signs perfectly well under the wrong company name.
          EXPECT_PUBLISHER: 'Othentic Labs LTD'
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/ms-root.crt" "$MS_ROOT_URL"
          echo "${MS_ROOT_SHA256}  $RUNNER_TEMP/ms-root.crt" | sha256sum -c -
          # Distributed as DER; openssl verify wants PEM.
          openssl x509 -inform DER -in "$RUNNER_TEMP/ms-root.crt" \
            -out "$RUNNER_TEMP/ms-root.pem"
          python3 scripts/verify-authenticode.py \
            out/anyray-connect-windows-x64.exe \
            --ca-file "$RUNNER_TEMP/ms-root.pem" \
            --expect-publisher "$EXPECT_PUBLISHER"

      # The token is short-lived, but leaving a bearer credential on a runner
      # that outlives the job is how the next incident starts.
      - name: Shred the access token
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/azure-signing.token" "$RUNNER_TEMP/gh-oidc.jwt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-windows
          path: out/anyray-connect-windows-x64.exe
          if-no-files-found: error

  # Packages the linux binaries as .deb/.rpm — ADDITIVE assets; the bare
  # binaries keep publishing exactly as before and stay untouched. Once the
  # GPG release key is provisioned the packages are detach-signed and the
  # public key ships alongside them.
  package-linux:
    needs: build
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      # Same pattern as sign-macos: secrets into env, gate on `env.X != ''`.
      LINUX_SIGNING_GPG_KEY: ${{ secrets.LINUX_SIGNING_GPG_KEY }}
      LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
      # nfpm is pinned by version AND tarball checksum; bump both together
      # (checksums.txt on the nfpm release page).
      NFPM_PIN: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      # For ci/nfpm.yaml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: out

      - name: Fetch nfpm (pinned by version + checksum)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/nfpm.tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_PIN}/nfpm_${NFPM_PIN}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  ${RUNNER_TEMP}/nfpm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm

      - name: Build .deb/.rpm packages
        env:
          NFPM_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pkgs
          for arch in x64 arm64; do
            case "$arch" in
              x64)   export NFPM_ARCH=amd64 ;;
              arm64) export NFPM_ARCH=arm64 ;;
            esac
            export NFPM_BIN="out/anyray-connect-linux-${arch}"
            "$RUNNER_TEMP/nfpm" package -f ci/nfpm.yaml -p deb -t pkgs/
            "$RUNNER_TEMP/nfpm" package -f ci/nfpm.yaml -p rpm -t pkgs/
          done
          ls -lh pkgs

      - name: GPG-sign the packages and export the public key
        if: env.LINUX_SIGNING_GPG_KEY != ''
        run: |
          set -euo pipefail
          # Isolated GNUPGHOME; the always() step below removes it.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_GPG_KEY" | gpg --batch --quiet --import
          KEYID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          if [ -z "$KEYID" ]; then
            echo "::error::LINUX_SIGNING_GPG_KEY contains no secret key"
            exit 1
          fi
          for pkg in pkgs/*.deb pkgs/*.rpm; do
            # Passphrase over fd 0, never argv.
            printf '%s' "$LINUX_SIGNING_GPG_PASSPHRASE" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEYID" \
              --armor --detach-sign --output "${pkg}.asc" "$pkg"
            gpg --batch --verify "${pkg}.asc" "$pkg"
          done
          gpg --batch --armor --export "$KEYID" > pkgs/anyray-connect-signing-key.asc

      - name: Delete the imported GPG key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: pkgs/
          if-no-files-found: error

  release:
    needs: [build, sign-macos, sign-windows, package-linux]
    runs-on: codebuild-anyray-install-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write # create the release + upload assets
      id-token: write # attest-build-provenance: mint the short-lived Sigstore signing certificate
      attestations: write # attest-build-provenance: record the provenance bundle on this repo
    env:
      # Same pattern as package-linux (a step `if:` cannot read `secrets.*`, so
      # the secrets are mapped into job env and each step gates on `env.X != ''`).
      # The key is imported HERE as well as in package-linux on purpose: jobs run
      # on different runners and share no GNUPGHOME, and SHA256SUMS is generated
      # in THIS job — after the signing jobs, because signing rewrites the bytes.
      LINUX_SIGNING_GPG_KEY: ${{ secrets.LINUX_SIGNING_GPG_KEY }}
      LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
    steps:
      # The CodeBuild AL2 runner image ships no gh CLI (hosted ubuntu does) —
      # install it pinned by version + sha256, same discipline as nfpm below.
      - name: Install gh CLI
        run: |
          set -euo pipefail
          V=2.76.1
          SHA=18367ca38b4462889ae38fba6a18c53a4c2818b6af309bbe53d0810bb06036e9
          curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_amd64.tar.gz"
          echo "${SHA}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          install -m 0755 "/tmp/gh_${V}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      # gh release create needs a git checkout to resolve the repo + create the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assemble the release assets: unsigned set first, then the signed
      # darwin/windows binaries overwrite their unsigned copies, the signed and
      # stapled macOS package is added with the darwin artifact, then the Linux
      # packages are added.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-unsigned
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-darwin
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-windows
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: assets

      - name: Generate SHA256SUMS (after signing — signing rewrites the binaries)
        run: |
          set -euo pipefail
          # Name-keyed lookups on both consumers — connect.sh (awk '$2==asset')
          # and the self-updater (parseSha256Sums) — so the package/signature
          # lines are additive and harmless; the binary lines are what they
          # always were. connect-update.json is written AFTER this on purpose:
          # the mandatory-release marker never appears in SHA256SUMS.
          ( cd assets && sha256sum -- * > SHA256SUMS )
          cat assets/SHA256SUMS

      - name: GPG-sign SHA256SUMS
        # Closes the loop the checksums alone leave open. connect.sh /
        # connect.ps1 verify a downloaded binary against SHA256SUMS, but an
        # UNSIGNED SHA256SUMS fetched from the same release is only an integrity
        # check against corruption: whoever can alter the release can alter the
        # binary and its checksum line together. A detached signature makes the
        # checksum file verifiable against a key that never lives in the release.
        #
        # The import is repeated here rather than reused from package-linux:
        # that job runs on a different runner, its GNUPGHOME is $RUNNER_TEMP on
        # ITS machine, and it is torn down when the job ends. Same key, same
        # import mechanism, same passphrase handling (loopback pinentry,
        # passphrase over fd 0, never argv) — deliberately not a second pattern.
        #
        # Secret-gated exactly like every other signing step in this workflow
        # (RELEASING.md: signing is strictly conditional on the secrets being
        # configured), so a release cut before the key is provisioned publishes
        # what it does today. Once the key IS set there is no soft failure: the
        # step runs under `set -euo pipefail` with no `|| true` and no
        # continue-on-error, so a signing or verification failure fails the job
        # before anything is published.
        if: env.LINUX_SIGNING_GPG_KEY != ''
        run: |
          set -euo pipefail
          # Isolated GNUPGHOME; the always() step below removes it.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_GPG_KEY" | gpg --batch --quiet --import
          KEYID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          if [ -z "$KEYID" ]; then
            echo "::error::LINUX_SIGNING_GPG_KEY contains no secret key"
            exit 1
          fi
          # Passphrase over fd 0, never argv.
          printf '%s' "$LINUX_SIGNING_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEYID" \
            --armor --detach-sign --output assets/SHA256SUMS.asc assets/SHA256SUMS
          # Verify against the bytes that will actually be uploaded.
          gpg --batch --verify assets/SHA256SUMS.asc assets/SHA256SUMS
          # The public key ships from package-linux as anyray-connect-signing-key.asc
          # and is already listed in SHA256SUMS (it was in assets/ when the sums
          # were taken). Both steps gate on the same secret, so it is present
          # whenever this step runs — assert rather than silently publish a
          # signature nobody can check.
          if [ ! -f assets/anyray-connect-signing-key.asc ]; then
            echo "::error::SHA256SUMS.asc was produced but the public key asset is missing; the release would be unverifiable"
            exit 1
          fi
          # Fingerprint is public data. Logged so a release can be checked
          # against the fingerprint recorded in RELEASING.md.
          gpg --batch --with-colons --fingerprint "$KEYID" \
            | awk -F: '/^fpr/ {print "signing key fingerprint: " $10; exit}'

      - name: Delete the imported GPG key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - name: Attest build provenance for the released binaries
        # Independent of the GPG lane and NOT secret-gated: provenance is minted
        # from this workflow's own OIDC identity, so it works on the very next
        # release. `gh attestation verify` then proves a downloaded binary was
        # built by THIS workflow, from THIS repo, at THIS commit — which a
        # checksum published beside the binary can never establish.
        #
        # Skipped on dry_run: an attestation is a permanent, publicly queryable
        # record, and dry_run is defined as making no customer-facing change.
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # Explicit list rather than `assets/*`: that would also sweep in
          # SHA256SUMS, the detached .asc signatures and the public key (whose
          # integrity the GPG signature already carries) and, on a mandatory
          # release, connect-update.json. Every entry here is a shipped
          # executable or package, and each is always produced — the .deb/.rpm
          # are built unconditionally by package-linux — so no glob can go empty
          # and silently attest less than the release contains.
          subject-path: |
            assets/anyray-connect-darwin-arm64
            assets/anyray-connect-darwin-x64
            assets/anyray-connect.pkg
            assets/anyray-connect-linux-arm64
            assets/anyray-connect-linux-x64
            assets/anyray-connect-windows-x64.exe
            assets/*.deb
            assets/*.rpm

      - name: Mark the release mandatory (optional)
        # anyray-connect self-updates on a ~30 min tick and reads this asset ONLY
        # when the developer opted out (`anyray-connect update --auto off`). A
        # minVersion above their installed version overrides that opt-out — the
        # lever for a security or correctness fix, not for ordinary releases.
        # Absent asset (the normal case) = the opt-out stands.
        if: ${{ github.event.inputs.min_version != '' }}
        env:
          # Via env (not inline) so the dispatch input can't be shell-injected.
          MIN_VERSION: ${{ github.event.inputs.min_version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$MIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::min_version must be a plain semver (e.g. 0.11.72)"
            exit 1
          fi
          # A floor above the binaries in this very release can never be met:
          # the updater refuses to install a version that would still leave the
          # machine below it, so the release would be a silent no-op for exactly
          # the opted-out seats it was cut to reach. Fail loudly instead.
          if [[ "$(printf '%s\n%s\n' "$MIN_VERSION" "$VERSION" | sort -V | head -n1)" != "$MIN_VERSION" ]]; then
            echo "::error::min_version ($MIN_VERSION) is above the version being released ($VERSION); no machine could satisfy it."
            exit 1
          fi
          jq -n --arg min "$MIN_VERSION" '{minVersion: $min}' > assets/connect-update.json
          cat assets/connect-update.json

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          STAGING: ${{ inputs.staging }}
        run: |
          set -euo pipefail
          # A staging release is the SAME signed, notarized, checksummed asset
          # set — only where it lands differs. Separate tag, and never `latest`.
          #
          # `--latest=false` IS THE WHOLE SAFETY PROPERTY, and it is the same
          # hazard the fleetd lane documents: `connect.sh`, `connect.ps1` and
          # the self-updater all fetch from `releases/latest/download`, and
          # GitHub hands "latest" to whichever release published most recently.
          # Without it, publishing a staging build would silently become the
          # binary every developer and every fleet machine downloads — a
          # staging lane that ships to production is worse than no staging lane.
          if [ "$STAGING" = "true" ]; then
            TAG="connect-staging-v${VERSION}"
          else
            TAG="connect-v${VERSION}"
          fi
          # Notes go through a file rather than an inline --notes string: the
          # verification section is multi-line. Static prose lives in QUOTED
          # heredocs (nothing expands, so no shell metacharacter in the markdown
          # can ever be interpreted); the two dynamic values are printf'd
          # separately. Code samples are 4-space-indented blocks, not fenced —
          # keeps backticks out of the shell entirely.
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "Standalone \`anyray-connect\` ${VERSION} executables for the zero-install \`connect.sh\` / \`connect.ps1\` installers, plus the signed and notarized \`anyray-connect.pkg\` for macOS MDM deployment. No Node required. Built from the public npm package."
            cat <<'NOTESHEAD'
          ## Verifying what you downloaded
          NOTESHEAD
            # Only advertise the OpenPGP path when the signature is really
            # here. Until the release key is provisioned it is not, and notes
            # promising an asset that does not exist are worse than silence.
            if [ -f assets/SHA256SUMS.asc ]; then
              cat <<'NOTESGPG'

          SHA256SUMS carries a detached OpenPGP signature, SHA256SUMS.asc, made with the Anyray release key published here as anyray-connect-signing-key.asc. Check the checksum file before you trust any checksum in it:

              gpg --import anyray-connect-signing-key.asc
              gpg --verify SHA256SUMS.asc SHA256SUMS
              sha256sum --ignore-missing --check SHA256SUMS

          Compare the fingerprint gpg reports on import against the one recorded in RELEASING.md before trusting the key.
          NOTESGPG
            fi
            cat <<'NOTESPROV'

          Every executable and package here also carries build provenance, attested to the workflow, repository and commit that produced it. This is independent of the checksums, and lets you establish where a file came from without trusting this page:

          NOTESPROV
            printf '    gh attestation verify anyray-connect-linux-x64 --repo %s\n' "$REPO"
          } > "$NOTES"
          cat "$NOTES"
          # Idempotent: replace an existing release for this version.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ "$STAGING" = "true" ]; then
            gh release create "$TAG" \
              --title "anyray-connect ${VERSION} (staging assets)" \
              --notes "Staging build of anyray-connect ${VERSION}, for testing before a customer-facing release. Same signing and checksums as a real release; deliberately NOT \`latest\`, so \`connect.sh\`, \`connect.ps1\` and the self-updater are unaffected and no customer receives this build. Fetch a binary by its explicit tag URL, never through \`releases/latest/download\`." \
              --latest=false \
              --prerelease \
              assets/*
            # Say it out loud in the log: a human reading a green run needs to
            # see that `latest` did not move.
            echo "Published STAGING release $TAG (pre-release, not latest)."
            # ASK THE API WHAT `latest` RESOLVES TO — do not ask `gh release
            # view` for an `isLatest` field. That field does not exist on every
            # gh version (the CLI answers "Unknown JSON field" and exits 1), so
            # the first cut FAILED a run whose release was in fact published
            # correctly: `--latest=false` had taken effect, the release was
            # prerelease, and the job still went red. A guard that cannot tell
            # "the thing I feared happened" from "I asked the wrong question"
            # is worse than no guard, because the next person learns to ignore
            # it.
            #
            # `/releases/latest` is also the more faithful test. It is the exact
            # resolution `releases/latest/download` performs — the URL
            # connect.sh, connect.ps1 and the self-updater actually fetch — so
            # this asserts the property we care about rather than a flag we hope
            # implies it.
            actual_latest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || echo unknown)"
            prerelease="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .prerelease 2>/dev/null || echo unknown)"
            echo "verify: tag=$TAG prerelease=$prerelease · releases/latest -> $actual_latest"
            if [ "$actual_latest" = "$TAG" ]; then
              echo "::error::staging release $TAG became 'latest' — connect.sh and the self-updater would serve it to every customer"
              exit 1
            fi
            if [ "$prerelease" != "true" ]; then
              echo "::error::staging release $TAG is not marked pre-release (got '$prerelease')"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --title "anyray-connect ${VERSION} (binaries and macOS package)" \
              --notes-file "$NOTES" \
              assets/*
          fi

      # dry_run: prove the whole build->sign->notarize->fleet path without a
      # customer-facing release. The signed, checksummed asset set is inspectable.
      - name: Upload assembled assets (dry run — not published)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-release-assets
          path: assets/
          if-no-files-found: error
