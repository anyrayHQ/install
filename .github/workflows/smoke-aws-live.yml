name: AWS quicklaunch live smoke

# Deploys the CloudFormation template FOR REAL and probes the golden paths.
# cfn-lint (validate-artifacts) proves the template parses; it cannot prove it
# behaves — the July 2026 console-500 passed every static check and was only
# observable on a live stack (nginx runtime DNS vs ECS Service Connect). Two
# lanes: a fresh create of the candidate, and the exact customer upgrade path
# (create the published template, update-stack to the candidate).
#
# Auth mirrors publish-quicklaunch.yml: GitHub OIDC → a dedicated role in the
# staging account (PowerUser + IAM scoped to cfn-smoke-* roles). The role ARN
# lives in the AWS_CFN_SMOKE_ROLE_ARN repo variable.
#
# Cost per run: ~30-40 min of db.t4g.micro RDS + 2 ALBs + 6 Fargate tasks —
# cents. Everything is torn down in `always()` steps; a janitor also reaps any
# cfn-smoke-* stack older than 3 h left behind by cancelled runs.
#
# Injection-safety note: the only ${{ }} used inside run: are matrix.lane
# (defined in this file) and github.run_id (numeric) — no event-controlled text.

on:
  # Manual-only. The pull_request + weekly-schedule triggers were removed to
  # stop recurring AWS spend (each run stands up real ECS/RDS/ALB stacks). Run
  # it by hand from the Actions tab before shipping a change to the template.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-aws-live-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TEMPLATE: aws/anyray-quicklaunch.template.yaml

jobs:
  smoke:
    name: live ${{ matrix.lane }}
    runs-on: ubuntu-latest
    if: vars.AWS_CFN_SMOKE_ROLE_ARN != ''
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [fresh, update]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_CFN_SMOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      # A dedicated, reusable smoke VPC (free while idle). Idempotent: found by
      # tag, created once. Kept out of the stack so a failed teardown never
      # strands VPC-level plumbing.
      - name: Ensure smoke VPC
        id: vpc
        run: |
          set -euo pipefail
          # Prefer the VPC that owns the tagged subnets — a past parallel-lane race
          # left duplicate-tagged VPCs, and a bare Vpcs[0] pick mismatches the subnets.
          vpc="$(aws ec2 describe-subnets --filters Name=tag:Name,Values=anyray-cfn-smoke-a \
                 --query 'Subnets[0].VpcId' --output text)"
          if [ "$vpc" = "None" ]; then
            vpc="$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=anyray-cfn-smoke \
                   --query 'Vpcs[0].VpcId' --output text)"
          fi
          if [ "$vpc" = "None" ]; then
            vpc="$(aws ec2 create-vpc --cidr-block 10.99.0.0/16 \
              --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=anyray-cfn-smoke}]' \
              --query 'Vpc.VpcId' --output text)"
            aws ec2 modify-vpc-attribute --vpc-id "$vpc" --enable-dns-support
            aws ec2 modify-vpc-attribute --vpc-id "$vpc" --enable-dns-hostnames
            igw="$(aws ec2 create-internet-gateway \
              --tag-specifications 'ResourceType=internet-gateway,Tags=[{Key=Name,Value=anyray-cfn-smoke}]' \
              --query 'InternetGateway.InternetGatewayId' --output text)"
            aws ec2 attach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$vpc"
            rt="$(aws ec2 describe-route-tables --filters Name=vpc-id,Values="$vpc" \
                  --query 'RouteTables[0].RouteTableId' --output text)"
            aws ec2 create-route --route-table-id "$rt" --destination-cidr-block 0.0.0.0/0 --gateway-id "$igw"
          fi
          a="$(aws ec2 describe-subnets --filters Name=tag:Name,Values=anyray-cfn-smoke-a Name=vpc-id,Values="$vpc" \
               --query 'Subnets[0].SubnetId' --output text)"
          if [ "$a" = "None" ]; then
            a="$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.99.0.0/20 \
              --availability-zone "${AWS_REGION}a" \
              --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=anyray-cfn-smoke-a}]' \
              --query 'Subnet.SubnetId' --output text)"
            aws ec2 modify-subnet-attribute --subnet-id "$a" --map-public-ip-on-launch
          fi
          b="$(aws ec2 describe-subnets --filters Name=tag:Name,Values=anyray-cfn-smoke-b Name=vpc-id,Values="$vpc" \
               --query 'Subnets[0].SubnetId' --output text)"
          if [ "$b" = "None" ]; then
            b="$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.99.16.0/20 \
              --availability-zone "${AWS_REGION}b" \
              --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=anyray-cfn-smoke-b}]' \
              --query 'Subnet.SubnetId' --output text)"
            aws ec2 modify-subnet-attribute --subnet-id "$b" --map-public-ip-on-launch
          fi
          { echo "vpc=$vpc"; echo "subnet_a=$a"; echo "subnet_b=$b"; } >> "$GITHUB_OUTPUT"

      - name: Live smoke (${{ matrix.lane }})
        env:
          LANE: ${{ matrix.lane }}
          VPC_ID: ${{ steps.vpc.outputs.vpc }}
          SUBNET_A: ${{ steps.vpc.outputs.subnet_a }}
          SUBNET_B: ${{ steps.vpc.outputs.subnet_b }}
          STACK: cfn-smoke-${{ matrix.lane }}-${{ github.run_id }}
        run: ./scripts/smoke-aws.sh

      # Belt + braces: the script's EXIT trap tears down, but a runner kill
      # (cancel, OOM) skips traps. Reap this run's stack, then anything old.
      - name: Janitor
        if: always()
        run: |
          set -uo pipefail
          aws cloudformation delete-stack --stack-name "cfn-smoke-${{ matrix.lane }}-${{ github.run_id }}" 2>/dev/null || true
          cutoff="$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-3H +%Y-%m-%dT%H:%M:%S)"
          aws cloudformation describe-stacks \
            --query "Stacks[?starts_with(StackName,'cfn-smoke-') && CreationTime<'${cutoff}'].StackName" \
            --output text | tr '\t' '\n' | while read -r s; do
              [ -n "$s" ] && { echo "reaping orphan $s"; aws cloudformation delete-stack --stack-name "$s" || true; }
            done
