name: Install smoke test

# Installs Anyray exactly the way the README tells a human to, against the
# published ECR Public images, and probes the gateway + console + admin gate.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate secrets
        run: ./setup.sh --connect adt_ci0000000000000000
      - name: Start the stack
        env:
          # ECR Public pulls are anonymous — no registry login needed. `latest`
          # is the documented testing-opt-in moving channel (customer default
          # is the pinned Chart appVersion / ANYRAY_IMAGE_TAG); see
          # anyrayHQ/monorepo .github/workflows/publish-images.yml +
          # promote-ecr-channels.sh for how gateway/optimizer/proxy:latest gets
          # published on every prod promotion.
          ANYRAY_GATEWAY_IMAGE: public.ecr.aws/anyray/gateway:latest
          ANYRAY_OPTIMIZER_IMAGE: public.ecr.aws/anyray/optimizer:latest
          ANYRAY_PROXY_IMAGE: public.ecr.aws/anyray/proxy:latest
          ANYRAY_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:17
          ANYRAY_UPDATER_ENABLED: "false"
        run: docker compose up -d --quiet-pull gateway optimizer proxy postgres
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8787/ >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "gateway never became healthy"; docker compose ps; docker compose logs gateway; exit 1
      - name: Wait for console
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:3000/anyray-login >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "console never became healthy"; docker compose ps; docker compose logs proxy; exit 1
      - name: Probe surfaces
        run: |
          set -e
          ADMIN=$(grep '^ANYRAY_ADMIN_TOKEN=' .env | cut -d= -f2)
          curl -fs http://localhost:8787/ | grep -q "AI Gateway"
          curl -fso /dev/null http://localhost:3000/anyray-login
          test "$(curl -so /dev/null -w '%{http_code}' -H "Authorization: Bearer $ADMIN" http://localhost:8787/admin/auth)" = "200"
          test "$(curl -so /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong" http://localhost:8787/admin/auth)" = "401"
      - name: Idempotent re-run of setup.sh
        # Re-running must keep existing secrets, not regenerate them. setup.sh
        # reports this as "… existing values kept" (both the already-complete
        # and the reconciled branch); assert on that phrase.
        run: ./setup.sh | grep -q "existing values kept"
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs
