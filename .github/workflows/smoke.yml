name: Install smoke test

# Installs Anyray exactly the way the README tells a human to, against the
# published ECR Public images, and probes the gateway + console + admin gate.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC, to authenticate the ECR Public pulls below

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # AUTHENTICATE THE PULLS. Anonymous ECR Public pulls share one low per-IP
      # rate limit across every GitHub-hosted runner, and this job pulls five
      # images with `pull_policy: always`. The retry loop below was not enough:
      # 22 of the last 30 runs failed, all with `toomanyrequests: Rate exceeded`
      # after exhausting all five attempts, so `main` has been red for days and
      # this check stopped carrying information.
      #
      # An authenticated pull is throttled far more generously and resolves the
      # SAME public manifest a customer gets — the repos are public, the token
      # only lifts the rate ceiling. Exactly what publish-ecr.sh's Phase 3 probe
      # and await-images.sh already do for the same reason.
      #
      # DEDICATED ROLE, and deliberately not AWS_CFN_SMOKE_ROLE_ARN. That role
      # carries PowerUserAccess plus a `DenyPublicRegistryEntirely` guardrail
      # (an explicit Deny on `ecr-public:*`), so it CANNOT mint a pull token and
      # must not be weakened to — the guardrail is the point of it.
      # `anyray-install-smoke-ecrpull` instead holds exactly two token-minting
      # actions, `ecr-public:GetAuthorizationToken` + `sts:GetServiceBearerToken`
      # (neither is resource-scopable), and nothing else: PutImage, BatchDelete
      # and every other registry action evaluate implicitDeny, verified with
      # `aws iam simulate-principal-policy`. It cannot read or write anything.
      # Gated on the variable being set so a fork (or an unconfigured clone)
      # still runs the anonymous path rather than failing on a missing role.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_SMOKE_ECR_PULL_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SMOKE_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1 # ECR Public's API is us-east-1 only
      - name: Authenticate to ECR Public
        if: vars.AWS_SMOKE_ECR_PULL_ROLE_ARN != ''
        run: |
          set -euo pipefail
          # Still best-effort (the anonymous path with its retry loop remains a
          # working fallback), but SHOW THE REASON. The first version discarded
          # stderr, so when the role could not mint a token the job degraded to
          # exactly the anonymous throttling it was meant to fix and reported
          # only "login failed" — the fix looked applied and changed nothing.
          # A best-effort path that hides why it fell back is how you ship a
          # no-op and believe it worked.
          if ! err="$(aws ecr-public get-login-password --region us-east-1 2>&1 >/dev/null)"; then
            echo "::warning::could not mint an ECR Public token, falling back to anonymous pulls: ${err:-unknown error}"
          elif aws ecr-public get-login-password --region us-east-1 2>/dev/null \
               | docker login --username AWS --password-stdin public.ecr.aws 2>&1; then
            echo "authenticated to ECR Public — pulls are no longer anonymous-rate-limited"
          else
            echo "::warning::docker login to public.ecr.aws failed — falling back to anonymous pulls (throttle-prone)"
          fi

      - name: Generate secrets
        run: ./setup.sh --connect adt_ci0000000000000000
      - name: Start the stack
        env:
          # `latest` is the documented testing-opt-in moving channel (customer
          # default is the pinned Chart appVersion / ANYRAY_IMAGE_TAG); see
          # anyrayHQ/monorepo .github/workflows/publish-images.yml +
          # promote-ecr-channels.sh for how gateway/optimizer/proxy:latest gets
          # published on every prod promotion.
          # The pulls are AUTHENTICATED by the login step above (they used to be
          # anonymous, which is what made this job flaky enough to be useless).
          # The retry stays as the fallback for the unauthenticated path and for
          # ordinary registry blips — every service here has pull_policy: always,
          # so a separate pre-pull step would not shield this `up` from repulling
          # anyway.
          ANYRAY_GATEWAY_IMAGE: public.ecr.aws/anyray/gateway:latest
          ANYRAY_OPTIMIZER_IMAGE: public.ecr.aws/anyray/optimizer:latest
          ANYRAY_ENDPOINT_CONTROL_IMAGE: public.ecr.aws/anyray/endpoint-control:latest
          ANYRAY_PROXY_IMAGE: public.ecr.aws/anyray/proxy:latest
          ANYRAY_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:17
          ANYRAY_UPDATER_ENABLED: "false"
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose up -d --quiet-pull gateway optimizer endpoint-control proxy postgres; then
              exit 0
            fi
            echo "attempt $attempt failed (likely ECR Public anonymous pull rate limit) — backing off"
            docker compose down --remove-orphans
            sleep $((attempt * 20))
          done
          echo "stack never started after 5 attempts"; exit 1
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8787/ >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "gateway never became healthy"; docker compose ps; docker compose logs gateway; exit 1
      - name: Wait for console
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:3000/anyray-login >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "console never became healthy"; docker compose ps; docker compose logs proxy; exit 1
      - name: Wait for endpoint-control
        # No host port by design (only Caddy's agent-plane routes reach it in a
        # public deployment), so probe the compose healthcheck (/livez) instead.
        run: |
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q endpoint-control)" 2>/dev/null || true)"
            if [ "$state" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "endpoint-control never became healthy"; docker compose ps; docker compose logs endpoint-control; exit 1
      - name: Probe surfaces
        run: |
          set -e
          ADMIN=$(grep '^ANYRAY_ADMIN_TOKEN=' .env | cut -d= -f2)
          curl -fs http://localhost:8787/ | grep -q "AI Gateway"
          curl -fso /dev/null http://localhost:3000/anyray-login
          test "$(curl -so /dev/null -w '%{http_code}' -H "Authorization: Bearer $ADMIN" http://localhost:8787/admin/auth)" = "200"
          test "$(curl -so /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong" http://localhost:8787/admin/auth)" = "401"
      - name: Idempotent re-run of setup.sh
        # Re-running must keep existing secrets, not regenerate them. setup.sh
        # reports this as "… existing values kept" (both the already-complete
        # and the reconciled branch); assert on that phrase.
        run: ./setup.sh | grep -q "existing values kept"
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs
