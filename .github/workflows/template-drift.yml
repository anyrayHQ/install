name: Railway template drift

# Alarms when the PUBLISHED Railway "anyray" one-click template's service images
# fall behind the pins in railway/railway.template.json.
#
# Railway's API can read a template's config but cannot write it (templatePublish
# = metadata only; templateGenerate mints a new code and would break the stable
# `-t anyray` link), so the template is updated by hand in the dashboard. That
# manual step lagged once and shipped v1.10.30 to fresh installs while releases
# were on v1.10.83. This job makes that drift a red run within a day of a release
# instead of a customer discovering it. It does not (cannot) auto-fix — the run
# prints the exact dashboard edit.
#
# Needs a RAILWAY_TOKEN repo secret (Railway API token, read access). Without it
# the job warns and skips, so it never blocks unrelated PRs / forks.

on:
  pull_request:
    paths:
      - railway/railway.template.json
      - railway/check-template-drift.sh
      - .github/workflows/template-drift.yml
  schedule:
    - cron: '23 6 * * *' # daily 06:23 UTC — catch drift within a day of a release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check published template matches repo pins
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::RAILWAY_TOKEN secret not set — skipping template drift check"
            exit 0
          fi
          bash railway/check-template-drift.sh
