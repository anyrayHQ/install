name: Validate install artifacts

# Every install path a customer can pick (compose, attach, Helm via setup.sh
# --k8s, AWS CloudFormation, Railway, GCP/Azure scripts) must parse, render,
# and resolve — a template that doesn't is a broken install for the next
# customer. Runs on every change and daily, because artifacts also rot without
# commits here (validator rule updates, image defaults, monorepo env-var
# changes arriving via paired PRs).
#
# Helm chart lint + the image-pinning invariant live in helm-chart.yml; this
# workflow covers everything else plus the setup.sh-generated Helm values.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup.sh produces a complete .env (docker path)
        run: |
          ./setup.sh --host ci.example.com --connect adt_ci0000000000000000 \
            --gateway-url http://ci.example.com:8787
          test -f .env
      - name: main stack resolves (every required var satisfied)
        run: docker compose config -q
      - name: transcript policy waits for optimizer health and activates
        run: |
          set -euo pipefail
          config="$(docker compose config --format json)"
          jq -e '.services.gateway.depends_on.optimizer.condition == "service_healthy"' <<<"$config" > /dev/null
          jq -e '.services.optimizer.healthcheck.test
                 | any(contains("persistentTranscriptPolicyV1"))' <<<"$config" > /dev/null
          jq -e '.services.gateway.environment.ANYRAY_PERSISTENT_TRANSCRIPT_POLICY_ACTIVATE_AT
                 == "1970-01-01T00:00:00.000Z"' <<<"$config" > /dev/null
      - name: every compose image carries an explicit tag
        run: |
          untagged="$(docker compose config --images | grep -Ev ':[^/]+$' || true)"
          if [ -n "$untagged" ]; then
            echo "::error::untagged image(s) — pin them: ${untagged}"
            exit 1
          fi
      - name: attach mode resolves
        run: docker compose -f docker-compose.attach.yml config -q
      - name: capability-aware platform defaults move as one release set
        run: |
          set -euo pipefail
          test -s compatibility/persistentTranscriptPolicyV1
          expected="$(sed -nE 's#.*ANYRAY_IMAGE_TAG:-(v[0-9]+\.[0-9]+\.[0-9]+|policy-stable)\}.*#\1#p' \
            docker-compose.yml | head -1)"
          [[ "$expected" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$expected" = policy-stable ]]
          for file in gcp/deploy.sh gcp/gce/deploy.sh azure/deploy.sh; do
            grep -Fq "IMAGE_TAG=\"\${IMAGE_TAG:-${expected}}\"" "$file" || {
              echo "::error::$file does not share the capability-aware image default $expected"
              exit 1
            }
          done
          grep -Fq "anyray-image-tag $expected" gcp/gce/startup-script.sh || {
            echo "::error::GCE startup does not share the capability-aware image default $expected"
            exit 1
          }
          ! grep -REn 'IMAGE_TAG=.*\:-latest|anyray-image-tag latest' gcp azure
          bash -n gcp/gce/upgrade.sh
          ci/check-gce-upgrade.sh

          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            helm/Chart.yaml | head -1)"
          scripts/validate-one-click-image-tag.sh "$app" helm/Chart.yaml
          scripts/validate-one-click-image-tag.sh policy-stable helm/Chart.yaml
          custom=v999.999.999
          [ "$custom" != "$app" ] || custom=v999.999.998
          if scripts/validate-one-click-image-tag.sh "$custom" helm/Chart.yaml \
            >"$RUNNER_TEMP/custom-tag.out" 2>"$RUNNER_TEMP/custom-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted an unverified custom tag"
            exit 1
          fi
          grep -q 'documented manual Helm flow' "$RUNNER_TEMP/custom-tag.err"
          if scripts/validate-one-click-image-tag.sh latest helm/Chart.yaml \
            >"$RUNNER_TEMP/latest-tag.out" 2>"$RUNNER_TEMP/latest-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted latest"
            exit 1
          fi

  runtime-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install crane
        env:
          CRANE_VERSION: v0.20.2
        run: |
          set -euo pipefail
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          base="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSLo "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" crane
          chmod +x "$RUNNER_TEMP/crane"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Pinned gateway and optimizer declare the install capability
        run: ci/check-runtime-policy-capability.sh

  k8s-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: setup.sh --k8s secrets + values render against the chart
        run: |
          set -euo pipefail
          # An older chart revision has no capability annotation. Its behavior
          # stays legacy regardless of the image version it happens to pin.
          cp helm/Chart.yaml "$RUNNER_TEMP/Chart.yaml"
          sed -i '/anyray.ai\/persistent-transcript-policy-v1:/d' helm/Chart.yaml
          sed -i 's/^appVersion:.*/appVersion: "v999.999.999"/' helm/Chart.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          if grep -q '^persistentTranscriptPolicyActivateAt:' my-values.yaml; then
            echo "::error::legacy chart revision unexpectedly generated a policy activation"
            exit 1
          fi
          helm template t ./helm -f my-values.yaml > /dev/null

          # Legacy chart revisions preserve a missing or blank value.
          printf '\npersistentTranscriptPolicyActivateAt: ""\n' >> my-values.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -qx 'persistentTranscriptPolicyActivateAt: ""' my-values.yaml

          # A declared capability must be the exact supported value. Setup
          # fails closed instead of silently treating malformed metadata as
          # a legacy chart.
          rm my-values.yaml
          cp "$RUNNER_TEMP/Chart.yaml" helm/Chart.yaml
          sed -i 's#anyray.ai/persistent-transcript-policy-v1: "true"#anyray.ai/persistent-transcript-policy-v1: "false"#' \
            helm/Chart.yaml
          if ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray \
            > "$RUNNER_TEMP/malformed.out" 2> "$RUNNER_TEMP/malformed.err"; then
            echo "::error::setup accepted a malformed chart capability"
            exit 1
          fi
          grep -q 'capability anyray.ai/persistent-transcript-policy-v1 must be true' \
            "$RUNNER_TEMP/malformed.err"

          # Restoring the capable chart makes setup backfill exactly once.
          cp "$RUNNER_TEMP/Chart.yaml" helm/Chart.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -Eq '^persistentTranscriptPolicyActivateAt: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.000Z"$' my-values.yaml
          helm template t ./helm -f my-values.yaml > /dev/null
          activation="$(sed -nE 's/^persistentTranscriptPolicyActivateAt: "([^"]+)"/\1/p' my-values.yaml)"

          # A generated value is not an evergreen first-rollout bypass. A
          # delayed first use fails until the operator chooses a new boundary.
          sed -i 's/^persistentTranscriptPolicyActivateAt:.*/persistentTranscriptPolicyActivateAt: "2000-01-01T00:00:00.000Z"/' my-values.yaml
          if helm template t ./helm -f my-values.yaml \
            >"$RUNNER_TEMP/stale-setup.out" 2>"$RUNNER_TEMP/stale-setup.err"; then
            echo "::error::setup-generated values permitted a stale first rollout"
            exit 1
          fi
          grep -q 'must be at least 30 minutes in the future for a first capable rollout' \
            "$RUNNER_TEMP/stale-setup.err"
          sed -i "s#^persistentTranscriptPolicyActivateAt:.*#persistentTranscriptPolicyActivateAt: \"$activation\"#" my-values.yaml

          # A simulated nightly appVersion bump cannot regenerate the rollout
          # boundary because the annotation, not semver, owns the capability.
          sed -i 's/^appVersion:.*/appVersion: "v999.999.999"/' helm/Chart.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -qx "persistentTranscriptPolicyActivateAt: \"$activation\"" my-values.yaml
          cp "$RUNNER_TEMP/Chart.yaml" helm/Chart.yaml

          sed -i 's/^persistentTranscriptPolicyActivateAt:.*/persistentTranscriptPolicyActivateAt: ""/' my-values.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -Eq '^persistentTranscriptPolicyActivateAt: "[^"]+"$' my-values.yaml

          # Render-only tooling supplies a non-activating render value and still
          # emits the chart's independently pinned appVersion.
          tool_bin="$(mktemp -d)"
          ln -s "$(command -v helm)" "$tool_bin/helm"
          image_bom="$(PATH="$tool_bin:/usr/bin:/bin" scripts/gen-image-bom.sh)"
          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/Chart.yaml | head -1)"
          grep -q "public.ecr.aws/anyray/gateway:$app" <<<"$image_bom"

          sed -i 's/^persistentTranscriptPolicyActivateAt:.*/persistentTranscriptPolicyActivateAt: "2099-01-01T00:00:00.000Z"/' my-values.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -qx 'persistentTranscriptPolicyActivateAt: "2099-01-01T00:00:00.000Z"' my-values.yaml

          sed -i '/^persistentTranscriptPolicyActivateAt:/d' my-values.yaml
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          grep -Eq '^persistentTranscriptPolicyActivateAt: "[^"]+"$' my-values.yaml

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cfn-lint the AWS quick-launch template
        run: |
          pipx install cfn-lint
          cfn-lint aws/anyray-quicklaunch.template.yaml
      - name: CloudFormation capability is independent from the image pin
        run: |
          set -euo pipefail
          template=aws/anyray-quicklaunch.template.yaml
          image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$template")"
          activation_parameter="$(awk '/^  PersistentTranscriptPolicyActivateAt:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$template")"

          current_tag="$(awk '$1 == "Default:" { print $2; exit }' <<<"$image_parameter")"
          if [[ ! "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CloudFormation ImageTag.Default is not immutable: ${current_tag:-missing}"
            exit 1
          fi
          grep -Fq "AllowedPattern: '^v[0-9]+\\.[0-9]+\\.[0-9]+$'" <<<"$image_parameter"
          if grep -Eq 'Default:[[:space:]]+(latest|stable)' <<<"$image_parameter"; then
            echo "::error::CloudFormation must never default to a mutable image channel"
            exit 1
          fi
          grep -qx "    Default: ''" <<<"$activation_parameter"
          grep -Fq "AllowedPattern: '^$|^" <<<"$activation_parameter"

          # The template revision declares the capability. Its activation rule
          # and semantic health check are unconditional and never inspect ImageTag.
          capability_before="$RUNNER_TEMP/cfn-capability-before"
          rule_before="$RUNNER_TEMP/cfn-policy-rule-before"
          health_before="$RUNNER_TEMP/cfn-policy-health-before"
          awk '/^  AnyrayCapabilities:/{p=1} p && /^  AWS::CloudFormation::Interface:/{exit} p{print}' "$template" > "$capability_before"
          awk '/^  PersistentTranscriptPolicyActivationRequired:/{p=1} p && /^  AllowedCidrMustNotBePublic:/{exit} p{print}' "$template" > "$rule_before"
          awk '/^          HealthCheck:/{p=1} p && /^          LogConfiguration:/{exit} p{print}' "$template" > "$health_before"
          grep -Fq 'persistentTranscriptPolicyV1: true' "$capability_before"
          test "$(grep -Fc 'Fn::Not:' "$rule_before")" -eq 1
          test "$(grep -Fc -- '!Ref PersistentTranscriptPolicyActivateAt' "$rule_before")" -eq 1
          ! grep -Eq 'RuleCondition|ImageTag|Fn::Contains' "$rule_before"
          ! grep -q 'PersistentTranscriptPolicyV1Enabled' "$template"
          grep -Fq 'features?.persistentTranscriptPolicyV1===true' "$health_before"
          ! grep -Fq 'Command: !If' "$health_before"

          # Simulate unrelated nightly releases. Stamping ImageTag.Default may
          # not alter capability metadata, activation rules, or health semantics.
          first="$RUNNER_TEMP/anyray-quicklaunch-first.template.yaml"
          staged="$RUNNER_TEMP/anyray-quicklaunch-staged.template.yaml"
          capability_after="$RUNNER_TEMP/cfn-capability-after"
          rule_after="$RUNNER_TEMP/cfn-policy-rule-after"
          health_after="$RUNNER_TEMP/cfn-policy-health-after"
          cp "$template" "$first"
          cp "$template" "$staged"
          scripts/stamp-aws-image-tag.sh v0.0.1 "$first"
          simulated_tag=v999.999.999
          [ "$current_tag" != "$simulated_tag" ] || simulated_tag=v999.999.998
          scripts/stamp-aws-image-tag.sh "$simulated_tag" "$staged"
          awk '/^  AnyrayCapabilities:/{p=1} p && /^  AWS::CloudFormation::Interface:/{exit} p{print}' "$staged" > "$capability_after"
          awk '/^  PersistentTranscriptPolicyActivationRequired:/{p=1} p && /^  AllowedCidrMustNotBePublic:/{exit} p{print}' "$staged" > "$rule_after"
          awk '/^          HealthCheck:/{p=1} p && /^          LogConfiguration:/{exit} p{print}' "$staged" > "$health_after"
          cmp -s "$capability_before" "$capability_after"
          cmp -s "$rule_before" "$rule_after"
          cmp -s "$health_before" "$health_after"
          first_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$first")"
          staged_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$staged")"
          grep -qx '    Default: v0.0.1' <<<"$first_image_parameter"
          grep -qx "    Default: $simulated_tag" <<<"$staged_image_parameter"
          cfn-lint "$first"
          cfn-lint "$staged"

          if scripts/stamp-aws-image-tag.sh latest "$staged"; then
            echo "::error::CloudFormation release stamp accepted a mutable tag"
            exit 1
          fi

  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: activation follows the install capability marker
        # Also verifies that JSON and IaC image pins remain equal while their
        # values stay independent from install semantics.
        run: ci/check-railway-policy-activation.sh

      - name: policy install capability marker is present
        run: test -s compatibility/persistentTranscriptPolicyV1

  gateway-env-coverage:
    # Every deploy-critical gateway env var (ci/critical-gateway-env.txt) must be
    # wired into EVERY template — compose, CloudFormation, both Railway paths,
    # and Helm. A var
    # the gateway fail-fasts on (or the admin console needs), silently dropped
    # from one template, bricks that install path on the next image bump. This
    # generalises the per-template railway check above across all install paths,
    # and — running daily — catches template drift before a customer hits it (and
    # a monorepo paired PR that wired a new var into some templates but not all).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: render Helm values (gateway env comes from the rendered chart)
        run: |
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
      - name: every critical gateway env var is wired into every template
        run: ci/check-gateway-env-coverage.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash -n + shellcheck (error severity) on every script
        run: |
          shopt -s globstar nullglob
          set -- **/*.sh
          bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' _ "$@"
          shellcheck -S error "$@"

  bump-freshness:
    # Guards the failure mode where the monorepo prod promotion's install bump
    # PR fails to merge: publish-chart reads install@main and skips
    # already-published chart versions, so Helm customers silently freeze on an
    # old appVersion while every release logs "already published". A bump PR
    # open longer than a day means that pipeline is broken again.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: no release bump PR may sit open >24h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Bump install for v in:title' --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 86400) | .number] | join(", ")')"
          if [ -n "$stale" ]; then
            echo "::error::release bump PR(s) #${stale} open >24h — deploy-prod auto-merge is broken; Helm customers are freezing on an old chart"
            exit 1
          fi
