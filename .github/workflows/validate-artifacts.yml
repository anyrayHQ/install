name: Validate install artifacts

# Every install path a customer can pick (compose, attach, Helm via setup.sh
# --k8s, AWS CloudFormation, Railway, GCP/Azure scripts) must parse, render,
# and resolve — a template that doesn't is a broken install for the next
# customer. Runs on every change and daily, because artifacts also rot without
# commits here (validator rule updates, image defaults, monorepo env-var
# changes arriving via paired PRs).
#
# Helm chart lint + the image-pinning invariant live in helm-chart.yml; this
# workflow covers everything else plus the setup.sh-generated Helm values.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate installer sources
        run: |
          bash -n connect.sh
          shellcheck connect.sh
          connect_path="$(awk '$1 == "dst:" && $2 ~ /\/anyray-connect$/ { print $2; exit }' ci/nfpm.yaml)"
          test -n "$connect_path"
          grep -Fqx "ExecStart=$connect_path __anyray-managed-enroll" \
            ci/anyray-connect-managed-enroll.service
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/connect.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Install package inspection tools
        run: |
          source ci/nfpm-tool.env
          sudo apt-get update
          sudo apt-get install -y cpio rpm2cpio
          archive="nfpm_${NFPM_TOOL_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_TOOL_VERSION/$archive"
          echo "$NFPM_LINUX_X64_SHA256  $RUNNER_TEMP/$archive" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
      - name: Build Linux packages
        run: |
          install -m 0755 /bin/true "$RUNNER_TEMP/anyray-connect"
          NFPM_VERSION=0.0.0 NFPM_ARCH=amd64 NFPM_BIN="$RUNNER_TEMP/anyray-connect" \
            "$RUNNER_TEMP/nfpm" package --config ci/nfpm.yaml --packager deb \
            --target "$RUNNER_TEMP/anyray-connect.deb"
          NFPM_VERSION=0.0.0 NFPM_ARCH=amd64 NFPM_BIN="$RUNNER_TEMP/anyray-connect" \
            "$RUNNER_TEMP/nfpm" package --config ci/nfpm.yaml --packager rpm \
            --target "$RUNNER_TEMP/anyray-connect.rpm"
      - name: Inspect Linux package payloads
        run: |
          set -euo pipefail
          deb_root="$RUNNER_TEMP/deb-root"
          rpm_root="$RUNNER_TEMP/rpm-root"
          mkdir -p "$deb_root" "$rpm_root"
          dpkg-deb -x "$RUNNER_TEMP/anyray-connect.deb" "$deb_root"
          rpm2cpio "$RUNNER_TEMP/anyray-connect.rpm" \
            > "$RUNNER_TEMP/anyray-connect.cpio" || true
          if [ ! -s "$RUNNER_TEMP/anyray-connect.cpio" ]; then
            echo "::error::rpm2cpio produced no package payload"
            exit 1
          fi
          (
            cd "$rpm_root"
            cpio -idm --quiet --no-absolute-filenames \
              < "$RUNNER_TEMP/anyray-connect.cpio"
          ) || true

          check_mode() {
            path="$1"
            expected="$2"
            if [ ! -e "$path" ]; then
              echo "::error::missing package payload: $path"
              return 1
            fi
            actual="$(stat -c '%a' "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::package mode $actual, expected $expected: $path"
              return 1
            fi
          }

          check_copy() {
            source="$1"
            packaged="$2"
            if ! cmp "$source" "$packaged"; then
              echo "::error::packaged file differs from $source: $packaged"
              return 1
            fi
          }

          check_payload() {
            root="$1"
            check_mode "$root/usr/bin/anyray-connect" 755
            check_mode \
              "$root/usr/lib/systemd/user/anyray-connect-managed-enroll.service" 644
            check_mode \
              "$root/etc/xdg/autostart/anyray-connect-managed-enroll.desktop" 644
            check_copy ci/anyray-connect-managed-enroll.service \
              "$root/usr/lib/systemd/user/anyray-connect-managed-enroll.service"
            check_copy ci/anyray-connect-managed-enroll.desktop \
              "$root/etc/xdg/autostart/anyray-connect-managed-enroll.desktop"
            if ! grep -Fqx \
              'Exec=/usr/bin/systemctl --user start --no-block anyray-connect-managed-enroll.service' \
              "$root/etc/xdg/autostart/anyray-connect-managed-enroll.desktop"; then
              echo "::error::packaged XDG trigger does not start the user service"
              return 1
            fi
          }

          check_payload "$deb_root"
          check_payload "$rpm_root"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup.sh produces a complete .env (docker path)
        run: |
          ./setup.sh --host ci.example.com --connect adt_ci0000000000000000 \
            --gateway-url http://ci.example.com:8787
          test -f .env
      - name: main stack resolves (every required var satisfied)
        run: docker compose config -q
      - name: setup requires Billing except for explicit attach mode
        run: |
          set -euo pipefail
          fresh="$(mktemp -d)"
          if (cd "$fresh" && "$GITHUB_WORKSPACE/setup.sh" --host ci.example.com >/dev/null 2>&1); then
            echo "::error::fresh gateway setup succeeded without --connect"
            exit 1
          fi
          attach_output="$RUNNER_TEMP/attach-setup.out"
          (cd "$fresh" && "$GITHUB_WORKSPACE/setup.sh" --attach --host ci.example.com >"$attach_output" 2>&1)
          test -f "$fresh/.env"
          grep -q 'docker compose -f docker-compose.attach.yml up -d' "$attach_output"
          if grep -q 'Gateway:' "$attach_output"; then
            echo "::error::attach setup advertised a gateway that does not run"
            exit 1
          fi
          if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --attach --upstream http://upstream.internal >/dev/null 2>&1); then
            echo "::error::attach setup accepted gateway-only --upstream"
            exit 1
          fi
          for invalid in false adt_; do
            if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --connect "$invalid" --host ci.example.com >/dev/null 2>&1); then
              echo "::error::setup accepted invalid deployment token '$invalid'"
              exit 1
            fi
          done
          injected=$'adt_x\nANYRAY_DEV_UNSAFE_CONTROL_PLANE=1'
          if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --connect "$injected" --host ci.example.com >/dev/null 2>&1); then
            echo "::error::setup accepted a newline-bearing deployment token"
            exit 1
          fi

          mixed="$(mktemp -d)"
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --connect adt_ci0000000000000000 --host ci.example.com >/dev/null 2>&1)
          if (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --host anyray.internal >/dev/null 2>&1); then
            echo "::error::Docker .env incorrectly authorized a token-less Kubernetes setup"
            exit 1
          fi
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --connect adt_ci0000000000000000 --host anyray.internal >/dev/null 2>&1)
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --host anyray.internal >/dev/null 2>&1)
      - name: --upstream trusts a private host by RESOLUTION, not by name shape
        # The gateway's SSRF guard blocks on the address a name RESOLVES to, so a
        # private upstream behind a public-looking FQDN (split-horizon DNS) needs
        # TRUSTED_CUSTOM_HOSTS just as much as one called *.internal. Classifying
        # by name shape wrote only the allowlist for such a host and the install
        # then 502'd custom_host_blocked on its first request. Literal IPs and a
        # reserved .invalid name keep this hermetic — no resolver required.
        run: |
          set -euo pipefail
          up_env() {
            d="$(mktemp -d)"
            (cd "$d" && "$GITHUB_WORKSPACE/setup.sh" --connect adt_ci0000000000000000 \
              --host ci.example.com --upstream "$1" >"$d/out" 2>&1)
            printf '%s' "$d"
          }

          # Private literal → trusted, with the localhost defaults re-listed.
          d="$(up_env http://10.0.0.5:4000)"
          grep -q '^TRUSTED_CUSTOM_HOSTS=.*10\.0\.0\.5' "$d/.env" || {
            echo "::error::private upstream did not reach TRUSTED_CUSTOM_HOSTS"; exit 1; }
          for keep in localhost 127.0.0.1 host.docker.internal; do
            grep -q "^TRUSTED_CUSTOM_HOSTS=.*${keep}" "$d/.env" || {
              echo "::error::TRUSTED_CUSTOM_HOSTS dropped the built-in default ${keep}"; exit 1; }
          done

          # Public literal → allowlist only; trusting it would widen the guard.
          d="$(up_env http://8.8.8.8:4000)"
          if grep -q '^TRUSTED_CUSTOM_HOSTS=' "$d/.env"; then
            echo "::error::public upstream was written into TRUSTED_CUSTOM_HOSTS"; exit 1
          fi
          grep -q '^ANYRAY_CUSTOM_HOST_ALLOWLIST=8.8.8.8$' "$d/.env" || {
            echo "::error::public upstream missing from the allowlist"; exit 1; }

          # Unresolvable + public-looking → not trusted, but SAY SO. Silence here
          # is the failure mode this step exists to prevent.
          d="$(up_env https://llm-gateway.example.invalid)"
          if grep -q '^TRUSTED_CUSTOM_HOSTS=' "$d/.env"; then
            echo "::error::unresolvable upstream was trusted without evidence"; exit 1
          fi
          grep -q 'TRUSTED_CUSTOM_HOSTS' "$d/out" || {
            echo "::error::unresolvable upstream gave no TRUSTED_CUSTOM_HOSTS guidance"; exit 1; }

          # Unresolvable but internal-NAMED → the pre-existing name fallback still
          # applies, so an air-gapped *.internal install keeps working.
          d="$(up_env http://litellm.acme.internal:4000)"
          grep -q '^TRUSTED_CUSTOM_HOSTS=.*litellm\.acme\.internal' "$d/.env" || {
            echo "::error::name-shape fallback regressed for an unresolvable *.internal host"; exit 1; }
      - name: Compose requires the Billing identity
        run: |
          set -euo pipefail
          for missing in ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            if env "$missing=" docker compose config -q >/dev/null 2>&1; then
              echo "::error::Compose accepted an empty $missing"
              exit 1
            fi
          done
      - name: Compose cannot disable mandatory Billing metering
        run: |
          set -euo pipefail
          value="$(ANYRAY_METERING_ENABLED=false docker compose config --format json \
            | jq -r '.services.gateway.environment.ANYRAY_METERING_ENABLED')"
          [ "$value" = "true" ] || {
            echo "::error::Compose honored ANYRAY_METERING_ENABLED=false (resolved '$value')"
            exit 1
          }
      - name: gateway waits for optimizer health
        run: |
          set -euo pipefail
          config="$(docker compose config --format json)"
          jq -e '.services.gateway.depends_on.optimizer.condition == "service_healthy"' <<<"$config" > /dev/null
      - name: every compose image carries an explicit tag
        run: |
          untagged="$(docker compose config --images | grep -Ev ':[^/]+$' || true)"
          if [ -n "$untagged" ]; then
            echo "::error::untagged image(s) — pin them: ${untagged}"
            exit 1
          fi
      - name: attach mode resolves
        run: docker compose -f docker-compose.attach.yml config -q
      - name: platform image defaults move as one release set
        run: |
          set -euo pipefail
          expected="$(sed -nE 's#.*ANYRAY_IMAGE_TAG:-(v[0-9]+\.[0-9]+\.[0-9]+|policy-stable)\}.*#\1#p' \
            docker-compose.yml | head -1)"
          [[ "$expected" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$expected" = policy-stable ]]
          for file in gcp/deploy.sh gcp/gce/deploy.sh azure/deploy.sh; do
            grep -Fq "IMAGE_TAG=\"\${IMAGE_TAG:-${expected}}\"" "$file" || {
              echo "::error::$file does not share the image default $expected"
              exit 1
            }
          done
          grep -Fq "anyray-image-tag $expected" gcp/gce/startup-script.sh || {
            echo "::error::GCE startup does not share the image default $expected"
            exit 1
          }
          ! grep -REn 'IMAGE_TAG=.*\:-latest|anyray-image-tag latest' gcp azure
          bash -n gcp/gce/upgrade.sh
          ci/check-gce-upgrade.sh

          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            helm/Chart.yaml | head -1)"
          scripts/validate-one-click-image-tag.sh "$app" helm/Chart.yaml
          scripts/validate-one-click-image-tag.sh policy-stable helm/Chart.yaml
          custom=v999.999.999
          [ "$custom" != "$app" ] || custom=v999.999.998
          if scripts/validate-one-click-image-tag.sh "$custom" helm/Chart.yaml \
            >"$RUNNER_TEMP/custom-tag.out" 2>"$RUNNER_TEMP/custom-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted an unverified custom tag"
            exit 1
          fi
          grep -q 'documented manual Helm flow' "$RUNNER_TEMP/custom-tag.err"
          if scripts/validate-one-click-image-tag.sh latest helm/Chart.yaml \
            >"$RUNNER_TEMP/latest-tag.out" 2>"$RUNNER_TEMP/latest-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted latest"
            exit 1
          fi

  k8s-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: setup.sh --k8s secrets + values render against the chart
        run: |
          set -euo pipefail
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          render="$(helm template t ./helm -f my-values.yaml)"
          test "$(grep -c 'name: ANYRAY_METERING_ENABLED' <<<"$render")" -eq 1
          grep -A1 'name: ANYRAY_METERING_ENABLED' <<<"$render" | grep -q 'value: "true"'
          for required in ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            grep -A4 "key: $required" <<<"$render" >/dev/null
            if grep -A4 "key: $required" <<<"$render" | grep -q 'optional: true'; then
              echo "::error::Helm made $required optional"
              exit 1
            fi
          done

          # An old values file may still carry the retired toggle. It must be
          # ignored, while an extraEnv duplicate is rejected instead of winning.
          legacy="$(helm template t ./helm -f my-values.yaml \
            --set gateway.metering.enabled=false)"
          grep -A1 'name: ANYRAY_METERING_ENABLED' <<<"$legacy" | grep -q 'value: "true"'
          for protected in ANYRAY_METERING_ENABLED ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            if helm template t ./helm -f my-values.yaml \
              --set "gateway.extraEnv[0].name=$protected" \
              --set-string 'gateway.extraEnv[0].value=false' \
              >"$RUNNER_TEMP/metering-override.out" 2>"$RUNNER_TEMP/metering-override.err"; then
              echo "::error::Helm accepted a $protected extraEnv override"
              exit 1
            fi
            grep -q 'Billing metering is mandatory' "$RUNNER_TEMP/metering-override.err"
          done

          # Every edge template must route /livez to the GATEWAY. It is the
          # route the docs point external monitoring at, and the only other
          # rule matching it is the proxy "/" catch-all, whose nginx answers
          # `302 /console/` — a monitor reading that as "up" measures the
          # console and stays green through a gateway outage. Asserted per
          # template AND on the backend, because the regression that motivated
          # it was a /livez rule pointing at the wrong service, not a missing
          # one.
          for edge in ingress httproute; do
            case "$edge" in
              ingress)   flags=(--set ingress.enabled=true); svc='name: gateway' ;;
              httproute) flags=(--set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw'); svc='- name: gateway' ;;
            esac
            edge_render="$(helm template t helm --set host=anyray.example.com --set postgres.storage=50Gi \
              "${flags[@]}" -s "templates/${edge}.yaml")"
            # `-F --` because the HTTPRoute backend line starts with "- ",
            # which grep would otherwise parse as an option bundle.
            if ! grep -A4 -E '(value|path): /livez' <<<"$edge_render" | grep -qF -- "$svc"; then
              echo "::error::${edge}.yaml does not route /livez to the gateway — external liveness would hit the console proxy's 302"
              echo "$edge_render"
              exit 1
            fi
          done

          # The BOM reflects whatever the chart actually deploys. By default that
          # is now the policy-stable channel; a mirror operator who wants
          # immutable refs passes --set image.tag or uses the crane path below.
          tool_bin="$(mktemp -d)"
          ln -s "$(command -v helm)" "$tool_bin/helm"
          image_bom="$(PATH="$tool_bin:/usr/bin:/bin" scripts/gen-image-bom.sh)"
          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/Chart.yaml | head -1)"
          grep -q "public.ecr.aws/anyray/gateway:$app" <<<"$image_bom"
          # On the auto-update opt-in the BOM must additionally list the kubectl
          # the CronJob runs: a private registry that fails to mirror it gets a
          # nightly roll that fails with no way to see why from the BOM.
          moving_bom="$(PATH="$tool_bin:/usr/bin:/bin" scripts/gen-image-bom.sh --set-string image.tag=policy-stable)"
          grep -q "registry.k8s.io/kubectl:" <<<"$moving_bom"

          # An image the chart ALREADY digest-pins must pass through verbatim.
          # This only matters on the crane path, which the render above cannot
          # reach (crane is deliberately off that PATH), so it needs its own
          # run: with crane present, gen-image-bom.sh rebuilt every ref as
          # "${ref%:*}@$digest", cutting at the LAST colon — for
          # "name:tag@sha256:…" that is the one inside the digest, emitting an
          # unpullable "docker.io/postgres:17@sha256@sha256:…" and silently
          # breaking the private-registry mirror this BOM exists to drive.
          # Stub crane so the branch runs hermetically, with no registry calls.
          stub_bin="$(mktemp -d)"
          ln -s "$(command -v helm)" "$stub_bin/helm"
          printf '#!/bin/sh\necho "sha256:%064d"\n' 0 >"$stub_bin/crane"
          chmod +x "$stub_bin/crane"
          bom_crane="$(PATH="$stub_bin:/usr/bin:/bin" scripts/gen-image-bom.sh)"
          if grep -q '@sha256.*@sha256' <<<"$bom_crane"; then
            echo "::error::gen-image-bom.sh mangled an already-digest-pinned ref (doubled digest):"
            grep '@sha256.*@sha256' <<<"$bom_crane"
            exit 1
          fi
          # ...and it must come through untouched: no re-resolution, so no
          # trailing "  # <tag>" comment the crane path appends.
          if ! grep -qE '^docker\.io/postgres:[^[:space:]@]+@sha256:[0-9a-f]{64}$' <<<"$bom_crane"; then
            echo "::error::the chart digest-pins postgres, but the BOM did not emit it verbatim:"
            echo "$bom_crane"
            exit 1
          fi

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: cfn-lint the AWS quick-launch template
        run: |
          pipx install cfn-lint
          cfn-lint aws/anyray-quicklaunch.template.yaml
      # Drives the template's inline updater Lambda against stubbed AWS clients.
      # No interpolation, no untrusted input: a fixed script path only.
      - name: Updater Lambda contract (version format, forward-only, input validation)
        run: python3 ci/test-quicklaunch-updater.py
      - name: SecretFn db-url contract (follows the RDS master rotation)
        run: python3 ci/test-quicklaunch-dburl.py
      - name: Template stays within CloudFormation size limits
        run: |
          set -euo pipefail
          template=aws/anyray-quicklaunch.template.yaml
          bytes="$(wc -c < "$template" | tr -d ' ')"
          # CloudFormation caps a template at 51,200 bytes when passed inline
          # (--template-body) and 460,800 when fetched from S3 (--template-url).
          # Everything documented uses the S3 URL, so the S3 cap is the one that
          # would actually break a customer deploy. cfn-lint checks neither.
          inline=51200
          s3=460800
          echo "template is ${bytes} bytes (inline cap ${inline}, S3 cap ${s3})"
          if [ "$bytes" -ge "$s3" ]; then
            echo "::error::Template is ${bytes} bytes, at or over the ${s3}-byte S3 limit — deploys will fail."
            exit 1
          fi
          if [ "$bytes" -ge "$inline" ]; then
            echo "::notice::Template is ${bytes} bytes, over the ${inline}-byte inline limit. Deploys are unaffected (they use --template-url), but 'aws cloudformation validate-template/create-stack --template-body' no longer works on this file."
          fi
      - name: CloudFormation image pin stays immutable across release stamps
        run: |
          set -euo pipefail
          template=aws/anyray-quicklaunch.template.yaml
          image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$template")"

          current_tag="$(awk '$1 == "Default:" { print $2; exit }' <<<"$image_parameter")"
          if [[ ! "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CloudFormation ImageTag.Default is not immutable: ${current_tag:-missing}"
            exit 1
          fi
          grep -Fq "AllowedPattern: '^v[0-9]+\\.[0-9]+\\.[0-9]+$'" <<<"$image_parameter"
          if grep -Eq 'Default:[[:space:]]+(latest|stable)' <<<"$image_parameter"; then
            echo "::error::CloudFormation must never default to a mutable image channel"
            exit 1
          fi

          # Simulate unrelated nightly releases: stamping ImageTag.Default must
          # keep the template lintable and only move the pin.
          first="$RUNNER_TEMP/anyray-quicklaunch-first.template.yaml"
          staged="$RUNNER_TEMP/anyray-quicklaunch-staged.template.yaml"
          cp "$template" "$first"
          cp "$template" "$staged"
          scripts/stamp-aws-image-tag.sh v0.0.1 "$first"
          simulated_tag=v999.999.999
          [ "$current_tag" != "$simulated_tag" ] || simulated_tag=v999.999.998
          scripts/stamp-aws-image-tag.sh "$simulated_tag" "$staged"
          first_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$first")"
          staged_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$staged")"
          grep -qx '    Default: v0.0.1' <<<"$first_image_parameter"
          grep -qx "    Default: $simulated_tag" <<<"$staged_image_parameter"
          cfn-lint "$first"
          cfn-lint "$staged"

          if scripts/stamp-aws-image-tag.sh latest "$staged"; then
            echo "::error::CloudFormation release stamp accepted a mutable tag"
            exit 1
          fi

  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: JSON and IaC image pins stay equal and immutable
        run: |
          set -euo pipefail
          source railway/release-tag.sh
          tag_for() {
            anyray_tag_from_image "$(jq -r --arg name "$1" \
              '.services[] | select(.name == $name) | .source.image // empty' \
              railway/railway.template.json)"
          }
          gateway_tag="$(tag_for gateway)"
          anyray_valid_release_tag "$gateway_tag" || {
            echo "::error::Railway gateway image is not pinned to vX.Y.Z"
            exit 1
          }
          [ "$(tag_for optimizer)" = "$gateway_tag" ] || {
            echo "::error::Railway optimizer pin differs from gateway"
            exit 1
          }
          [ "$(tag_for endpoint-control)" = "$gateway_tag" ] || {
            echo "::error::Railway endpoint-control pin differs from gateway"
            exit 1
          }
          [ "$(tag_for proxy)" = "$gateway_tag" ] || {
            echo "::error::Railway proxy pin differs from gateway"
            exit 1
          }
          iac_tag="$(sed -nE 's/^const TAG = "(v[0-9]+\.[0-9]+\.[0-9]+)";.*/\1/p' .railway/railway.ts)"
          [ "$iac_tag" = "$gateway_tag" ] || {
            echo "::error::Railway IaC and JSON pins differ"
            exit 1
          }

          jq -e '.services[] | select(.name == "gateway")
            | .variables.ANYRAY_METERING_ENABLED == "true"' \
            railway/railway.template.json > /dev/null
          grep -Fq 'ANYRAY_METERING_ENABLED: "true"' .railway/railway.ts

          grep -Fq "ANYRAY_METERING_ENABLED, Value: 'true'" \
            aws/anyray-quicklaunch.template.yaml
          deployment_token_block="$(sed -n '/^  DeploymentToken:/,/^  [A-Za-z]/p' aws/anyray-quicklaunch.template.yaml)"
          grep -q "AllowedPattern: '\^adt_" <<<"$deployment_token_block"
          if grep -q 'Default:' <<<"$deployment_token_block"; then
            echo "::error::AWS DeploymentToken must remain required"
            exit 1
          fi

          # The marketplace publisher must retain the empty deployment-token
          # field so Railway prompts for this required Billing credential.
          railway/build-publish.sh > /dev/null
          grep -qx 'ANYRAY_DEPLOYMENT_TOKEN=' railway/.publish/gateway.vars

          if grep -REni 'ANYRAY_METERING_ENABLED[=: ]+false|\bunmetered\b|metering (off|disabled)' \
            README.md AGENT.md helm/README.md railway/README.md railway/IAC.md; then
            echo "::error::install documentation advertises a metering-off path"
            exit 1
          fi

          grep -Fq 'git -C "$REPO_DIR" pull --ff-only' gcp/gce/startup-script.sh
          grep -Fq './setup.sh --connect "$DEPLOYMENT_TOKEN"' gcp/gce/startup-script.sh
          grep -Fq 'anyray-deploy-generation' gcp/gce/deploy.sh
          grep -Fq "google_metadata_script_runner startup" gcp/gce/deploy.sh
          grep -Fq '^adt_[A-Za-z0-9_-]+$' railway/railway-iac-bootstrap.sh

  # NOTE: the job id stays `gateway-env-coverage` even though it now covers the
  # optimizer too — it is a REQUIRED status check on main (branch protection
  # matches by job name), and renaming it would leave every PR waiting forever on
  # a check that never reports. Rename only alongside a protection update.
  gateway-env-coverage:
    # Every deploy-critical env var must be wired onto ITS SERVICE in EVERY
    # template — compose, CloudFormation, both Railway paths, and Helm. Running
    # daily, it catches template drift before a customer hits it (and a monorepo
    # paired PR that wired a new var into some templates but not all).
    #
    # Two contracts, because the services fail in opposite ways. The GATEWAY
    # (ci/critical-gateway-env.txt) fail-fasts, so a dropped var bricks that
    # install path on the next image bump. The OPTIMIZER
    # (ci/critical-optimizer-env.txt) treats the same vars as optional and
    # degrades in SILENCE — prod 2026-08-08 ran without ANYRAY_SPEND_DB_URL on
    # the optimizer, so every admin setting was per-pod and deploy-ephemeral with
    # nothing logged anywhere. "Degrades rather than bricks" is why it needs a
    # gate, not why it can skip one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: render Helm values (service env comes from the rendered chart)
        run: |
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
      - name: every critical env var is wired onto its service in every template
        run: ci/check-service-env-coverage.sh
      # Same failure class as the env gate above, for datastore SIZE: the
      # gateway keeps 90 days of trace content, so a volume sized below that
      # window fills and stops Postgres months after the install looked fine.
      # Runs after the render so it also checks the values file setup.sh emits,
      # not just the generator's source.
      - name: datastore sizing is in sync across every install artifact
        run: ci/check-storage-defaults.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: bash -n + shellcheck (error severity) on every script
        run: |
          shopt -s globstar nullglob
          set -- **/*.sh
          bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' _ "$@"
          shellcheck -S error "$@"

  connect-binary-system-ca:
    # The release binaries compile with `--compile-exec-argv="--use-system-ca"`
    # (release-connect-binaries.yml) so they trust the roots the MACHINE trusts.
    # Behind a TLS-inspecting corporate proxy the MDM installs a root into the
    # system store; without the flag `curl … | sh` downloads fine (curl reads that
    # store) and the very next step dies SELF_SIGNED_CERT_IN_CHAIN against
    # app.anyray.ai — and NODE_EXTRA_CA_CERTS, the remedy we print, never reaches
    # the LaunchAgent daemon or the drift watcher.
    #
    # This is the guard that a dropped or typo'd flag cannot survive. Bun does not
    # validate an exec-argv string: `--totally-not-a-flag` compiles, runs, exits 0
    # and even lands in process.execArgv, so nothing short of a REAL system trust
    # store can tell a working flag from a silently-ignored one. Hence a job that
    # mints a throwaway root, installs it, and proves the trust difference.
    #
    # WHICH install mode this uses, and why it is not `update-ca-certificates`:
    # on Linux, Bun ALREADY reads OpenSSL's default CApath (the hashed symlinks in
    # /etc/ssl/certs) with no flag at all, and `update-ca-certificates` writes
    # exactly those symlinks. Installing that way makes the unflagged binary trust
    # the root too — the first run of this job failed its own negative control on
    # precisely that, and clearing SSL_CERT_FILE/SSL_CERT_DIR did not change it
    # because no env var was involved. So the root goes in as the CA BUNDLE FILE
    # only (/etc/ssl/certs/ca-certificates.crt, no hashed symlink), which is the
    # mode the flag actually governs:
    #
    #   bundle file only  → unflagged REJECTED, flagged TRUSTED   ← discriminates
    #   hashed symlink    → unflagged TRUSTED,  flagged TRUSTED   ← proves nothing
    #
    # Practical consequence worth knowing: on a Linux box whose corporate root was
    # installed via update-ca-certificates, connect worked even before this flag.
    # The flag is what covers macOS (keychain) and the bundle-file-only layouts.
    #
    # The two negative controls are the point — without them a green check here
    # would be compatible with the flag doing nothing at all:
    #   - before install, BOTH binaries must reject (the root is genuinely unknown)
    #   - after install, the UNFLAGGED binary must still reject (so the pass is
    #     attributable to the flag, not to an env var or a lax default)
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with release-connect-binaries.yml — this proves the flag
          # against the Bun version that actually compiles the released binaries.
          # A pin that drifts from that one makes both guards below vacuous: they
          # would attest to a runtime we do not ship.
          bun-version: '1.3.14'
      - name: compiled binary trusts a root installed in the system store
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"

          # An unflagged Bun honors SSL_CERT_FILE / NODE_EXTRA_CA_CERTS too, so
          # clear them: the comparison below must be attributable to the flag
          # alone, never to inherited env.
          unset SSL_CERT_FILE SSL_CERT_DIR NODE_EXTRA_CA_CERTS REQUESTS_CA_BUNDLE

          # Throwaway CA + localhost leaf. Never leaves the runner; 1-day validity.
          openssl req -x509 -newkey rsa:2048 -keyout ca.key -out ca.pem -days 1 \
            -nodes -subj "/CN=Anyray CI Synthetic Root" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout srv.key -out srv.csr -nodes \
            -subj "/CN=localhost" 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext.cnf
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out srv.pem -days 1 -extfile ext.cnf 2>/dev/null

          cat > srv.ts <<'EOF'
          const s = Bun.serve({
            port: 0,
            tls: { cert: Bun.file('srv.pem'), key: Bun.file('srv.key') },
            fetch: () => new Response('ok'),
          });
          await Bun.write('port.txt', String(s.port));
          await Bun.sleep(120000);
          EOF
          cat > probe.ts <<'EOF'
          const port = (await Bun.file('port.txt').text()).trim();
          try {
            const r = await fetch(`https://localhost:${port}/`);
            console.log(r.status === 200 ? 'TRUSTED' : 'UNEXPECTED');
          } catch {
            console.log('REJECTED');
          }
          EOF

          # Compiled exactly as the release job does, with and without the flag.
          bun build --compile --minify probe.ts --outfile probe-plain >/dev/null
          bun build --compile --minify --compile-exec-argv="--use-system-ca" \
            probe.ts --outfile probe-sys >/dev/null

          bun srv.ts &
          for _ in $(seq 1 30); do [ -s port.txt ] && break; sleep 0.2; done
          test -s port.txt

          [ "$(./probe-plain)" = REJECTED ] ||
            { echo "::error::baseline broken — unflagged binary trusted an unknown root"; exit 1; }
          [ "$(./probe-sys)" = REJECTED ] ||
            { echo "::error::baseline broken — flagged binary trusted the root before it was installed"; exit 1; }

          # Append to the CA BUNDLE FILE only. Deliberately NOT
          # update-ca-certificates: that also writes the hashed CApath symlink an
          # unflagged Bun already reads, which would collapse the comparison (see
          # the table in this job's header).
          sudo cp /etc/ssl/certs/ca-certificates.crt ./bundle.bak
          cat ./bundle.bak ca.pem | sudo tee /etc/ssl/certs/ca-certificates.crt >/dev/null

          [ "$(./probe-sys)" = TRUSTED ] ||
            { echo "::error::--use-system-ca did NOT pick up a root installed in the system store. The released binaries would fail SELF_SIGNED_CERT_IN_CHAIN behind a TLS-inspecting proxy. Check the flag in release-connect-binaries.yml and the pinned Bun version."; exit 1; }
          [ "$(./probe-plain)" = REJECTED ] || {
            echo "::error::unflagged binary also trusted it — this guard no longer proves anything"
            echo "Something outside the flag is feeding the binary extra roots. Cert-related env:"
            env | grep -iE 'ssl|cert|ca_bundle' || echo "  (none set)"
            exit 1
          }

          echo "system-CA trust verified: flagged=TRUSTED, unflagged=REJECTED"

      # The other half of --compile-exec-argv. The step above proves the flag is
      # APPLIED; this proves it is not applied at the cost of the CLI's own argv.
      #
      # On Bun 1.3.5 the exec argv was prepended to the real argv and parsed in
      # one pass, so Bun consumed the leading run of connect's flags: `--help`
      # printed Bun's help, `--version` printed Bun's version, and `-y`/`-V` exited
      # 1 with `error: Invalid Argument`. That shipped, because nothing compiled
      # WITH the flag and then ran WITH arguments — the monorepo's binarySmoke
      # test does one or the other, never both.
      #
      # Parsing stopped at the first positional, so only the LEADING run is at
      # risk; `probe sync -y` would pass on a binary where `probe -y` dies. The
      # cases below are therefore all leading, and `--sso -y` is included because
      # an unknown long flag does not end the run — the short flag after it still
      # reaches Bun's parser.
      - name: compiled binary passes its own CLI flags through
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"

          cat > argv.ts <<'EOF'
          console.log(JSON.stringify(process.argv.slice(2)));
          EOF

          # Compiled exactly as the release job does, flag included.
          bun build --compile --minify --compile-exec-argv="--use-system-ca" \
            argv.ts --outfile argv-probe >/dev/null

          # Real connect flags that Bun's runtime parser also recognises or
          # rejects. Each must arrive verbatim, with exit 0.
          fail=0
          check() {
            expected="$1"; shift
            if ! got="$(./argv-probe "$@" 2>&1)"; then
              echo "::error::\`$*\` exited non-zero: ${got}"
              fail=1
              return
            fi
            if [ "$got" != "$expected" ]; then
              echo "::error::\`$*\` did not reach the program — Bun intercepted it. got=${got} want=${expected}"
              fail=1
            fi
          }

          check '["--help"]'        --help
          check '["-h"]'            -h
          check '["--version"]'     --version
          check '["-v"]'            -v
          check '["-V"]'            -V
          check '["-y"]'            -y
          check '["--sso","-y"]'    --sso -y

          if [ "$fail" -ne 0 ]; then
            echo "::error::the pinned Bun is eating the CLI's flags before connect sees them. Do NOT fix this by appending '--' or a sentinel to --compile-exec-argv: that stops the interception by silently dropping --use-system-ca, which the step above would then catch. Raise the bun-version pin here and in release-connect-binaries.yml instead."
            exit 1
          fi

          echo "argv passthrough verified: every leading-flag case reached the program"

  bump-freshness:
    # Guards the failure mode where the monorepo prod promotion's install bump
    # PR fails to merge: publish-chart reads install@main and skips
    # already-published chart versions, so Helm customers silently freeze on an
    # old appVersion while every release logs "already published". A bump PR
    # open longer than a day means that pipeline is broken again.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: no release bump PR may sit open >24h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Bump install for v in:title' --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 86400) | .number] | join(", ")')"
          if [ -n "$stale" ]; then
            echo "::error::release bump PR(s) #${stale} open >24h — deploy-prod auto-merge is broken; Helm customers are freezing on an old chart"
            exit 1
          fi
