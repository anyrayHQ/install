name: Validate install artifacts

# Every install path a customer can pick (compose, attach, Helm via setup.sh
# --k8s, AWS CloudFormation, Railway, GCP/Azure scripts) must parse, render,
# and resolve — a template that doesn't is a broken install for the next
# customer. Runs on every change and daily, because artifacts also rot without
# commits here (validator rule updates, image defaults, monorepo env-var
# changes arriving via paired PRs).
#
# Helm chart lint + the image-pinning invariant live in helm-chart.yml; this
# workflow covers everything else plus the setup.sh-generated Helm values.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup.sh produces a complete .env (docker path)
        run: |
          ./setup.sh --host ci.example.com --connect adt_ci0000000000000000 \
            --gateway-url http://ci.example.com:8787
          test -f .env
      - name: main stack resolves (every required var satisfied)
        run: docker compose config -q
      - name: setup requires Billing except for explicit attach mode
        run: |
          set -euo pipefail
          fresh="$(mktemp -d)"
          if (cd "$fresh" && "$GITHUB_WORKSPACE/setup.sh" --host ci.example.com >/dev/null 2>&1); then
            echo "::error::fresh gateway setup succeeded without --connect"
            exit 1
          fi
          attach_output="$RUNNER_TEMP/attach-setup.out"
          (cd "$fresh" && "$GITHUB_WORKSPACE/setup.sh" --attach --host ci.example.com >"$attach_output" 2>&1)
          test -f "$fresh/.env"
          grep -q 'docker compose -f docker-compose.attach.yml up -d' "$attach_output"
          if grep -q 'Gateway:' "$attach_output"; then
            echo "::error::attach setup advertised a gateway that does not run"
            exit 1
          fi
          if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --attach --upstream http://upstream.internal >/dev/null 2>&1); then
            echo "::error::attach setup accepted gateway-only --upstream"
            exit 1
          fi
          for invalid in false adt_; do
            if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --connect "$invalid" --host ci.example.com >/dev/null 2>&1); then
              echo "::error::setup accepted invalid deployment token '$invalid'"
              exit 1
            fi
          done
          injected=$'adt_x\nANYRAY_DEV_UNSAFE_CONTROL_PLANE=1'
          if (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/setup.sh" --connect "$injected" --host ci.example.com >/dev/null 2>&1); then
            echo "::error::setup accepted a newline-bearing deployment token"
            exit 1
          fi

          mixed="$(mktemp -d)"
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --connect adt_ci0000000000000000 --host ci.example.com >/dev/null 2>&1)
          if (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --host anyray.internal >/dev/null 2>&1); then
            echo "::error::Docker .env incorrectly authorized a token-less Kubernetes setup"
            exit 1
          fi
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --connect adt_ci0000000000000000 --host anyray.internal >/dev/null 2>&1)
          (cd "$mixed" && "$GITHUB_WORKSPACE/setup.sh" --k8s --host anyray.internal >/dev/null 2>&1)
      - name: Compose requires the Billing identity
        run: |
          set -euo pipefail
          for missing in ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            if env "$missing=" docker compose config -q >/dev/null 2>&1; then
              echo "::error::Compose accepted an empty $missing"
              exit 1
            fi
          done
      - name: Compose cannot disable mandatory Billing metering
        run: |
          set -euo pipefail
          value="$(ANYRAY_METERING_ENABLED=false docker compose config --format json \
            | jq -r '.services.gateway.environment.ANYRAY_METERING_ENABLED')"
          [ "$value" = "true" ] || {
            echo "::error::Compose honored ANYRAY_METERING_ENABLED=false (resolved '$value')"
            exit 1
          }
      - name: gateway waits for optimizer health
        run: |
          set -euo pipefail
          config="$(docker compose config --format json)"
          jq -e '.services.gateway.depends_on.optimizer.condition == "service_healthy"' <<<"$config" > /dev/null
      - name: every compose image carries an explicit tag
        run: |
          untagged="$(docker compose config --images | grep -Ev ':[^/]+$' || true)"
          if [ -n "$untagged" ]; then
            echo "::error::untagged image(s) — pin them: ${untagged}"
            exit 1
          fi
      - name: attach mode resolves
        run: docker compose -f docker-compose.attach.yml config -q
      - name: platform image defaults move as one release set
        run: |
          set -euo pipefail
          expected="$(sed -nE 's#.*ANYRAY_IMAGE_TAG:-(v[0-9]+\.[0-9]+\.[0-9]+|policy-stable)\}.*#\1#p' \
            docker-compose.yml | head -1)"
          [[ "$expected" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$expected" = policy-stable ]]
          for file in gcp/deploy.sh gcp/gce/deploy.sh azure/deploy.sh; do
            grep -Fq "IMAGE_TAG=\"\${IMAGE_TAG:-${expected}}\"" "$file" || {
              echo "::error::$file does not share the image default $expected"
              exit 1
            }
          done
          grep -Fq "anyray-image-tag $expected" gcp/gce/startup-script.sh || {
            echo "::error::GCE startup does not share the image default $expected"
            exit 1
          }
          ! grep -REn 'IMAGE_TAG=.*\:-latest|anyray-image-tag latest' gcp azure
          bash -n gcp/gce/upgrade.sh
          ci/check-gce-upgrade.sh

          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            helm/Chart.yaml | head -1)"
          scripts/validate-one-click-image-tag.sh "$app" helm/Chart.yaml
          scripts/validate-one-click-image-tag.sh policy-stable helm/Chart.yaml
          custom=v999.999.999
          [ "$custom" != "$app" ] || custom=v999.999.998
          if scripts/validate-one-click-image-tag.sh "$custom" helm/Chart.yaml \
            >"$RUNNER_TEMP/custom-tag.out" 2>"$RUNNER_TEMP/custom-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted an unverified custom tag"
            exit 1
          fi
          grep -q 'documented manual Helm flow' "$RUNNER_TEMP/custom-tag.err"
          if scripts/validate-one-click-image-tag.sh latest helm/Chart.yaml \
            >"$RUNNER_TEMP/latest-tag.out" 2>"$RUNNER_TEMP/latest-tag.err"; then
            echo "::error::one-click Kubernetes deploy accepted latest"
            exit 1
          fi

  k8s-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: setup.sh --k8s secrets + values render against the chart
        run: |
          set -euo pipefail
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
          render="$(helm template t ./helm -f my-values.yaml)"
          test "$(grep -c 'name: ANYRAY_METERING_ENABLED' <<<"$render")" -eq 1
          grep -A1 'name: ANYRAY_METERING_ENABLED' <<<"$render" | grep -q 'value: "true"'
          for required in ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            grep -A4 "key: $required" <<<"$render" >/dev/null
            if grep -A4 "key: $required" <<<"$render" | grep -q 'optional: true'; then
              echo "::error::Helm made $required optional"
              exit 1
            fi
          done

          # An old values file may still carry the retired toggle. It must be
          # ignored, while an extraEnv duplicate is rejected instead of winning.
          legacy="$(helm template t ./helm -f my-values.yaml \
            --set gateway.metering.enabled=false)"
          grep -A1 'name: ANYRAY_METERING_ENABLED' <<<"$legacy" | grep -q 'value: "true"'
          for protected in ANYRAY_METERING_ENABLED ANYRAY_DEPLOYMENT_TOKEN ANYRAY_PSEUDONYM_SALT; do
            if helm template t ./helm -f my-values.yaml \
              --set "gateway.extraEnv[0].name=$protected" \
              --set-string 'gateway.extraEnv[0].value=false' \
              >"$RUNNER_TEMP/metering-override.out" 2>"$RUNNER_TEMP/metering-override.err"; then
              echo "::error::Helm accepted a $protected extraEnv override"
              exit 1
            fi
            grep -q 'Billing metering is mandatory' "$RUNNER_TEMP/metering-override.err"
          done

          # Render-only tooling emits the chart's independently pinned appVersion.
          tool_bin="$(mktemp -d)"
          ln -s "$(command -v helm)" "$tool_bin/helm"
          image_bom="$(PATH="$tool_bin:/usr/bin:/bin" scripts/gen-image-bom.sh)"
          app="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' helm/Chart.yaml | head -1)"
          grep -q "public.ecr.aws/anyray/gateway:$app" <<<"$image_bom"

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cfn-lint the AWS quick-launch template
        run: |
          pipx install cfn-lint
          cfn-lint aws/anyray-quicklaunch.template.yaml
      - name: CloudFormation image pin stays immutable across release stamps
        run: |
          set -euo pipefail
          template=aws/anyray-quicklaunch.template.yaml
          image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$template")"

          current_tag="$(awk '$1 == "Default:" { print $2; exit }' <<<"$image_parameter")"
          if [[ ! "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CloudFormation ImageTag.Default is not immutable: ${current_tag:-missing}"
            exit 1
          fi
          grep -Fq "AllowedPattern: '^v[0-9]+\\.[0-9]+\\.[0-9]+$'" <<<"$image_parameter"
          if grep -Eq 'Default:[[:space:]]+(latest|stable)' <<<"$image_parameter"; then
            echo "::error::CloudFormation must never default to a mutable image channel"
            exit 1
          fi

          # Simulate unrelated nightly releases: stamping ImageTag.Default must
          # keep the template lintable and only move the pin.
          first="$RUNNER_TEMP/anyray-quicklaunch-first.template.yaml"
          staged="$RUNNER_TEMP/anyray-quicklaunch-staged.template.yaml"
          cp "$template" "$first"
          cp "$template" "$staged"
          scripts/stamp-aws-image-tag.sh v0.0.1 "$first"
          simulated_tag=v999.999.999
          [ "$current_tag" != "$simulated_tag" ] || simulated_tag=v999.999.998
          scripts/stamp-aws-image-tag.sh "$simulated_tag" "$staged"
          first_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$first")"
          staged_image_parameter="$(awk '/^  ImageTag:/{p=1;print;next} p && /^  [A-Za-z][A-Za-z0-9]*:/{exit} p{print}' "$staged")"
          grep -qx '    Default: v0.0.1' <<<"$first_image_parameter"
          grep -qx "    Default: $simulated_tag" <<<"$staged_image_parameter"
          cfn-lint "$first"
          cfn-lint "$staged"

          if scripts/stamp-aws-image-tag.sh latest "$staged"; then
            echo "::error::CloudFormation release stamp accepted a mutable tag"
            exit 1
          fi

  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: JSON and IaC image pins stay equal and immutable
        run: |
          set -euo pipefail
          source railway/release-tag.sh
          tag_for() {
            anyray_tag_from_image "$(jq -r --arg name "$1" \
              '.services[] | select(.name == $name) | .source.image // empty' \
              railway/railway.template.json)"
          }
          gateway_tag="$(tag_for gateway)"
          anyray_valid_release_tag "$gateway_tag" || {
            echo "::error::Railway gateway image is not pinned to vX.Y.Z"
            exit 1
          }
          [ "$(tag_for optimizer)" = "$gateway_tag" ] || {
            echo "::error::Railway optimizer pin differs from gateway"
            exit 1
          }
          [ "$(tag_for proxy)" = "$gateway_tag" ] || {
            echo "::error::Railway proxy pin differs from gateway"
            exit 1
          }
          iac_tag="$(sed -nE 's/^const TAG = "(v[0-9]+\.[0-9]+\.[0-9]+)";.*/\1/p' .railway/railway.ts)"
          [ "$iac_tag" = "$gateway_tag" ] || {
            echo "::error::Railway IaC and JSON pins differ"
            exit 1
          }

          jq -e '.services[] | select(.name == "gateway")
            | .variables.ANYRAY_METERING_ENABLED == "true"' \
            railway/railway.template.json > /dev/null
          grep -Fq 'ANYRAY_METERING_ENABLED: "true"' .railway/railway.ts

          grep -Fq "ANYRAY_METERING_ENABLED, Value: 'true'" \
            aws/anyray-quicklaunch.template.yaml
          deployment_token_block="$(sed -n '/^  DeploymentToken:/,/^  [A-Za-z]/p' aws/anyray-quicklaunch.template.yaml)"
          grep -q "AllowedPattern: '\^adt_" <<<"$deployment_token_block"
          if grep -q 'Default:' <<<"$deployment_token_block"; then
            echo "::error::AWS DeploymentToken must remain required"
            exit 1
          fi

          # The marketplace publisher must retain the empty deployment-token
          # field so Railway prompts for this required Billing credential.
          railway/build-publish.sh > /dev/null
          grep -qx 'ANYRAY_DEPLOYMENT_TOKEN=' railway/.publish/gateway.vars

          if grep -REni 'ANYRAY_METERING_ENABLED[=: ]+false|\bunmetered\b|metering (off|disabled)' \
            README.md AGENT.md helm/README.md railway/README.md railway/IAC.md; then
            echo "::error::install documentation advertises a metering-off path"
            exit 1
          fi

          grep -Fq 'git -C "$REPO_DIR" pull --ff-only' gcp/gce/startup-script.sh
          grep -Fq './setup.sh --connect "$DEPLOYMENT_TOKEN"' gcp/gce/startup-script.sh
          grep -Fq 'anyray-deploy-generation' gcp/gce/deploy.sh
          grep -Fq "google_metadata_script_runner startup" gcp/gce/deploy.sh
          grep -Fq '^adt_[A-Za-z0-9_-]+$' railway/railway-iac-bootstrap.sh

  gateway-env-coverage:
    # Every deploy-critical gateway env var (ci/critical-gateway-env.txt) must be
    # wired into EVERY template — compose, CloudFormation, both Railway paths,
    # and Helm. A var
    # the gateway fail-fasts on (or the admin console needs), silently dropped
    # from one template, bricks that install path on the next image bump.
    # Running daily, it catches template drift before a customer hits it (and
    # a monorepo paired PR that wired a new var into some templates but not all).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
          token: ${{ github.token }}
      - name: render Helm values (gateway env comes from the rendered chart)
        run: |
          ./setup.sh --k8s --connect adt_ci0000000000000000 \
            --host anyray.internal --namespace anyray
      - name: every critical gateway env var is wired into every template
        run: ci/check-gateway-env-coverage.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash -n + shellcheck (error severity) on every script
        run: |
          shopt -s globstar nullglob
          set -- **/*.sh
          bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' _ "$@"
          shellcheck -S error "$@"

  bump-freshness:
    # Guards the failure mode where the monorepo prod promotion's install bump
    # PR fails to merge: publish-chart reads install@main and skips
    # already-published chart versions, so Helm customers silently freeze on an
    # old appVersion while every release logs "already published". A bump PR
    # open longer than a day means that pipeline is broken again.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: no release bump PR may sit open >24h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Bump install for v in:title' --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 86400) | .number] | join(", ")')"
          if [ -n "$stale" ]; then
            echo "::error::release bump PR(s) #${stale} open >24h — deploy-prod auto-merge is broken; Helm customers are freezing on an old chart"
            exit 1
          fi
