AWSTemplateFormatVersion: '2010-09-09'

# AWS::LanguageExtensions enables Fn::ForEach, used below to fan the ALB
# ingress rules out over the (comma-separated) list of AllowedCidr values.
Transform: AWS::LanguageExtensions

Description: >-
  Anyray one-click deploy (ECS/Fargate). Brings up the full self-hosted stack as
  managed containers — gateway + optimizer + console proxy on AWS Fargate, with a
  managed RDS PostgreSQL store and EFS for runtime config. An Application Load
  Balancer fronts the gateway API (:8787) and the console (:3000), scoped to the
  CIDR you provide (never 0.0.0.0/0). All secrets are generated by CloudFormation
  into Secrets Manager — no bootstrap script. Content stays encrypted at rest;
  only metadata is logged.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Start here }
        Parameters: [AllowedCidr, DeploymentToken]
      - Label: { default: Images }
        Parameters: [ImageTag, EnableAutoUpdate, DefaultModel]
      - Label: { default: Ingress / TLS }
        Parameters: [LoadBalancerScheme, CertificateArn, GatewayPublicUrl, ConsolePublicUrl]
      - Label: { default: Anyray Cloud (metering) }
        Parameters: [SeatExclude, MeteringIntervalMs, EntitlementGraceMs]
      - Label: { default: Content privacy }
        Parameters: [ContentMode, AllowPlaintext, SpendRetentionDays]
      - Label: { default: Gateway hardening }
        Parameters:
          [
            Hsts,
            RateLimitRpm,
            RateLimitIpRpm,
            RateLimitUnauthRpm,
            MaxConcurrentRequests,
            AuthFailLimit,
            MaxBodyBytes,
            CustomHostAllowlist,
            TrustedCustomHosts,
            UpstreamUrl,
          ]
      - Label: { default: Optimizer }
        Parameters: [OptimizerTimeoutMs, OptimizerVisionTimeoutMs]
      - Label: { default: Availability }
        Parameters: [HighAvailability]
      - Label: { default: Database }
        Parameters: [DbInstanceClass, DbAllocatedStorage, DbMaxAllocatedStorage, EnableRdsDeletionProtection]
      - Label: { default: Advanced networking (leave blank) }
        Parameters: [VpcId, SubnetA, SubnetB]
    ParameterLabels:
      AllowedCidr: { default: "Allowed CIDR(s) (your office/VPN range, comma-separated)" }
      LoadBalancerScheme: { default: "Load balancer reachability (internal = private, VPC-only)" }
      EnableRdsDeletionProtection: { default: "Protect the database from deletion (production)" }
      HighAvailability: { default: "Run redundant tasks and a Multi-AZ database (production)" }
      VpcId: { default: "VPC (leave blank = account default VPC)" }
      SubnetA: { default: "Public subnet in AZ 1 (leave blank)" }
      SubnetB: { default: "Public subnet in AZ 2 (leave blank)" }

Parameters:
  VpcId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vpc-[0-9a-f]{8,17}$'
    ConstraintDescription: Leave blank, or give a VPC id like vpc-0a1b2c3d.
    Description: >-
      LEAVE BLANK to use this account's default VPC — that is the normal choice
      and needs no networking knowledge. Only set this (together with SubnetA
      and SubnetB) to place Anyray in a specific VPC.
  SubnetA:
    Type: String
    Default: ''
    AllowedPattern: '^$|^subnet-[0-9a-f]{8,17}$'
    ConstraintDescription: Leave blank, or give a subnet id like subnet-0a1b2c3d.
    Description: >-
      Leave blank unless you set VpcId. A PUBLIC subnet that auto-assigns a
      public IPv4 — tasks pull images from GHCR and reach the Portal/providers
      directly (no NAT gateway). Validated before anything is created.
  SubnetB:
    Type: String
    Default: ''
    AllowedPattern: '^$|^subnet-[0-9a-f]{8,17}$'
    ConstraintDescription: Leave blank, or give a subnet id like subnet-0a1b2c3d.
    Description: >-
      Leave blank unless you set VpcId. A second PUBLIC subnet in a DIFFERENT AZ
      — the load balancer and RDS both require two AZs.
  AllowedCidr:
    Type: CommaDelimitedList
    Description: >-
      CIDR range(s) allowed to reach the console (:3000) and gateway (:8787)
      through the load balancer. Scope this to your office / VPN range(s). Pass a
      single CIDR, or several comma-separated (e.g.
      203.0.113.0/24,198.51.100.0/24). Do NOT use 0.0.0.0/0.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: >-
      Each value must be a CIDR like 203.0.113.0/24 (not 0.0.0.0/0); separate
      multiple with commas.
  ImageTag:
    Type: String
    Default: v1.10.230
    AllowedPattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    ConstraintDescription: Must be an immutable Anyray release tag such as v1.10.120.
    Description: >-
      Immutable Anyray release tag deployed by all three services. This default
      is stamped by the release workflow; mutable latest/stable channels are not
      accepted because independently rolled ECS tasks must stay compatible.
  EnableAutoUpdate:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Let this deployment apply compatible ("soft") releases on its own. The
      gateway already decides WHETHER an update is safe — it evaluates the
      release manifest against this install and never applies one needing
      operator action. This only gives it the arm it lacks on ECS: a Lambda
      that rolls all three services together. Turning it off removes that arm;
      the gateway keeps notifying in the console either way. The operator can
      also flip it at runtime via PUT /admin/update/settings.
  DefaultModel:
    Type: String
    Default: 'anthropic/claude-sonnet-4-5'
    Description: >-
      Model the `anyray-default` routing sentinel resolves to. Set it to a model
      your configured provider serves (a bare model is read under `anthropic`).
  LoadBalancerScheme:
    Type: String
    Default: internet-facing
    AllowedValues: [internet-facing, internal]
    Description: >-
      Whether the load balancer gets public IPs. Choose "internal" to keep Anyray
      entirely inside your VPC, reachable only over VPN, Direct Connect, or a peered
      network - its DNS name then resolves to private addresses and there is no
      public entry point at all. The ECS tasks keep their own egress either way, so
      the gateway still reaches your model providers. With "internal" also set
      AllowedCidr to the ranges that should reach it (your VPC or corporate CIDR,
      not 0.0.0.0/0), and expect the ConsoleURL and GatewayURL outputs to be
      resolvable only from inside the network.
  CertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:acm:.+$'
    Description: >-
      Optional ACM certificate ARN. If set, both listeners serve HTTPS; if empty,
      they serve HTTP (scoped to AllowedCidr).
  GatewayPublicUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https?://\S+$'
    Description: Optional externally reachable gateway URL (defaults to the load balancer DNS).
  ConsolePublicUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https?://\S+$'
    Description: Optional externally reachable console URL (defaults to the load balancer DNS).
  DeploymentToken:
    Type: String
    NoEcho: true
    AllowedPattern: '^adt_[A-Za-z0-9_-]+$'
    Description: Anyray Cloud deployment token (adt_...) for usage metering.
  SeatExclude:
    Type: String
    Default: ''
    Description: >-
      Optional comma-separated globs of user ids to exclude from the billed
      seat count (CI bots, service accounts), e.g. "bot-*,ci-*". Empty bills
      every active user.
  MeteringIntervalMs:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional metering rollup upload interval in milliseconds (empty = gateway default).
  EntitlementGraceMs:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: >-
      Optional grace window in milliseconds the gateway keeps serving after the
      entitlement lease expires (empty = gateway default).
  ContentMode:
    Type: String
    Default: encrypted
    AllowedValues: ['encrypted', 'off', 'plaintext']
    Description: Content-privacy mode. `encrypted` (default) keeps content as AES-256-GCM ciphertext.
  AllowPlaintext:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Deploy gate that must be true before `plaintext` content mode can be selected.
  Hsts:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Emit HSTS headers (set true only when served over HTTPS).
  SpendRetentionDays:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: >-
      Retention window in days. Prunes spend rows older than this (empty =
      keep forever) and overrides the trace-store window (traces default to
      90 days when empty).
  RateLimitRpm:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional per-identity /v1 request limit per minute.
  RateLimitIpRpm:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional per-source-IP /v1 request limit per minute.
  RateLimitUnauthRpm:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional unauthenticated endpoint request limit per minute.
  MaxConcurrentRequests:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional max concurrent /v1 requests per identity or IP.
  AuthFailLimit:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional max failed auth attempts per identity/IP before a temporary lockout.
  MaxBodyBytes:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: Optional max request body size in bytes.
  CustomHostAllowlist:
    Type: String
    Default: ''
    Description: >-
      Optional comma-separated hostnames (no port) allowed as custom provider
      hosts — set together with TrustedCustomHosts when UpstreamUrl points at an
      internal host, so it clears the SSRF proxy guard.
  TrustedCustomHosts:
    Type: String
    Default: ''
    Description: >-
      Optional comma-separated custom hosts trusted by the SSRF proxy guard
      (pair with CustomHostAllowlist).
  UpstreamUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https?://\S+$'
    Description: >-
      On-top mode: optional OpenAI-compatible upstream gateway (LiteLLM,
      OpenRouter, ...) that seeds the default routing config, so clients send no
      x-anyray-config header. Empty = route directly to providers.
  OptimizerTimeoutMs:
    Type: String
    Default: '800'
    AllowedPattern: '^[0-9]+$'
    Description: Optimizer timeout for normal requests in milliseconds.
  OptimizerVisionTimeoutMs:
    Type: String
    Default: '10000'
    AllowedPattern: '^[0-9]+$'
    Description: Optimizer timeout for vision requests in milliseconds.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS PostgreSQL instance class.
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: RDS allocated storage in GiB.
  DbMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 21
    Description: >-
      Upper bound for RDS storage autoscaling in GiB (must exceed allocated
      storage). Trace content accumulates until the 90-day retention window
      fills, so the database grows for its first three months; without
      autoscaling it goes storage-full and stops accepting writes.
  HighAvailability:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Remove the single points of failure. Off, this stack runs ONE Fargate task
      per service and a single-AZ database, so any task or AZ loss is a full
      outage until AWS replaces it (typically minutes) — fine for an evaluation,
      not for traffic anyone depends on. On, each service runs two tasks spread
      across the stack's two AZs and the database becomes Multi-AZ with automatic
      failover. Both halves matter: redundant tasks in front of a single-AZ
      database still go down with that AZ. This roughly doubles the compute and
      database cost of the stack, which is why it is off by default. Safe to turn
      on later — it is a rolling change, not a rebuild.
  EnableRdsDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Block deletion of the database instance. Recommended for production: it
      guards against an accidental console or CLI delete, which DeletionPolicy
      Snapshot does not cover (that only applies to deletion through this
      stack). Left off by default so the stack stays one-click removable. NOTE:
      while this is true, deleting the stack FAILS — set it back to false and
      update the stack first, then delete.

Rules:
  AllowedCidrMustNotBePublic:
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Contains:
                - !Ref AllowedCidr
                - '0.0.0.0/0'
        AssertDescription: AllowedCidr must be scoped to your org or VPN, not 0.0.0.0/0.
  VpcTrioAllOrNothing:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref VpcId, '']
                - Fn::Equals: [!Ref SubnetA, '']
                - Fn::Equals: [!Ref SubnetB, '']
            - Fn::And:
                - Fn::Not: [Fn::Equals: [!Ref VpcId, '']]
                - Fn::Not: [Fn::Equals: [!Ref SubnetA, '']]
                - Fn::Not: [Fn::Equals: [!Ref SubnetB, '']]
        AssertDescription: >-
          Leave VpcId, SubnetA and SubnetB ALL blank to use this account's default
          VPC, or set all three. Setting only some of them is not valid.

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, '']]
  HasGatewayUrl: !Not [!Equals [!Ref GatewayPublicUrl, '']]
  HasConsoleUrl: !Not [!Equals [!Ref ConsolePublicUrl, '']]
  RdsDeletionProtection: !Equals [!Ref EnableRdsDeletionProtection, 'true']
  AutoUpdate: !Equals [!Ref EnableAutoUpdate, 'true']
  InternalLb: !Equals [!Ref LoadBalancerScheme, 'internal']
  Ha: !Equals [!Ref HighAvailability, 'true']

Resources:
  # ---- Network resolution -----------------------------------------------------
  # CloudFormation cannot discover the default VPC, so a tiny read-only Lambda
  # does it. It ALWAYS runs: given blank inputs it picks the default VPC and two
  # public subnets in different AZs; given explicit ones it validates them and
  # echoes them back. That turns the classic failure of this template — a private
  # or same-AZ subnet blowing up halfway through with an opaque ECS error — into
  # an immediate, readable message, and lets a non-DevOps user deploy with no
  # networking input at all.
  NetFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: describe-network
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Describe* does not support resource-level permissions.
              - Effect: Allow
                Action: [ec2:DescribeVpcs, ec2:DescribeSubnets, ec2:DescribeRouteTables]
                Resource: '*'

  NetFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt NetFnRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, traceback, boto3
          ec2 = boto3.client('ec2')

          def send(event, context, status, data=None, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or ('See CloudWatch log stream ' + context.log_stream_name),
                  'PhysicalResourceId': event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {},
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))})
              urllib.request.urlopen(req)

          def routes_to_igw(subnet_id, vpc):
              # MapPublicIpOnLaunch only assigns an address; without a default
              # route to an internet gateway the task still cannot reach GHCR.
              rts = ec2.describe_route_tables(Filters=[
                  {'Name': 'association.subnet-id', 'Values': [subnet_id]}])['RouteTables']
              if not rts:
                  # No explicit association means the subnet uses the VPC main table.
                  rts = ec2.describe_route_tables(Filters=[
                      {'Name': 'vpc-id', 'Values': [vpc]},
                      {'Name': 'association.main', 'Values': ['true']}])['RouteTables']
              for rt in rts:
                  for r in rt.get('Routes', []):
                      if (r.get('DestinationCidrBlock') == '0.0.0.0/0'
                              and (r.get('GatewayId') or '').startswith('igw-')):
                          return True
              return False

          def resolve(props):
              vpc = (props.get('VpcId') or '').strip()
              a = (props.get('SubnetA') or '').strip()
              b = (props.get('SubnetB') or '').strip()
              given = [x for x in (vpc, a, b) if x]

              if given and len(given) != 3:
                  raise Exception(
                      'Set all three of VpcId, SubnetA and SubnetB, or leave all three '
                      'blank to use this account default VPC.')

              if not given:
                  vpcs = ec2.describe_vpcs(
                      Filters=[{'Name': 'isDefault', 'Values': ['true']}])['Vpcs']
                  if not vpcs:
                      raise Exception(
                          'This account has no default VPC in this region. Either create one '
                          '(VPC console > Actions > Create default VPC) or set VpcId, SubnetA '
                          'and SubnetB explicitly.')
                  vpc = vpcs[0]['VpcId']
                  subs = ec2.describe_subnets(Filters=[
                      {'Name': 'vpc-id', 'Values': [vpc]},
                      {'Name': 'default-for-az', 'Values': ['true']}])['Subnets']
                  by_az = {}
                  for sn in sorted(subs, key=lambda x: x['SubnetId']):
                      if (sn.get('MapPublicIpOnLaunch')
                              and routes_to_igw(sn['SubnetId'], vpc)):
                          by_az.setdefault(sn['AvailabilityZone'], sn['SubnetId'])
                  if len(by_az) < 2:
                      raise Exception(
                          'The default VPC has public subnets in fewer than two availability '
                          'zones, but the load balancer and RDS both need two. Set SubnetA and '
                          'SubnetB explicitly.')
                  azs = sorted(by_az)
                  a, b = by_az[azs[0]], by_az[azs[1]]
              else:
                  # Check this before DescribeSubnets: the API de-duplicates ids, so
                  # passing the same subnet twice comes back as a single result and
                  # would slip past the availability-zone comparison below.
                  if a == b:
                      raise Exception(
                          'SubnetA and SubnetB are the same subnet (%s). The load balancer '
                          'and RDS both need two subnets in different availability zones.' % a)
                  found = ec2.describe_subnets(SubnetIds=[a, b])['Subnets']
                  for sn in found:
                      if sn['VpcId'] != vpc:
                          raise Exception('Subnet %s is not in %s.' % (sn['SubnetId'], vpc))
                      if not sn.get('MapPublicIpOnLaunch'):
                          raise Exception(
                              'Subnet %s does not auto-assign a public IPv4. Tasks pull images '
                              'from GHCR with no NAT gateway, so both subnets must be public.'
                              % sn['SubnetId'])
                      if not routes_to_igw(sn['SubnetId'], vpc):
                          raise Exception(
                              'Subnet %s has no default route to an internet gateway, so tasks '
                              'in it cannot reach GHCR to pull images. Use a public subnet.'
                              % sn['SubnetId'])
                  azs = {sn['AvailabilityZone'] for sn in found}
                  if len(azs) < 2:
                      raise Exception(
                          'SubnetA and SubnetB must be in different availability zones (both '
                          'are in %s).' % found[0]['AvailabilityZone'])

              return {'VpcId': vpc, 'SubnetA': a, 'SubnetB': b}

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      return send(event, context, 'SUCCESS')
                  return send(event, context, 'SUCCESS', resolve(event['ResourceProperties']))
              except Exception as e:
                  print('NetFn FAILED:', traceback.format_exc())
                  return send(event, context, 'FAILED', None, str(e))

  Net:
    Type: Custom::AnyrayNetwork
    Properties:
      ServiceToken: !GetAtt NetFn.Arn
      VpcId: !Ref VpcId
      SubnetA: !Ref SubnetA
      SubnetB: !Ref SubnetB

  # ---- Secret generation (no setup.sh) --------------------------------------
  SecretFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: anyray-secret-gen
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/anyray/*'
              # The DbUrl composer reads the RDS-managed master secret (named rds!db-…,
              # outside the ${StackName}/anyray/* prefix) to compose the connection URL.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Db.MasterUserSecret.SecretArn

  SecretFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt SecretFnRole.Arn
      Code:
        ZipFile: |
          import json, secrets as rnd, urllib.request, urllib.parse, traceback, boto3
          sm = boto3.client('secretsmanager')

          def send(event, context, status, data=None, pid=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': 'See CloudWatch log stream ' + context.log_stream_name,
                  'PhysicalResourceId': pid or event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {},
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))})
              urllib.request.urlopen(req)

          def ensure(name, gen):
              # create-if-missing; never overwrite (content key / salt must be stable)
              try:
                  return sm.create_secret(Name=name, SecretString=gen())['ARN']
              except sm.exceptions.ResourceExistsException:
                  return sm.describe_secret(SecretId=name)['ARN']

          def put(name, value):
              try:
                  return sm.create_secret(Name=name, SecretString=value)['ARN']
              except sm.exceptions.ResourceExistsException:
                  sm.put_secret_value(SecretId=name, SecretString=value)
                  return sm.describe_secret(SecretId=name)['ARN']

          def handler(event, context):
              try:
                  rt = event['RequestType']; props = event['ResourceProperties']
                  action = props['Action']; prefix = props['Prefix']
                  if rt == 'Delete':
                      for n in props.get('Names', []):
                          try:
                              sm.delete_secret(SecretId=prefix + n, ForceDeleteWithoutRecovery=True)
                          except Exception:
                              pass
                      return send(event, context, 'SUCCESS', {}, prefix + action)
                  if action == 'generate':
                      data = {
                          'ContentKeyArn': ensure(prefix + 'content-key', lambda: rnd.token_hex(32)),
                          'OptimizerTokenArn': ensure(prefix + 'optimizer-token', lambda: rnd.token_hex(32)),
                          'AdminTokenArn': ensure(prefix + 'admin-token', lambda: 'ar-adm-' + rnd.token_hex(16)),
                          'SaltArn': ensure(prefix + 'pseudonym-salt', lambda: rnd.token_hex(32)),
                      }
                      return send(event, context, 'SUCCESS', data, prefix + 'generate')
                  if action == 'composeDbUrl':
                      m = json.loads(sm.get_secret_value(SecretId=props['MasterSecretArn'])['SecretString'])
                      # URL-encode credentials: the RDS-managed master password can
                      # contain URL-reserved chars (?, #, /, @, %, …) that otherwise
                      # corrupt the postgresql:// connection string ("Invalid URL").
                      # sslmode=no-verify: RDS (PG15+) forces SSL via rds.force_ssl, and
                      # the gateway's pg client has no RDS CA bundle — encrypt in transit
                      # without cert verification (the DB is private, in-VPC only).
                      q = lambda s: urllib.parse.quote(s, safe='')
                      url = 'postgresql://%s:%s@%s:5432/%s?sslmode=no-verify' % (
                          q(m['username']), q(m['password']), props['DbHost'], props['DbName'])
                      return send(event, context, 'SUCCESS',
                          {'DbUrlArn': put(prefix + 'db-url', url)}, prefix + 'composeDbUrl')
                  return send(event, context, 'FAILED', {'Error': 'unknown action'}, prefix + action)
              except Exception as e:
                  print('SecretFn FAILED:', traceback.format_exc())
                  return send(event, context, 'FAILED', {'Error': str(e)}, event.get('PhysicalResourceId'))

  AppSecrets:
    Type: Custom::AnyraySecrets
    Properties:
      ServiceToken: !GetAtt SecretFn.Arn
      Action: generate
      Prefix: !Sub '${AWS::StackName}/anyray/'
      Names: [content-key, optimizer-token, admin-token, pseudonym-salt]

  DbUrlSecret:
    Type: Custom::AnyrayDbUrl
    Properties:
      ServiceToken: !GetAtt SecretFn.Arn
      Action: composeDbUrl
      Prefix: !Sub '${AWS::StackName}/anyray/'
      Names: [db-url]
      MasterSecretArn: !GetAtt Db.MasterUserSecret.SecretArn
      DbHost: !GetAtt Db.Endpoint.Address
      DbName: postgres

  # The deployment token arrives as a NoEcho parameter; hold it in Secrets
  # Manager and inject it via the task Secrets list so it is not readable by
  # anyone with ecs:DescribeTaskDefinition (the app secrets already flow this
  # way). No explicit Name: a CFN-generated name avoids the scheduled-deletion
  # collision on stack delete + re-create.
  DeploymentTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Anyray Cloud deployment token (adt_...) for usage metering.
      SecretString: !Ref DeploymentToken
      Tags: [{ Key: Name, Value: anyray-deployment-token }]

  # ---- Networking / security groups -----------------------------------------
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anyray ALB - console (:3000) and gateway (:8787) from a scoped CIDR.
      VpcId: !GetAtt Net.VpcId
      # Ingress is attached below as standalone SecurityGroupIngress resources,
      # fanned out over every value in the AllowedCidr list (Fn::ForEach).
      Tags: [{ Key: Name, Value: anyray-alb }]

  # One ingress rule per (port, CIDR): each loop opens a port to every value in
  # the AllowedCidr list, so a comma-separated AllowedCidr scopes all of them.
  # Fn::ForEach yields resources keyed by the &{Cidr} hash (a valid logical id).
  'Fn::ForEach::AlbGatewayIngress':
    - Cidr
    - !Ref AllowedCidr
    - 'AlbGatewayIngress&{Cidr}':
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          GroupId: !Ref AlbSg
          IpProtocol: tcp
          FromPort: 8787
          ToPort: 8787
          CidrIp: !Ref Cidr
          Description: Gateway API
  'Fn::ForEach::AlbConsoleIngress':
    - Cidr
    - !Ref AllowedCidr
    - 'AlbConsoleIngress&{Cidr}':
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          GroupId: !Ref AlbSg
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref Cidr
          Description: Console
  'Fn::ForEach::AlbHttpsIngress':
    - Cidr
    - !Ref AllowedCidr
    - 'AlbHttpsIngress&{Cidr}':
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          GroupId: !Ref AlbSg
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Cidr
          Description: HTTPS (when CertificateArn set)

  TasksSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anyray Fargate tasks.
      VpcId: !GetAtt Net.VpcId
      Tags: [{ Key: Name, Value: anyray-tasks }]

  TasksFromAlbGateway:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSg
      IpProtocol: tcp
      FromPort: 8787
      ToPort: 8787
      SourceSecurityGroupId: !Ref AlbSg
      Description: Gateway target from ALB

  TasksFromAlbProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSg
      Description: Console proxy target from ALB

  TasksSelfGateway:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSg
      IpProtocol: tcp
      FromPort: 8787
      ToPort: 8787
      SourceSecurityGroupId: !Ref TasksSg
      Description: Cloud Map discovery - proxy/optimizer to gateway

  TasksSelfOptimizer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSg
      IpProtocol: tcp
      FromPort: 8088
      ToPort: 8088
      SourceSecurityGroupId: !Ref TasksSg
      Description: Cloud Map discovery - gateway/proxy to optimizer

  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anyray RDS - Postgres from the Fargate tasks only.
      VpcId: !GetAtt Net.VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TasksSg, Description: Postgres from tasks }
      Tags: [{ Key: Name, Value: anyray-rds }]

  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anyray EFS - NFS from the Fargate tasks only.
      VpcId: !GetAtt Net.VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref TasksSg, Description: NFS from tasks }
      Tags: [{ Key: Name, Value: anyray-efs }]

  # ---- RDS PostgreSQL ---------------------------------------------------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Anyray RDS subnet group.
      SubnetIds: [!GetAtt Net.SubnetA, !GetAtt Net.SubnetB]

  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17.5'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: !Ref DbMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: postgres
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSg]
      PubliclyAccessible: false
      MultiAZ: !If [Ha, true, false]
      BackupRetentionPeriod: 7
      DeletionProtection: !If [RdsDeletionProtection, true, false]
      Tags: [{ Key: Name, Value: anyray }]

  # ---- EFS for gateway + optimizer /data -------------------------------------
  Efs:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags: [{ Key: Name, Value: anyray }]

  EfsMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Efs
      SubnetId: !GetAtt Net.SubnetA
      SecurityGroups: [!Ref EfsSg]

  EfsMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Efs
      SubnetId: !GetAtt Net.SubnetB
      SecurityGroups: [!Ref EfsSg]

  GatewayAp:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Efs
      RootDirectory:
        Path: /gateway
        CreationInfo: { OwnerUid: '0', OwnerGid: '0', Permissions: '0777' }

  OptimizerAp:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Efs
      RootDirectory:
        Path: /optimizer
        CreationInfo: { OwnerUid: '0', OwnerGid: '0', Permissions: '0777' }

  # ---- ECS cluster + IAM ------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-anyray'

  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      # Stack-scoped: one VPC can't hold two hosted zones with the same domain.
      Name: !Sub '${AWS::StackName}.anyray.internal'
      Vpc: !GetAtt Net.VpcId

  # Cloud Map service discovery with REAL Route 53 A records — not ECS Service
  # Connect. The console proxy is nginx resolving its gateway upstream at
  # request time via the `resolver` directive, which queries DNS directly and
  # never reads /etc/hosts; Service Connect publishes its aliases ONLY into
  # /etc/hosts (the Cloud Map namespace is registered API-only, no DNS
  # records), so under Service Connect every console request failed its
  # /__auth subrequest and surfaced as a bare nginx 500. Classic service
  # discovery creates records every consumer resolves — nginx (runtime DNS)
  # and the gateway's Node runtime (getaddrinfo) alike.
  #
  # The `-dns` suffix is load-bearing for UPDATES: stacks deployed before this
  # fix have Service Connect-managed Cloud Map services already named
  # `gateway`/`optimizer` in this namespace, and those are only deleted after
  # the old ECS services wind down — long after CloudFormation creates these
  # resources. Reusing the bare names makes a one-step stack update fail with
  # "Service already exists" and roll back.
  GatewayDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: gateway-dns
      NamespaceId: !GetAtt Namespace.Id
      DnsConfig:
        DnsRecords: [{ Type: A, TTL: 10 }]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  OptimizerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: optimizer-dns
      NamespaceId: !GetAtt Namespace.Id
      DnsConfig:
        DnsRecords: [{ Type: A, TTL: 10 }]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: anyray-read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/anyray/*'
                  - !Ref DeploymentTokenSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: anyray-efs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt Efs.Arn

  # ---- Soft-update applier ----------------------------------------------------
  # The gateway owns the DECISION: it polls the release manifest, evaluates it
  # against this deployment (updatePreflight.classifyUpdate) and only triggers
  # for a `soft` release — image swap only, preflight green, no breaking notes.
  # Schema migrations self-apply on boot, so they never make a release hard.
  # Hard releases are never applied unattended and stay on the notify path.
  #
  # Compose bundles Watchtower to execute that decision. ECS has no equivalent,
  # so this is it: same contract Watchtower speaks (POST + bearer token), and it
  # rolls all three services together so they can never land on different
  # versions. The services already run a deployment circuit breaker with
  # rollback, so a release that fails its health checks reverts itself.
  UpdaterRole:
    Type: AWS::IAM::Role
    Condition: AutoUpdate
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: roll-services
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to this stack's cluster. Deliberately NOT the individual
              # service ARNs: the gateway task definition consumes this
              # function's URL, so depending on the services would make the
              # stack circular.
              - Effect: Allow
                Action: [ecs:ListServices, ecs:DescribeServices, ecs:UpdateService]
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              # Task-definition APIs are not resource-scopable.
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]
              # Verifies the caller's bearer token against the admin token.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt AppSecrets.AdminTokenArn

  UpdaterFn:
    Type: AWS::Lambda::Function
    Condition: AutoUpdate
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt UpdaterRole.Arn
      Environment:
        Variables:
          CLUSTER: !Ref Cluster
          FAMILY_PREFIX: !Sub '${AWS::StackName}-'
          TOKEN_SECRET_ARN: !GetAtt AppSecrets.AdminTokenArn
          INDEX_URL: https://charts.anyray.ai/index.yaml
      Code:
        ZipFile: |
          import hmac, json, os, re, urllib.request, traceback, boto3
          ecs = boto3.client('ecs')
          sm = boto3.client('secretsmanager')
          SEMVER = re.compile(r'^v(\d+)\.(\d+)\.(\d+)$')
          FAMILIES = ('gateway', 'optimizer', 'proxy')

          def reply(code, body):
              return {'statusCode': code,
                      'headers': {'content-type': 'application/json'},
                      'body': json.dumps(body)}

          def authorised(event):
              hdrs = {k.lower(): v for k, v in (event.get('headers') or {}).items()}
              presented = (hdrs.get('authorization') or '')[len('Bearer '):]
              expected = sm.get_secret_value(
                  SecretId=os.environ['TOKEN_SECRET_ARN'])['SecretString']
              return bool(presented) and hmac.compare_digest(presented, expected)

          def latest_release():
              with urllib.request.urlopen(os.environ['INDEX_URL'], timeout=20) as r:
                  body = r.read().decode('utf-8', 'replace')
              tags = set(re.findall(r'appVersion:\s*(v\d+\.\d+\.\d+)\s*$', body, re.M))
              if not tags:
                  raise Exception('no appVersion entries in the release index')
              return max(tags, key=lambda t: tuple(int(x) for x in SEMVER.match(t).groups()))

          def services_for(cluster, prefix):
              """This stack's three services, found by task-definition family."""
              out, token = [], None
              while True:
                  page = ecs.list_services(cluster=cluster, maxResults=100,
                                           **({'nextToken': token} if token else {}))
                  arns = page.get('serviceArns') or []
                  if arns:
                      for svc in ecs.describe_services(
                              cluster=cluster, services=arns)['services']:
                          family = svc['taskDefinition'].split('/')[-1].split(':')[0]
                          if family in [prefix + f for f in FAMILIES]:
                              out.append((svc['serviceName'], family))
                  token = page.get('nextToken')
                  if not token:
                      break
              return out

          def handler(event, context):
              try:
                  if not authorised(event):
                      return reply(403, {'status': 'failure',
                                         'message': 'bad or missing bearer token'})
                  tag = latest_release()
                  cluster = os.environ['CLUSTER']
                  updated, current = [], []
                  for service, family in services_for(cluster, os.environ['FAMILY_PREFIX']):
                      td = ecs.describe_task_definition(taskDefinition=family)['taskDefinition']
                      if all(c['image'].rsplit(':', 1)[-1] == tag
                             for c in td['containerDefinitions']):
                          current.append(service)
                          continue
                      for k in ('taskDefinitionArn', 'revision', 'status',
                                'requiresAttributes', 'compatibilities',
                                'registeredAt', 'registeredBy', 'deregisteredAt'):
                          td.pop(k, None)
                      for c in td['containerDefinitions']:
                          c['image'] = c['image'].rsplit(':', 1)[0] + ':' + tag
                      arn = ecs.register_task_definition(**td)['taskDefinition']['taskDefinitionArn']
                      ecs.update_service(cluster=cluster, service=service, taskDefinition=arn)
                      updated.append(service)
                  result = {'status': 'ok', 'tag': tag,
                            'updated': updated, 'alreadyCurrent': current}
                  print(json.dumps(result))
                  return reply(200, result)
              except Exception as e:
                  print('updater FAILED:', traceback.format_exc())
                  return reply(500, {'status': 'failure', 'message': str(e)})

  # AuthType NONE because the caller is the gateway container, which has no AWS
  # credentials to sign with — the bearer check above is the gate, exactly as
  # Watchtower's HTTP API works on compose.
  UpdaterUrl:
    Type: AWS::Lambda::Url
    Condition: AutoUpdate
    Properties:
      TargetFunctionArn: !GetAtt UpdaterFn.Arn
      AuthType: NONE

  UpdaterUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: AutoUpdate
    Properties:
      FunctionName: !GetAtt UpdaterFn.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # BOTH grants are required. Lambda's URL front door now authorises
  # `lambda:InvokeFunction` as well as `lambda:InvokeFunctionUrl`, so with only
  # the statement above EVERY caller gets a service-layer 403 ("Forbidden",
  # from the front door) before the function's own bearer check ever runs — the
  # gateway's auto-update trigger then fails on every attempt, and logs it
  # misleadingly as a token mismatch. Verified against a live Function URL:
  # InvokeFunctionUrl alone → 403, both → 200.
  #
  # This one carries no FunctionUrlAuthType condition — Lambda rejects the
  # property outright on any action other than InvokeFunctionUrl ("only
  # supported for lambda:InvokeFunctionUrl"), which fails the stack. It widens
  # nothing in practice: the URL above is already AuthType NONE, so the
  # endpoint is public by design and the handler's bearer check against the
  # admin token is the actual gate, on both paths.
  UpdaterInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: AutoUpdate
    Properties:
      FunctionName: !GetAtt UpdaterFn.Arn
      Action: lambda:InvokeFunction
      Principal: '*'

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/anyray/${AWS::StackName}/gateway'
      RetentionInDays: 30
  OptimizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/anyray/${AWS::StackName}/optimizer'
      RetentionInDays: 30
  ProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/anyray/${AWS::StackName}/proxy'
      RetentionInDays: 30

  # ---- Load balancer ----------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      # internet-facing (default) or internal, per LoadBalancerScheme. "internal"
      # gives the load balancer private addresses only, so the whole deployment is
      # reachable only from inside the VPC or a network joined to it. The ECS tasks
      # are unaffected: they run with their own public IP for egress, so the gateway
      # still reaches model providers and Anyray Cloud with no NAT gateway. The
      # subnets are shared by both schemes, which AWS allows.
      Scheme: !Ref LoadBalancerScheme
      Subnets: [!GetAtt Net.SubnetA, !GetAtt Net.SubnetB]
      SecurityGroups: [!Ref AlbSg]

  GatewayTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !GetAtt Net.VpcId
      TargetType: ip
      Port: 8787
      Protocol: HTTP
      HealthCheckPath: /
      Matcher: { HttpCode: 200-399 }
      TargetGroupAttributes:
        # How long the ALB lets in-flight requests finish on a target it is
        # deregistering (every deploy). /v1 streams run for minutes, so the
        # stock-ish 15s used to close them from the LOAD BALANCER side while the
        # task was still draining happily — a bare transport close the gateway
        # never sees and the developer's tool reports as "Connection closed
        # mid-response". Kept at/above the task's StopTimeout so the ALB is never
        # the first to give up.
        - { Key: deregistration_delay.timeout_seconds, Value: '120' }

  ProxyTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !GetAtt Net.VpcId
      TargetType: ip
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /anyray-login
      Matcher: { HttpCode: 200-399 }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '15' }

  GatewayListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 8787
      Protocol: !If [HasCert, HTTPS, HTTP]
      Certificates: !If [HasCert, [{ CertificateArn: !Ref CertificateArn }], !Ref 'AWS::NoValue']
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref GatewayTg }

  ConsoleListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 3000
      Protocol: !If [HasCert, HTTPS, HTTP]
      Certificates: !If [HasCert, [{ CertificateArn: !Ref CertificateArn }], !Ref 'AWS::NoValue']
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref ProxyTg }

  # ---- Task definitions -------------------------------------------------------
  OptimizerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-optimizer'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # 1 vCPU / 2 GB. The optimizer runs onnxruntime (MiniLM re-rank, OCR)
      # synchronously on the Node event loop; at fractional vCPU a single
      # inference pegs CPU to 100%, blocking the loop long enough to miss the
      # health probe and trigger recycle churn (exit 137). A full vCPU shortens
      # each inference block and keeps the gateway's optimize call landing before
      # it times out. Cpu 1024 requires Memory >= 2048 (Fargate valid combos).
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref Efs
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref OptimizerAp, IAM: ENABLED }
      ContainerDefinitions:
        - Name: optimizer
          Image: !Sub 'public.ecr.aws/anyray/optimizer:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: optimizer, ContainerPort: 8088, Protocol: tcp }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data }
          Environment:
            - { Name: PORT, Value: '8088' }
            - { Name: ANYRAY_DATA_DIR, Value: /data }
            - { Name: ANYRAY_CONTENT_MODE, Value: !Ref ContentMode }
            - { Name: ANYRAY_ALLOW_PLAINTEXT, Value: !Ref AllowPlaintext }
            # Same trace-retention sweep as the gateway — must see the same override.
            - { Name: ANYRAY_SPEND_RETENTION_DAYS, Value: !Ref SpendRetentionDays }
          Secrets:
            - { Name: ANYRAY_OPTIMIZER_TOKEN, ValueFrom: !GetAtt AppSecrets.OptimizerTokenArn }
            - { Name: ANYRAY_ADMIN_TOKEN, ValueFrom: !GetAtt AppSecrets.AdminTokenArn }
            # Durable CCR stash tier (same RDS the gateway uses): stashed
            # originals persist as ciphertext, so retrieval handles survive task
            # restarts and resolve from any replica if DesiredCount is raised.
            - { Name: ANYRAY_SPEND_DB_URL, ValueFrom: !GetAtt DbUrlSecret.DbUrlArn }
            - { Name: ANYRAY_CONTENT_KEY, ValueFrom: !GetAtt AppSecrets.ContentKeyArn }
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(''http://localhost:8088/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 10
            Timeout: 5
            Retries: 10
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OptimizerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: optimizer

  GatewayTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-gateway'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref Efs
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref GatewayAp, IAM: ENABLED }
      ContainerDefinitions:
        - Name: gateway
          Image: !Sub 'public.ecr.aws/anyray/gateway:${ImageTag}'
          Essential: true
          # Seconds ECS waits after SIGTERM before SIGKILL. Must exceed the
          # gateway's own drain (ANYRAY_SHUTDOWN_DRAIN_MS, default 90000), or
          # every deploy kills the streaming turns it was in the middle of
          # finishing. ECS's own default is 30s — short enough to cut an ordinary
          # coding request — and 120 is the Fargate maximum. A ceiling, not a
          # delay: a task with nothing in flight still stops at once.
          StopTimeout: 120
          PortMappings:
            - { Name: gateway, ContainerPort: 8787, Protocol: tcp }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data }
          Environment:
            - { Name: ANYRAY_OPTIMIZER_URL, Value: !Sub 'http://optimizer-dns.${AWS::StackName}.anyray.internal:8088' }
            # Gives the gateway's existing soft-update loop an applier on ECS.
            # Unset (EnableAutoUpdate=false) => the loop no-ops and this install
            # stays notify-only, exactly like Kubernetes and Railway.
            - !If
              - AutoUpdate
              - { Name: ANYRAY_UPDATER_URL, Value: !GetAtt UpdaterUrl.FunctionUrl }
              - !Ref 'AWS::NoValue'
            - { Name: ANYRAY_OPTIMIZER_TIMEOUT_MS, Value: !Ref OptimizerTimeoutMs }
            - { Name: ANYRAY_OPTIMIZER_VISION_TIMEOUT_MS, Value: !Ref OptimizerVisionTimeoutMs }
            - { Name: ANYRAY_DEFAULT_MODEL, Value: !Ref DefaultModel }
            - { Name: ANYRAY_ALLOW_PLAINTEXT, Value: !Ref AllowPlaintext }
            - { Name: ANYRAY_DATA_DIR, Value: /data }
            - { Name: ANYRAY_TRUST_PROXY, Value: 'true' }
            - { Name: ANYRAY_HSTS, Value: !Ref Hsts }
            - { Name: ANYRAY_RATE_LIMIT_RPM, Value: !Ref RateLimitRpm }
            - { Name: ANYRAY_RATE_LIMIT_IP_RPM, Value: !Ref RateLimitIpRpm }
            - { Name: ANYRAY_RATE_LIMIT_UNAUTH_RPM, Value: !Ref RateLimitUnauthRpm }
            - { Name: ANYRAY_SPEND_RETENTION_DAYS, Value: !Ref SpendRetentionDays }
            - { Name: ANYRAY_MAX_CONCURRENT_REQUESTS, Value: !Ref MaxConcurrentRequests }
            - { Name: ANYRAY_AUTH_FAIL_LIMIT, Value: !Ref AuthFailLimit }
            - { Name: ANYRAY_MAX_BODY_BYTES, Value: !Ref MaxBodyBytes }
            - { Name: ANYRAY_CUSTOM_HOST_ALLOWLIST, Value: !Ref CustomHostAllowlist }
            - { Name: TRUSTED_CUSTOM_HOSTS, Value: !Ref TrustedCustomHosts }
            - { Name: ANYRAY_UPSTREAM_URL, Value: !Ref UpstreamUrl }
            - { Name: ANYRAY_METERING_ENABLED, Value: 'true' }
            - { Name: ANYRAY_SEAT_EXCLUDE, Value: !Ref SeatExclude }
            - { Name: ANYRAY_METERING_INTERVAL_MS, Value: !Ref MeteringIntervalMs }
            - { Name: ANYRAY_ENTITLEMENT_GRACE_MS, Value: !Ref EntitlementGraceMs }
            - Name: ANYRAY_GATEWAY_PUBLIC_URL
              Value: !If
                - HasGatewayUrl
                - !Ref GatewayPublicUrl
                - !If [HasCert, !Sub 'https://${Alb.DNSName}:8787', !Sub 'http://${Alb.DNSName}:8787']
            - Name: ANYRAY_CONSOLE_PUBLIC_URL
              Value: !If
                - HasConsoleUrl
                - !Ref ConsolePublicUrl
                - !If [HasCert, !Sub 'https://${Alb.DNSName}:3000', !Sub 'http://${Alb.DNSName}:3000']
          Secrets:
            - { Name: ANYRAY_SPEND_DB_URL, ValueFrom: !GetAtt DbUrlSecret.DbUrlArn }
            - { Name: ANYRAY_OBSERVABILITY_DB_URL, ValueFrom: !GetAtt DbUrlSecret.DbUrlArn }
            - { Name: ANYRAY_CONTENT_KEY, ValueFrom: !GetAtt AppSecrets.ContentKeyArn }
            - { Name: ANYRAY_ADMIN_TOKEN, ValueFrom: !GetAtt AppSecrets.AdminTokenArn }
            - { Name: ANYRAY_OPTIMIZER_TOKEN, ValueFrom: !GetAtt AppSecrets.OptimizerTokenArn }
            - { Name: ANYRAY_PSEUDONYM_SALT, ValueFrom: !GetAtt AppSecrets.SaltArn }
            - { Name: ANYRAY_DEPLOYMENT_TOKEN, ValueFrom: !Ref DeploymentTokenSecret }
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(''http://localhost:8787/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 10
            Timeout: 5
            Retries: 10
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GatewayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  ProxyTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-proxy'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: proxy
          Image: !Sub 'public.ecr.aws/anyray/proxy:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: proxy, ContainerPort: 80, Protocol: tcp }
          Environment:
            # nginx resolves this at request time via its `resolver` directive
            # (raw DNS, /etc/hosts is never consulted), so it MUST be a name
            # with a real DNS record — the Cloud Map A record registered by
            # GatewayDiscovery. The image default (`gateway`) only works where
            # the platform DNS resolves bare service names (Docker Compose).
            - { Name: ANYRAY_GATEWAY_HOST, Value: !Sub 'gateway-dns.${AWS::StackName}.anyray.internal' }
            # The baked nginx envsubst template needs updater status/token
            # placeholders set. QuickLaunch does not run the Docker/Watchtower
            # updater, so report it disabled.
            - { Name: ANYRAY_UPDATER_ENABLED, Value: 'false' }
            - { Name: ANYRAY_UPDATER_PERIODIC_POLLS, Value: 'false' }
            - { Name: ANYRAY_UPDATER_POLL_INTERVAL, Value: '0' }
            - { Name: ANYRAY_UPDATER_TOKEN, Value: '' }
          HealthCheck:
            Command: [CMD-SHELL, 'wget -qO- http://localhost:80/anyray-login || exit 1']
            Interval: 10
            Timeout: 5
            Retries: 10
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProxyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: proxy

  # ---- Services (Cloud Map DNS wires *.anyray.internal hostnames) --------------
  # The V2 logical ids are load-bearing for UPDATES: they force CloudFormation
  # to REPLACE the services (create new, delete old) instead of an in-place
  # Service Connect -> ServiceRegistries transition, which trips ECS deployment
  # hooks on stacks deployed before the DNS fix. Replacement is also what lets
  # the old Service Connect-managed Cloud Map services be torn down cleanly
  # (ECS deletes them with the old services).
  OptimizerServiceV2:
    Type: AWS::ECS::Service
    DependsOn: [EfsMountA, EfsMountB]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !If [Ha, 2, 1]
      # Same hardening the production stack runs: a deployment whose tasks keep
      # failing rolls back automatically instead of hanging the service (and the
      # CloudFormation update fails fast instead of waiting out the full timeout).
      # MinimumHealthyPercent/MaximumPercent are stated rather than left to the
      # ECS default so a rolling deploy provably never dips below the current
      # task count: surge to 200%, wait for the new tasks to pass their target
      # group health check, then retire the old ones.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      TaskDefinition: !Ref OptimizerTask
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!GetAtt Net.SubnetA, !GetAtt Net.SubnetB]
          SecurityGroups: [!Ref TasksSg]
      ServiceRegistries:
        - RegistryArn: !GetAtt OptimizerDiscovery.Arn

  GatewayServiceV2:
    Type: AWS::ECS::Service
    DependsOn: [GatewayListener, EfsMountA, EfsMountB]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !If [Ha, 2, 1]
      # Same hardening the production stack runs: a deployment whose tasks keep
      # failing rolls back automatically instead of hanging the service (and the
      # CloudFormation update fails fast instead of waiting out the full timeout).
      # MinimumHealthyPercent/MaximumPercent are stated rather than left to the
      # ECS default so a rolling deploy provably never dips below the current
      # task count: surge to 200%, wait for the new tasks to pass their target
      # group health check, then retire the old ones.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      TaskDefinition: !Ref GatewayTask
      # Must cover a full migration run. The gateway applies the ordered
      # migration ledger at boot and REFUSES TO SERVE on an unmigrated schema, so
      # a task can sit RUNNING and not yet answering for as long as the
      # migrations take; the ledger allows a single statement 30 minutes, and
      # eight of its migrations are CREATE INDEX CONCURRENTLY over tables holding
      # real rows. At 300s ECS killed and replaced the task mid-migration, the
      # replacement restarted the same migration, and it never converged — the
      # failure lands on the installs least able to absorb it (months of spend
      # data, or a jump across several releases). Costs nothing in detection: the
      # grace only suppresses health-check-driven REPLACEMENT, the ALB still
      # refuses to route to a target that is not passing, and a genuinely broken
      # gateway exits fatally, and a stopped container is replaced regardless.
      HealthCheckGracePeriodSeconds: 1800
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!GetAtt Net.SubnetA, !GetAtt Net.SubnetB]
          SecurityGroups: [!Ref TasksSg]
      LoadBalancers:
        - { TargetGroupArn: !Ref GatewayTg, ContainerName: gateway, ContainerPort: 8787 }
      ServiceRegistries:
        - RegistryArn: !GetAtt GatewayDiscovery.Arn

  ProxyServiceV2:
    Type: AWS::ECS::Service
    DependsOn: [ConsoleListener]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !If [Ha, 2, 1]
      # Same hardening the production stack runs: a deployment whose tasks keep
      # failing rolls back automatically instead of hanging the service (and the
      # CloudFormation update fails fast instead of waiting out the full timeout).
      # MinimumHealthyPercent/MaximumPercent are stated rather than left to the
      # ECS default so a rolling deploy provably never dips below the current
      # task count: surge to 200%, wait for the new tasks to pass their target
      # group health check, then retire the old ones.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      TaskDefinition: !Ref ProxyTask
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!GetAtt Net.SubnetA, !GetAtt Net.SubnetB]
          SecurityGroups: [!Ref TasksSg]
      LoadBalancers:
        - { TargetGroupArn: !Ref ProxyTg, ContainerName: proxy, ContainerPort: 80 }

Outputs:
  ConsoleURL:
    Description: Open this and sign in with the admin token (see AdminTokenCmd below).
    Value: !If
      - HasConsoleUrl
      - !Ref ConsolePublicUrl
      - !If [HasCert, !Sub 'https://${Alb.DNSName}:3000', !Sub 'http://${Alb.DNSName}:3000']
  GatewayURL:
    Description: Gateway API base URL - point local tools at it with `anyray-connect --gateway <url>`.
    Value: !If
      - HasGatewayUrl
      - !Ref GatewayPublicUrl
      - !If [HasCert, !Sub 'https://${Alb.DNSName}:8787', !Sub 'http://${Alb.DNSName}:8787']
  AdminTokenCmd:
    Description: Fetch the generated admin key from Secrets Manager (it is NOT printed in stack outputs).
    Value: !Sub 'aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${AppSecrets.AdminTokenArn} --query SecretString --output text'
  Reachability:
    Description: Where the two URLs above can be opened from.
    Value: !If
      - InternalLb
      - 'PRIVATE: the load balancer is internal, so its DNS name resolves only inside the VPC. Reach it over VPN, Direct Connect, or a peered/attached network - there is no public entry point. Developer machines running anyray-connect need that same access.'
      - 'PUBLIC: the load balancer has public IPs, restricted to AllowedCidr. Set LoadBalancerScheme=internal to keep it entirely inside your VPC.'
  FirstBootNote:
    Description: First boot pulls images, provisions RDS, and seeds prices; allow ~5-10 min. The gateway restarts until RDS is reachable.
    Value: 'Watch the ECS services in the console; the gateway + console go healthy once RDS is up.'
