name: anyray

# Anyray from published images. Generate secrets first:
# ./setup.sh --connect <adt_token>
# Console → http://<host>:3000   |   Gateway API → http://<host>:8787
# Docs → https://docs.anyray.ai
#
# Only ports 3000 and 8787 are exposed. Open them to your org network only.

# Bound every container's JSON log so a chatty service can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  gateway:
    logging: *default-logging
    image: "${ANYRAY_GATEWAY_IMAGE:-public.ecr.aws/anyray/gateway:${ANYRAY_IMAGE_TAG:-policy-stable}}"
    # Re-pull the pinned release tag on every `up`; never run a cached older image.
    pull_policy: always
    restart: always
    # Must exceed the gateway's own drain (ANYRAY_SHUTDOWN_DRAIN_MS, default
    # 90000): on SIGTERM it stops accepting connections and lets in-flight
    # requests — long streaming completions above all — finish. Docker's default
    # grace is only 10s, so every restart used to SIGKILL the process halfway
    # through that drain and reset each open stream, which clients report as
    # "socket connection was closed unexpectedly" / "Connection closed
    # mid-response". A ceiling, not a delay: a gateway with nothing in flight
    # still stops immediately. Raise this together with any
    # ANYRAY_SHUTDOWN_DRAIN_MS increase (and its Helm counterpart,
    # terminationGracePeriodSeconds in helm/values.yaml).
    stop_grace_period: 120s
    # Watched by the opt-in updater (the `updater` service below, --profile
    # updater) — never the datastores or anything else on the host. No-op unless
    # the updater profile is started.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # A full template reconcile must stage the compatible optimizer before the
    # gateway activates the cache-affecting transcript policy below.
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    ports:
      - "${ANYRAY_GATEWAY_BIND:-0.0.0.0}:8787:8787"
    environment:
      # Trace store: the gateway persists content-free traces + observations to
      # Postgres (anyray_traces / anyray_observations, auto-created; content
      # AES-256-GCM encrypted at rest). Falls back to ANYRAY_SPEND_DB_URL if unset.
      ANYRAY_OBSERVABILITY_DB_URL: ${ANYRAY_OBSERVABILITY_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/postgres}
      # Durable spend store — Postgres (required; the gateway no longer writes a
      # JSONL file and refuses to start without this). Defaults to the bundled
      # Postgres (same DB as the trace store above); the anyray_spend table is
      # auto-created. Override to point at an external Postgres.
      ANYRAY_SPEND_DB_URL: ${ANYRAY_SPEND_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/postgres}
      # One-time migration off the old file store: set true for one boot to import
      # a legacy spend.jsonl (under ANYRAY_DATA_DIR) into Postgres; no-ops once the
      # table has rows.
      ANYRAY_SPEND_IMPORT_JSONL: ${ANYRAY_SPEND_IMPORT_JSONL:-}
      ANYRAY_OPTIMIZER_URL: http://optimizer:8088
      ANYRAY_OPTIMIZER_TOKEN: ${ANYRAY_OPTIMIZER_TOKEN:?run ./setup.sh first}
      ANYRAY_OPTIMIZER_TIMEOUT_MS: ${ANYRAY_OPTIMIZER_TIMEOUT_MS:-800}
      ANYRAY_OPTIMIZER_VISION_TIMEOUT_MS: ${ANYRAY_OPTIMIZER_VISION_TIMEOUT_MS:-10000}
      # Model the `anyray-default` routing sentinel resolves to. Set it to a model
      # your configured provider serves (a bare model is read under `anthropic`).
      ANYRAY_DEFAULT_MODEL: ${ANYRAY_DEFAULT_MODEL:-anthropic/claude-sonnet-4-5}
      ANYRAY_CONTENT_KEY: ${ANYRAY_CONTENT_KEY:?run ./setup.sh first}
      ANYRAY_ALLOW_PLAINTEXT: ${ANYRAY_ALLOW_PLAINTEXT:-false}
      ANYRAY_ADMIN_TOKEN: ${ANYRAY_ADMIN_TOKEN:?run ./setup.sh first}
      ANYRAY_PROVIDER_KEY_OPENAI: ${ANYRAY_PROVIDER_KEY_OPENAI:-}
      ANYRAY_PROVIDER_KEY_ANTHROPIC: ${ANYRAY_PROVIDER_KEY_ANTHROPIC:-}
      ANYRAY_PROVIDER_KEY_AZURE_OPENAI: ${ANYRAY_PROVIDER_KEY_AZURE_OPENAI:-}
      # All runtime-state files (settings, spend, provider/client keys, routing,
      # user caps, audit logs, GDPR log, entitlement lease) live under one
      # directory on the volume. Set ANYRAY_DATA_DIR and the gateway derives
      # every path from it; override an individual file with its ANYRAY_*_FILE
      # var only if you need to (the per-file var wins).
      ANYRAY_DATA_DIR: /data
      # /v1/* is always restricted to verified developers (a minted client key),
      # with the bound identity authoritative — secure-by-default, no toggle.
      # Optional hardening / features — set in .env to enable.
      ANYRAY_HSTS: ${ANYRAY_HSTS:-}
      # Prunes spend rows older than N days (unset = keep forever); also the trace window (default 90d).
      ANYRAY_SPEND_RETENTION_DAYS: ${ANYRAY_SPEND_RETENTION_DAYS:-}
      ANYRAY_RATE_LIMIT_RPM: ${ANYRAY_RATE_LIMIT_RPM:-}
      ANYRAY_RATE_LIMIT_IP_RPM: ${ANYRAY_RATE_LIMIT_IP_RPM:-}
      ANYRAY_RATE_LIMIT_UNAUTH_RPM: ${ANYRAY_RATE_LIMIT_UNAUTH_RPM:-}
      ANYRAY_MAX_CONCURRENT_REQUESTS: ${ANYRAY_MAX_CONCURRENT_REQUESTS:-}
      ANYRAY_AUTH_FAIL_LIMIT: ${ANYRAY_AUTH_FAIL_LIMIT:-}
      ANYRAY_MAX_BODY_BYTES: ${ANYRAY_MAX_BODY_BYTES:-}
      ANYRAY_TRUST_PROXY: ${ANYRAY_TRUST_PROXY:-}
      ANYRAY_CUSTOM_HOST_ALLOWLIST: ${ANYRAY_CUSTOM_HOST_ALLOWLIST:-}
      TRUSTED_CUSTOM_HOSTS: ${TRUSTED_CUSTOM_HOSTS:-}
      # On-top mode: seed the default routing config from an existing upstream
      # gateway so clients send no x-anyray-config header (./setup.sh --upstream).
      ANYRAY_UPSTREAM_URL: ${ANYRAY_UPSTREAM_URL:-}
      # Billing is required. setup.sh writes the token and local salt; the image
      # pins the Billing URL and verification key. Keep this literal so .env
      # cannot disable usage reporting or entitlement checks.
      ANYRAY_METERING_ENABLED: "true"
      ANYRAY_CONTROL_PLANE_URL: ${ANYRAY_CONTROL_PLANE_URL:-}
      ANYRAY_DEPLOYMENT_TOKEN: ${ANYRAY_DEPLOYMENT_TOKEN:?run ./setup.sh --connect <adt_token> first}
      ANYRAY_PSEUDONYM_SALT: ${ANYRAY_PSEUDONYM_SALT:?run ./setup.sh --connect <adt_token> first}
      ANYRAY_GATEWAY_PUBLIC_URL: ${ANYRAY_GATEWAY_PUBLIC_URL:-}
      ANYRAY_CONSOLE_PUBLIC_URL: ${ANYRAY_CONSOLE_PUBLIC_URL:-}
      ANYRAY_METERING_INTERVAL_MS: ${ANYRAY_METERING_INTERVAL_MS:-}
      ANYRAY_ENTITLEMENT_GRACE_MS: ${ANYRAY_ENTITLEMENT_GRACE_MS:-}
      # Globs of x-anyray-metadata user ids to exclude from the billed seat
      # count (CI bots, service accounts) — e.g. "bot-*,ci-*". Empty = bill all.
      ANYRAY_SEAT_EXCLUDE: ${ANYRAY_SEAT_EXCLUDE:-}
      # Dev/staging ONLY — override the pinned key + host for an internal build.
      ANYRAY_DEV_UNSAFE_CONTROL_PLANE: ${ANYRAY_DEV_UNSAFE_CONTROL_PLANE:-}
      ANYRAY_LICENSE_PUBLIC_KEY: ${ANYRAY_LICENSE_PUBLIC_KEY:-}
      # In-stack address of the endpoint-control service (RFC 0014). Optional on
      # the gateway: images that predate the end-point lane ignore it, and the
      # whole plane stays dormant until a gateway that reads it ships — so this
      # line is safe ahead of that gateway. A literal, like ANYRAY_OPTIMIZER_URL.
      ANYRAY_ENDPOINT_CONTROL_URL: http://endpoint-control:8090
    volumes:
      - anyray_gateway_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  optimizer:
    logging: *default-logging
    image: "${ANYRAY_OPTIMIZER_IMAGE:-public.ecr.aws/anyray/optimizer:${ANYRAY_IMAGE_TAG:-policy-stable}}"
    pull_policy: always
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # The optimizer's durable stash + /v1/record ride the same bundled Postgres
    # as the gateway; without this gate it races Postgres on a cold `up` and
    # boots with its observability self-check failed until the next restart.
    # (docker-compose.attach.yml already carries the same gate.)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      ANYRAY_OPTIMIZER_TOKEN: ${ANYRAY_OPTIMIZER_TOKEN:?run ./setup.sh first}
      ANYRAY_ADMIN_TOKEN: ${ANYRAY_ADMIN_TOKEN:?run ./setup.sh first}
      # Runtime-mutable strategy config + audit log under ANYRAY_DATA_DIR; the
      # runtime config starts empty and is seeded from the image-baked
      # optimizer.config.json until the first admin edit writes here.
      ANYRAY_DATA_DIR: /data
      # Durable CCR stash tier (same bundled Postgres as the gateway): stashed
      # originals are persisted as AES-256-GCM ciphertext, so retrieval handles
      # survive optimizer restarts/updates and semantic recall works. Degrades
      # to in-memory-only when the key is absent or the content mode is off.
      ANYRAY_SPEND_DB_URL: ${ANYRAY_SPEND_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/postgres}
      ANYRAY_CONTENT_KEY: ${ANYRAY_CONTENT_KEY:-}
      # Governs ONLY the paths that run without a gateway — BYO /v1/record writes
      # and attach mode, both of which execute in the optimizer process. The
      # gateway's own content mode is set in the console and stored in the shared
      # database, and it pushes that mode here on every optimize call.
      ANYRAY_CONTENT_MODE: ${ANYRAY_CONTENT_MODE:-encrypted}
      ANYRAY_ALLOW_PLAINTEXT: ${ANYRAY_ALLOW_PLAINTEXT:-false}
      # Must match the gateway's value or the optimizer's trace sweep reverts to the 90-day default.
      ANYRAY_SPEND_RETENTION_DAYS: ${ANYRAY_SPEND_RETENTION_DAYS:-}
    volumes:
      - anyray_optimizer_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # End-point control (RFC 0014) — the client-operated device-evidence service.
  # Employee laptops run the signed fleetd agent against this deployment's own
  # public origin (see the Caddyfile's agent-plane routes); enrollment, policy
  # evidence, and remediation authority stay inside the deployment. The gateway
  # talks to it in-stack over ANYRAY_ENDPOINT_CONTROL_URL; nothing here exposes
  # a host port.
  endpoint-control:
    logging: *default-logging
    # Same tag as the rest of the stack, like every other service here — but
    # this image only exists from v1.10.246 (RFC 0014 flipped it to the customer
    # set then). A deployment pinning ANYRAY_IMAGE_TAG BELOW that gets a
    # manifest-not-found on `docker compose up` the first time it refreshes this
    # file. That is the honest signal — the pinned release predates the service —
    # and the two ways out are to move the pin forward, or to keep the pin and
    # point this one service elsewhere with ANYRAY_ENDPOINT_CONTROL_IMAGE.
    image: "${ANYRAY_ENDPOINT_CONTROL_IMAGE:-public.ecr.aws/anyray/endpoint-control:${ANYRAY_IMAGE_TAG:-policy-stable}}"
    pull_policy: always
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # Its endpoint_* tables ride the same bundled Postgres as the gateway's
    # spend store (boot-applied idempotent schema); without this gate it boots
    # before Postgres on a cold `up` and falls back to the loud in-memory store.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same database the gateway's ANYRAY_SPEND_DB_URL points at — the
      # endpoint_* tables coexist there. It has to FOLLOW that override, not
      # just share its default: a deployment on a managed Postgres sets
      # ANYRAY_SPEND_DB_URL and leaves the bundled one running, so defaulting
      # straight to `postgres:5432` would quietly put enrollment state in a
      # second database nobody backs up. Helm (anyray.cpDatabaseUrlEnv) and the
      # quicklaunch template (the gateway's own DbUrlSecret) already resolve it
      # this way; this is the same chain, in compose's syntax.
      ANYRAY_CP_DATABASE_URL: ${ANYRAY_CP_DATABASE_URL:-${ANYRAY_SPEND_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/postgres}}
      # Paired key: the SAME value as ANYRAY_ADMIN_TOKEN, derived here exactly
      # like ANYRAY_UPDATER_TOKEN — the gateway authenticates to this service by
      # falling back to its own admin token, so the two must never drift. The
      # override exists for operators who deliberately split the credentials.
      ANYRAY_ENDPOINT_CONTROL_ADMIN_TOKEN: ${ANYRAY_ENDPOINT_CONTROL_ADMIN_TOKEN:-${ANYRAY_ADMIN_TOKEN}}
      # Public origin employee laptops reach (fleetd calls fixed /api/* paths on
      # it). With `--profile public` this derives from ANYRAY_PUBLIC_DOMAIN —
      # Caddy routes the agent-plane paths here on that same origin, so no
      # second hostname or certificate is needed. Empty (no public profile) the
      # plane simply cannot mint installers until an operator sets it.
      ANYRAY_ENDPOINT_CONTROL_PUBLIC_URL: ${ANYRAY_ENDPOINT_CONTROL_PUBLIC_URL:-${ANYRAY_PUBLIC_DOMAIN:+https://${ANYRAY_PUBLIC_DOMAIN:-}}}
    healthcheck:
      # /livez is process-only liveness; /readyz (Postgres + drain) stays for
      # edge health checks, mirroring the service's documented probe split.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/livez').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  proxy:
    logging: *default-logging
    image: "${ANYRAY_PROXY_IMAGE:-public.ecr.aws/anyray/proxy:${ANYRAY_IMAGE_TAG:-policy-stable}}"
    pull_policy: always
    restart: always
    # nginx proxies the streaming response bodies, so it needs a grace period on
    # the same order as the gateway behind it. The image re-declares STOPSIGNAL
    # SIGQUIT, which is what makes the stop signal a graceful worker drain instead
    # of nginx's default fast shutdown; Docker's 10s default would cut that drain
    # short on any request still streaming.
    stop_grace_period: 120s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # The proxy image bakes nginx.conf, which carries the gated updater trigger
    # route (/admin/update/run) and read-only updater status
    # (/admin/update/config). These values are substituted into it at start
    # (envsubst). One-click is on for a normal `docker compose up -d`; the token
    # defaults to the admin key, so the trigger the proxy injects matches
    # Watchtower's expected token with no extra setup.
    environment:
      ANYRAY_UPDATER_ENABLED: ${ANYRAY_UPDATER_ENABLED:-true}
      ANYRAY_UPDATER_PERIODIC_POLLS: ${ANYRAY_UPDATER_PERIODIC_POLLS:-false}
      ANYRAY_UPDATER_POLL_INTERVAL: ${ANYRAY_UPDATER_POLL_INTERVAL:-0}
      ANYRAY_UPDATER_TOKEN: ${ANYRAY_UPDATER_TOKEN:-${ANYRAY_ADMIN_TOKEN}}
    # gateway healthy first: nginx auth_request hits gateway:8787 on every
    # console load — starting earlier just serves 502s.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${ANYRAY_CONSOLE_BIND:-0.0.0.0}:3000:80"
    # Without this the proxy has no health signal at all: `restart: always` only
    # reacts to the PROCESS exiting, and nginx does not exit when its config is
    # broken or its workers are wedged — it sits there serving 502s with the
    # container reported "Up". Caddy also gates its own start on this, so an
    # unhealthy proxy must be visible for that to mean anything. /anyray-login is
    # served by nginx itself (no gateway round-trip), so it reports the proxy's
    # own health rather than the gateway's.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/anyray-login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # TLS edge for public exposure — only started with `--profile public`.
  # Set ANYRAY_PUBLIC_DOMAIN in .env and ANYRAY_GATEWAY_BIND=127.0.0.1 so the
  # only public entry is Caddy on 443; the Caddyfile 403s the admin surface.
  caddy:
    logging: *default-logging
    # Pinned to the multi-arch index digest of caddy 2.11.4 (the `2-alpine` tag
    # floats, and a tag can be re-pushed). Bump the tag and the digest TOGETHER —
    # a stale digest silently keeps serving the old build. Refresh with:
    #   docker buildx imagetools inspect caddy:2-alpine
    image: "${ANYRAY_CADDY_IMAGE:-caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}"
    profiles: ["public"]
    restart: always
    # Caddy is the ONLY public entry in this profile, so it starting before the
    # gateway can answer is a public-facing 502 plus a wasted ACME attempt. The
    # bare list form waits only for the container to be created, not for it to be
    # usable — the same gate the proxy already uses.
    #
    # endpoint-control gets `service_started` — what the bare list form means —
    # on purpose, never `service_healthy`. It is the one dependency here that
    # Caddy does not need in order to serve
    # the money path, so gating on its health would let a device-evidence
    # service that cannot start — an image tag the stack pin predates, an
    # unreachable database — hold the public inference edge down with it. A
    # fleetd check-in that lands early retries; an LLM request that finds no
    # edge does not.
    depends_on:
      gateway:
        condition: service_healthy
      endpoint-control:
        condition: service_started
    # The admin API on 2019 is Caddy's own liveness surface and is bound to
    # localhost inside the container, so probing it exposes nothing. Checking
    # :80/:443 instead would report the gateway's health, not Caddy's.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${ANYRAY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${ANYRAY_HTTPS_BIND:-0.0.0.0}:443:443"
    environment:
      ANYRAY_PUBLIC_DOMAIN: ${ANYRAY_PUBLIC_DOMAIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - anyray_caddy_data:/data
      - anyray_caddy_config:/config

  # Postgres — the Anyray spend + trace store (both content-free; any stored
  # content is AES-256-GCM encrypted at rest). The anyray_traces /
  # anyray_observations tables are auto-created on first use.
  postgres:
    logging: *default-logging
    # Pinned to the multi-arch index digest of postgres 17.10 (`17` is a floating
    # minor tag, and a tag can be re-pushed). Bump the tag and the digest
    # TOGETHER — a stale digest silently keeps serving the old minor. Refresh with:
    #   docker buildx imagetools inspect docker.io/postgres:17
    image: "${ANYRAY_POSTGRES_IMAGE:-docker.io/postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - anyray_postgres_data:/var/lib/postgresql/data

  # ── Updater: one-click update for the Anyray images ─────────────────────────
  # Always on — the console's "Update now" button works with no setup, and there
  # is no toggle to disable it. The token the trigger needs derives from
  # ANYRAY_ADMIN_TOKEN (override with ANYRAY_UPDATER_TOKEN).
  # Bundles Watchtower to pull newer images and recreate the Anyray app
  # containers (gateway/optimizer/endpoint-control/proxy) when the operator clicks the console's
  # "Update now" button (Watchtower HTTP API). Updates apply only on that click —
  # there is no unattended polling.
  #
  # Capability-aware templates follow policy-stable after the coordinated
  # cutover, so Watchtower can pull only compatible releases. The first staged
  # migration revision may temporarily pin one immutable vX.Y.Z. Override
  # ANYRAY_IMAGE_TAG=vX.Y.Z when you want pinned/manual updates. Watchtower only
  # touches containers labelled
  # com.centurylinklabs.watchtower.enable=true (the four app services above),
  # never the datastores or anything else on the host.
  #
  # SECURITY: Watchtower never gets the raw Docker socket — it talks to the
  # docker-socket-proxy below, which exposes only the minimal Docker API needed
  # to pull + recreate containers. The HTTP API is in-network only (no published
  # port) and the trigger is gated by the console admin key (the proxy injects
  # the updater token server-side). The socket is root-equivalent on the host, so
  # the proxy stays least-privilege — see docs.anyray.ai → Security → Updates and
  # the Docker socket.
  docker-socket-proxy:
    logging: *default-logging
    # Digest-pinned: this container is the one thing here that mounts the real
    # Docker socket, so a re-pushed tag would be root on the host. The digest is
    # the multi-arch index for v0.4.2. Bump the tag and the digest TOGETHER.
    # Refresh with:
    #   docker buildx imagetools inspect tecnativa/docker-socket-proxy:v0.4.2
    image: "${ANYRAY_DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476}"
    restart: always
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  updater:
    logging: *default-logging
    # Digest-pinned, and the most important pin in this file: Watchtower reaches
    # the Docker API (through the proxy above) and is what pulls + recreates the
    # Anyray containers, so whoever controls this image controls every update
    # that lands on the host. It ships from a single-maintainer GHCR namespace,
    # where a re-pushed tag is the whole attack. The digest is the multi-arch
    # index for 1.18.1. Bump the tag and the digest TOGETHER. Refresh with:
    #   docker buildx imagetools inspect ghcr.io/nicholas-fedor/watchtower:1.18.1
    image: "${ANYRAY_UPDATER_IMAGE:-ghcr.io/nicholas-fedor/watchtower:1.18.1@sha256:5a6262b7a66a353bd2cdb1e0cace6c5b7cb4d475d1080d6a57fe4ec82fe455b6}"
    restart: always
    depends_on:
      - docker-socket-proxy
    command: --label-enable --cleanup
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${ANYRAY_UPDATER_TOKEN:-${ANYRAY_ADMIN_TOKEN}}
      WATCHTOWER_INCLUDE_RESTARTING: "true"

volumes:
  anyray_gateway_data:
  anyray_optimizer_data:
  anyray_postgres_data:
  anyray_caddy_data:
  anyray_caddy_config:
