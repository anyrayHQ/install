apiVersion: v2
name: anyray
description: Self-hosted AI-spend optimizer - gateway, optimizer, console, and Postgres trace/spend store.
type: application
version: 0.8.173
# The Anyray image tag this chart version ships. Images default to this pinned
# tag (see values.yaml image.tag), so a given chart version always deploys the
# same, auditable build. Bumped in lockstep with each release by the monorepo
# prod promotion; override image.tag to test a different/moving tag.
appVersion: "v1.10.645"
keywords:
  - anyray
  - ai-gateway
  - llm
home: https://docs.anyray.ai
sources:
  - https://github.com/anyrayHQ/install
maintainers:
  - name: Anyray
    url: https://docs.anyray.ai
annotations:
  # Artifact Hub listing metadata (https://artifacthub.io). The repo is registered
  # once on artifacthub.io against https://charts.anyray.ai; these enrich the card.
  # artifacthub.io/images is generated by scripts/stamp-artifacthub-images.sh
  # (the prod promotion runs it): Artifact Hub cannot render this chart with
  # default values, so without the list it shows no images and scans none.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.anyray.ai
  artifacthub.io/images: |
    - name: postgres
      image: docker.io/postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    - name: gateway
      image: public.ecr.aws/anyray/gateway:v1.10.645
    - name: optimizer
      image: public.ecr.aws/anyray/optimizer:v1.10.645
    - name: proxy
      image: public.ecr.aws/anyray/proxy:v1.10.645
