{{- range .Values.gateway.extraEnv }}
{{- if or (eq .name "ANYRAY_METERING_ENABLED") (eq .name "ANYRAY_DEPLOYMENT_TOKEN") (eq .name "ANYRAY_PSEUDONYM_SALT") }}
{{- fail (printf "gateway.extraEnv must not override %s: Billing metering is mandatory" .name) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anyray.fullname" . }}-gateway
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if .Values.gateway.autoscaling.enabled }}
  {{- if .Values.gateway.persistence.enabled }}
  {{- fail "gateway.autoscaling.enabled needs gateway.persistence.enabled=false: the data PVC is ReadWriteOnce" }}
  {{- end }}
  {{- else }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  {{- if .Values.gateway.persistence.enabled }}
  {{- if and (not .Values.gateway.autoscaling.enabled) (gt (int .Values.gateway.replicas) 1) }}
  {{- fail "gateway.replicas > 1 needs gateway.persistence.enabled=false: the data PVC is ReadWriteOnce" }}
  {{- end }}
  # Recreate: the RWO volume must detach before the replacement pod can mount it.
  # This makes every upgrade a downtime window BY CONSTRUCTION — Recreate stops
  # all old pods and only then starts new ones, so callers get connection
  # failures through the proxy for as long as the replacement takes to boot and
  # pass its readinessProbe. It is not a rolling update and cannot be made one
  # while a single ReadWriteOnce volume is in play. For a seamless roll, set
  # gateway.persistence.enabled=false to take the RollingUpdate branch below.
  strategy:
    type: Recreate
  {{- else }}
  # No RWO volume to detach, so a replacement can run alongside the outgoing pod:
  # surge one new pod, wait for it to pass the readinessProbe, then retire an old
  # one. Holding maxUnavailable at zero is the part that matters — it keeps the
  # Service endpoint list non-empty for the whole rollout, even at one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  {{- include "anyray.minReadySeconds" (dict "component" "gateway" "context" .) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" "gateway" "context" .) | nindent 6 }}
  template:
    metadata:
      {{- include "anyray.podMetadata" (dict "component" "gateway" "context" .) | nindent 6 }}
    spec:
      {{- include "anyray.podSpecCommon" (dict "component" "gateway" "context" .) | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "anyray.image" (dict "component" "gateway" "context" .) }}
          imagePullPolicy: {{ include "anyray.imagePullPolicy" (dict "component" "gateway" "context" .) }}
          {{- include "anyray.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "anyray.observabilityDbEnv" . | nindent 12 }}
            - name: ANYRAY_OPTIMIZER_URL
              value: "http://optimizer:8088"
            - name: ANYRAY_OPTIMIZER_TOKEN
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_OPTIMIZER_TOKEN" "context" .) | nindent 16 }}
            - name: ANYRAY_OPTIMIZER_TIMEOUT_MS
              value: {{ .Values.gateway.optimizerTimeoutMs | quote }}
            - name: ANYRAY_OPTIMIZER_VISION_TIMEOUT_MS
              value: {{ .Values.gateway.optimizerVisionTimeoutMs | quote }}
            {{- with .Values.gateway.defaultModel }}
            # What `anyray-default` routes to when a request names no model;
            # without it the gateway falls back to a stale alias and 404s.
            - name: ANYRAY_DEFAULT_MODEL
              value: {{ . | quote }}
            {{- end }}
            - name: ANYRAY_CONTENT_KEY
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_CONTENT_KEY" "context" .) | nindent 16 }}
            - name: ANYRAY_ALLOW_PLAINTEXT
              value: {{ .Values.gateway.allowPlaintext | quote }}
            - name: ANYRAY_ADMIN_TOKEN
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_ADMIN_TOKEN" "context" .) | nindent 16 }}
            # All runtime-state files (settings, spend, provider/client keys,
            # routing, user caps, audit logs, GDPR log, entitlement lease) live
            # under one directory on the volume; the gateway derives every path
            # from ANYRAY_DATA_DIR. Override an individual file with its
            # ANYRAY_*_FILE var only if you need to (the per-file var wins).
            - name: ANYRAY_DATA_DIR
              value: /data
            # Billing is required. setup.sh writes the token and local salt to
            # the Secret; the image pins the Billing URL and verification key.
            # Kubernetes requires both Secret keys before starting this pod.
            - name: ANYRAY_METERING_ENABLED
              value: "true"
            - name: ANYRAY_DEPLOYMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ANYRAY_DEPLOYMENT_TOKEN
            - name: ANYRAY_PSEUDONYM_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ANYRAY_PSEUDONYM_SALT
            - name: ANYRAY_METERING_INTERVAL_MS
              value: {{ .Values.gateway.metering.intervalMs | quote }}
            - name: ANYRAY_ENTITLEMENT_GRACE_MS
              value: {{ .Values.gateway.metering.graceMs | quote }}
            {{- with .Values.gateway.metering.seatExclude }}
            - name: ANYRAY_SEAT_EXCLUDE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.upstreamUrl }}
            - name: ANYRAY_UPSTREAM_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.customHostAllowlist }}
            - name: ANYRAY_CUSTOM_HOST_ALLOWLIST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.trustedCustomHosts }}
            - name: TRUSTED_CUSTOM_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- /* The gateway self-reports this URL to Anyray Cloud on each metering
                   beat; it's what enrollment links hand a developer's tools. Default it
                   to https://<host> (the Ingress endpoint) when publicUrl isn't set, so a
                   plain `--host` install doesn't leave enrollment links with no gateway.
                   NodePort / non-TLS installs override via gateway.publicUrl. */}}
            {{- $gatewayPublicUrl := .Values.gateway.publicUrl }}
            {{- if and (not $gatewayPublicUrl) .Values.host }}
            {{- $gatewayPublicUrl = printf "https://%s" .Values.host }}
            {{- end }}
            {{- with $gatewayPublicUrl }}
            - name: ANYRAY_GATEWAY_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.consolePublicUrl }}
            - name: ANYRAY_CONSOLE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.hsts }}
            - name: ANYRAY_HSTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.trustProxy }}
            - name: ANYRAY_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.rateLimitRpm }}
            - name: ANYRAY_RATE_LIMIT_RPM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.rateLimitIpRpm }}
            - name: ANYRAY_RATE_LIMIT_IP_RPM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.rateLimitUnauthRpm }}
            - name: ANYRAY_RATE_LIMIT_UNAUTH_RPM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.spendRetentionDays }}
            - name: ANYRAY_SPEND_RETENTION_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.maxConcurrentRequests }}
            - name: ANYRAY_MAX_CONCURRENT_REQUESTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.authFailLimit }}
            - name: ANYRAY_AUTH_FAIL_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.maxBodyBytes }}
            - name: ANYRAY_MAX_BODY_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8787
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          # Runs BEFORE SIGTERM, so the pod is still serving while its removal
          # from the Service endpoints propagates. Once SIGTERM lands the gateway
          # marks itself down on `/` (503) and drains in-flight requests for
          # ANYRAY_SHUTDOWN_DRAIN_MS; terminationGracePeriodSeconds has to cover
          # this pause plus that drain, or the kubelet kills it mid-stream.
          {{- include "anyray.preStopDrain" (dict "component" "gateway" "context" .) | nindent 10 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.gateway.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anyray.fullname" . }}-gateway-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.gateway.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anyray.fullname" . }}-gateway-data
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    # survive helm uninstall — this volume holds provider keys and spend history
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.gateway.persistence.storageClass }}
  storageClassName: {{ .Values.gateway.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Bare name: nginx in the proxy image hardcodes the upstream `gateway:8787`.
  name: gateway
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  {{- with .Values.gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "anyray.selectorLabels" (dict "component" "gateway" "context" .) | nindent 4 }}
  ports:
    - port: 8787
      targetPort: 8787
      {{- with .Values.gateway.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
