{{- range .Values.gateway.extraEnv }}
{{- if or (eq .name "ANYRAY_METERING_ENABLED") (eq .name "ANYRAY_DEPLOYMENT_TOKEN") (eq .name "ANYRAY_PSEUDONYM_SALT") }}
{{- fail (printf "gateway.extraEnv must not override %s: Billing metering is mandatory" .name) }}
{{- end }}
{{- end }}
{{- /* Running WITHOUT the data volume is only lossless once the image keeps
       every store it writes in Postgres (the last one moved in 0057, appVersion
       v1.10.224, the same floor the optimizer's 0058 guard uses). On an older
       image part of that state is still files on the volume, so an emptyDir
       silently discards it on each pod restart. Refuse to render rather than
       ship that: the two ways out are pinning a current image or keeping the
       volume, and both are named here. */}}
{{- if not .Values.gateway.persistence.enabled }}
{{- if not (include "anyray.atLeastAppVersion" (dict "component" "gateway" "floor" (include "anyray.haFloor" .) "context" .)) }}
{{- fail (printf "gateway.persistence.enabled=false needs a gateway image of %s or newer (this renders %s): older images keep part of their state as files on that volume, so running without it discards it on every restart. Either upgrade the image, or set gateway.persistence.enabled=true (which also caps gateway.replicas at 1)." (include "anyray.haFloor" .) (include "anyray.effectiveImageTag" (dict "component" "gateway" "context" .))) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anyray.fullname" . }}-gateway
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if .Values.gateway.autoscaling.enabled }}
  {{- if .Values.gateway.persistence.enabled }}
  {{- fail "gateway.autoscaling.enabled needs gateway.persistence.enabled=false: the data PVC is ReadWriteOnce" }}
  {{- end }}
  {{- else }}
  replicas: {{ include "anyray.gatewayReplicas" . }}
  {{- end }}
  {{- if .Values.gateway.persistence.enabled }}
  {{- if and (not .Values.gateway.autoscaling.enabled) (gt (int .Values.gateway.replicas) 1) }}
  {{- fail "gateway.replicas > 1 needs gateway.persistence.enabled=false: the data PVC is ReadWriteOnce" }}
  {{- end }}
  # Recreate: the RWO volume must detach before the replacement pod can mount it.
  # This makes every upgrade a downtime window BY CONSTRUCTION — Recreate stops
  # all old pods and only then starts new ones, so callers get connection
  # failures through the proxy for as long as the replacement takes to boot and
  # pass its readinessProbe. It is not a rolling update and cannot be made one
  # while a single ReadWriteOnce volume is in play. For a seamless roll, set
  # gateway.persistence.enabled=false to take the RollingUpdate branch below.
  strategy:
    type: Recreate
  {{- else }}
  # No RWO volume to detach, so a replacement can run alongside the outgoing pod:
  # surge one new pod, wait for it to pass the readinessProbe, then retire an old
  # one. Holding maxUnavailable at zero is the part that matters — it keeps the
  # Service endpoint list non-empty for the whole rollout, even at one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  {{- include "anyray.minReadySeconds" (dict "component" "gateway" "context" .) | nindent 2 }}
  {{- include "anyray.rolloutMeta" (dict "component" "gateway" "context" .) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" "gateway" "context" .) | nindent 6 }}
  template:
    metadata:
      {{- include "anyray.podMetadata" (dict "component" "gateway" "context" .) | nindent 6 }}
    spec:
      {{- include "anyray.podSpecCommon" (dict "component" "gateway" "context" .) | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "anyray.image" (dict "component" "gateway" "context" .) }}
          imagePullPolicy: {{ include "anyray.imagePullPolicy" (dict "component" "gateway" "context" .) }}
          {{- include "anyray.containerSecurityContext" (dict "component" "gateway" "context" .) | nindent 10 }}
          env:
            {{- include "anyray.gatewayEnv" . | trimPrefix "\n" | nindent 12 }}
          ports:
            - containerPort: 8787
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          {{- /* Liveness targets /livez, NOT the readiness route above: `/` 503s
                 while draining, so a liveness probe there would restart the pod
                 mid-drain and reset every in-flight stream. Rendered only for an
                 image that serves /livez (see anyray.livezFloor). */}}
          {{- include "anyray.startupProbe" (dict "component" "gateway" "port" 8787 "context" .) | nindent 10 }}
          {{- include "anyray.livenessProbe" (dict "component" "gateway" "port" 8787 "context" .) | nindent 10 }}
          # Runs BEFORE SIGTERM, so the pod is still serving while its removal
          # from the Service endpoints propagates. Once SIGTERM lands the gateway
          # marks itself down on `/` (503) and drains in-flight requests for
          # ANYRAY_SHUTDOWN_DRAIN_MS; terminationGracePeriodSeconds has to cover
          # this pause plus that drain, or the kubelet kills it mid-stream.
          {{- include "anyray.preStopDrain" (dict "component" "gateway" "context" .) | nindent 10 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: data
          {{- if .Values.gateway.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anyray.fullname" . }}-gateway-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.gateway.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anyray.fullname" . }}-gateway-data
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    # survive helm uninstall — this volume holds provider keys and spend history
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.gateway.persistence.storageClass }}
  storageClassName: {{ .Values.gateway.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Bare name: nginx in the proxy image hardcodes the upstream `gateway:8787`.
  name: gateway
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  {{- with .Values.gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "anyray.selectorLabels" (dict "component" "gateway" "context" .) | nindent 4 }}
  ports:
    - port: 8787
      targetPort: 8787
      {{- with .Values.gateway.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
