{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled=true requires httpRoute.parentRefs (the Gateway to attach to)" }}
{{- end }}
{{- $hostnames := .Values.httpRoute.hostnames }}
{{- if not $hostnames }}
{{- if not .Values.host }}
{{- fail "httpRoute.enabled=true requires host or httpRoute.hostnames" }}
{{- end }}
{{- $hostnames = list .Values.host }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "anyray.fullname" . }}
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- range $hostnames }}
    - {{ . | quote }}
    {{- end }}
  # Same split as the Ingress: /v1 + /connect -> gateway, / + /admin -> console
  # proxy. Gateway API resolves matches by longest path prefix, so the catch-all
  # "/" never shadows the more-specific routes regardless of rule order.
  #
  # The gateway rules pin `timeouts.request: 0s` (disabled) for the same reason
  # the Ingress carries proxy-read-timeout: a streaming completion runs for
  # minutes, and the spec leaves an unset request timeout
  # IMPLEMENTATION-SPECIFIC — Envoy Gateway, for one, applies 15s, which would
  # cut nearly every turn mid-stream and surface to the developer as a bare
  # "Connection closed mid-response" blamed on the gateway. Console/admin rules
  # are left on the implementation's default; they serve ordinary short
  # requests. `timeouts` is Gateway API >= v1.1; an older CRD prunes the unknown
  # field rather than rejecting the route. Set httpRoute.streamingDefaults=false
  # to leave every rule on the implementation default.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      {{- if .Values.httpRoute.streamingDefaults }}
      timeouts:
        request: 0s
      {{- end }}
      backendRefs:
        - name: gateway
          port: 8787
    - matches:
        - path:
            type: PathPrefix
            value: /connect
      {{- if .Values.httpRoute.streamingDefaults }}
      timeouts:
        request: 0s
      {{- end }}
      backendRefs:
        - name: gateway
          port: 8787
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: {{ include "anyray.fullname" . }}-proxy
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "anyray.fullname" . }}-proxy
          port: 3000
{{- end }}
