{{- if .Values.ingress.enabled }}
{{- /* /v1 carries streaming LLM responses that run for MINUTES and request
bodies of a megabyte or more, and this Ingress is the only hop between the
developer's tool and the gateway. ingress-nginx's stock defaults are sized for
ordinary web traffic and break both: proxy-read-timeout/proxy-send-timeout are
60s, so nginx tears down a stream during any longer gap between SSE events —
the client gets a bare transport close and reports "Connection closed
mid-response" against the gateway, which never saw a failure — and
proxy-body-size is 1m, which 413s an ordinary coding request.

So the chart ships streaming-safe values instead of leaving every operator to
rediscover them. Merged UNDER .Values.ingress.annotations (merge favours the
destination), so setting any of these keys yourself still wins, and
ingress.streamingDefaults=false drops them entirely for a controller that wants
none of it. Keys are ingress-nginx-specific; other controllers ignore
annotations they do not recognise. */ -}}
{{- $annotations := deepCopy (default (dict) .Values.ingress.annotations) }}
{{- if .Values.ingress.streamingDefaults }}
{{- $annotations = merge $annotations (dict
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-body-size" "32m"
      "nginx.ingress.kubernetes.io/proxy-buffering" "off") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anyray.fullname" . }}
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Paths come from files/edgeRoutes.json, generated from the gateway's route
    labels (monorepo scripts/generate-edge-routes.mjs); edit the generator, not this
    list. Ordered most specific first, so in-order controllers (the AWS LB
    controller) and longest-match ones (ingress-nginx) route alike. /admin and
    unmatched paths go to the console proxy, whose auth gate turns the console's
    cookie into the admin Bearer; /admin/v1/regions/sync skips it because the proxy
    strips the region token's Authorization header. A path holding a "." is
    ImplementationSpecific: ingress-nginx's strict path validation rejects it under
    any other pathType and then refuses the whole Ingress. */ -}}
    {{- $edge := .Files.Get "files/edgeRoutes.json" | fromJson }}
    {{- $proxy := printf "%s-proxy" (include "anyray.fullname" .) }}
    {{- $hosts := .Values.ingress.hosts }}
    {{- if not $hosts }}
    {{- $hosts = list (dict "host" .Values.host) }}
    {{- end }}
    {{- $legacyPaths := dict "console" "/" "gateway" "/v1" "connect" "/connect" "admin" "/admin" }}
    {{- range $entry := $hosts }}
    {{- range $name, $path := (default dict $entry.paths) }}
    {{- if ne $path (get $legacyPaths $name) }}
    {{- fail (printf "ingress.hosts[].paths.%s=%s is no longer supported: the chart routes every gateway path itself. Remove ingress.hosts[].paths." $name $path) }}
    {{- end }}
    {{- end }}
    {{- $host := default $.Values.host $entry.host }}
    {{- if not $host }}
    {{- fail "ingress.enabled=true requires host or ingress.hosts[].host" }}
    {{- end }}
    - host: {{ $host }}
      http:
        paths:
          {{- range $rule := $edge.ingress }}
          {{- $console := eq $rule.target "console" }}
          - path: {{ $rule.path }}
            pathType: {{ $rule.pathType }}
            backend:
              service:
                name: {{ ternary $proxy (ternary "gateway-inference" "gateway" (and (eq $.Values.topology "split") (eq $rule.target "inference"))) $console }}
                port:
                  number: {{ ternary 3000 8787 $console }}
          {{- end }}
    {{- end }}
    {{- if and (eq .Values.topology "split") .Values.inference.host }}
    - host: {{ .Values.inference.host | quote }}
      http:
        paths:
          {{- $fallback := last $edge.ingress }}
          - path: {{ $fallback.path }}
            pathType: {{ $fallback.pathType }}
            backend:
              service:
                name: gateway-inference
                port:
                  number: 8787
    {{- end }}
{{- end }}
