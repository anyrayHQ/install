{{- if .Values.ingress.enabled }}
{{- /* /v1 carries streaming LLM responses that run for MINUTES and request
bodies of a megabyte or more, and this Ingress is the only hop between the
developer's tool and the gateway. ingress-nginx's stock defaults are sized for
ordinary web traffic and break both: proxy-read-timeout/proxy-send-timeout are
60s, so nginx tears down a stream during any longer gap between SSE events —
the client gets a bare transport close and reports "Connection closed
mid-response" against the gateway, which never saw a failure — and
proxy-body-size is 1m, which 413s an ordinary coding request.

So the chart ships streaming-safe values instead of leaving every operator to
rediscover them. Merged UNDER .Values.ingress.annotations (merge favours the
destination), so setting any of these keys yourself still wins, and
ingress.streamingDefaults=false drops them entirely for a controller that wants
none of it. Keys are ingress-nginx-specific; other controllers ignore
annotations they do not recognise. */ -}}
{{- $annotations := deepCopy (default (dict) .Values.ingress.annotations) }}
{{- if .Values.ingress.streamingDefaults }}
{{- $annotations = merge $annotations (dict
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-body-size" "32m"
      "nginx.ingress.kubernetes.io/proxy-buffering" "off") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anyray.fullname" . }}
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $hosts := .Values.ingress.hosts }}
    {{- if not $hosts }}
    {{- $hosts = list (dict "host" .Values.host "paths" (dict "console" "/" "gateway" "/v1" "connect" "/connect" "admin" "/admin")) }}
    {{- end }}
    {{- range $entry := $hosts }}
    {{- $paths := default dict $entry.paths }}
    {{- $host := default $.Values.host $entry.host }}
    {{- if not $host }}
    {{- fail "ingress.enabled=true requires host or ingress.hosts[].host" }}
    {{- end }}
    - host: {{ $host }}
      http:
        paths:
          - path: {{ default "/" $paths.console }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "anyray.fullname" $ }}-proxy
                port:
                  number: 3000
          - path: {{ default "/v1" $paths.gateway }}
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8787
          # /connect/* is the developer enrollment + policy lane the connect CLI
          # uses (/connect/verify, /connect/policy, /connect/savings,
          # /connect/fallback-config). It authenticates with the developer's OWN key
          # as a Bearer — or is unauthenticated, for /connect/verify — and is served
          # in-process by the gateway, so it must go STRAIGHT to the gateway like
          # /v1, NOT through the proxy. Routed to the proxy it hits the console's
          # admin-cookie auth gate + catch-all and 302s to /console/, which the CLI
          # then can't parse ("the gateway returned a malformed response") — which
          # breaks BOTH SSO and enrollment-link developer enrollment.
          - path: {{ default "/connect" $paths.connect }}
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8787
          # /admin/* MUST go through the proxy, NOT straight to the gateway. The
          # browser console authenticates with the `anyray_key` cookie, which only
          # the proxy understands: it runs the auth_request gate and injects the
          # admin key as a `Bearer` from that cookie. Routed to the gateway directly,
          # the console's /admin/* calls (and the /admin/auth login probe) carry no
          # Bearer the gateway accepts, so login 401s behind an ingress/ALB even
          # though it works via `kubectl port-forward` to the proxy.
          - path: {{ default "/admin" $paths.admin }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "anyray.fullname" $ }}-proxy
                port:
                  number: 3000
          {{- if (index $.Values "endpoint-control").enabled }}
          # End-point control agent plane (RFC 0014): fleetd on employee
          # laptops calls these FIXED root-anchored paths against this same
          # origin (the gateway has no /api/* routes, so nothing collides — no
          # second hostname or certificate needed). Not overridable on purpose:
          # the wire protocol is fixed, so a different prefix could never work.
          # Everything else the service exposes (/admin/*, /readyz, /livez)
          # stays in-cluster, mirroring the vendor edge's allowlist posture.
          #
          # /livez is deliberately NOT routed here, even though the vendor edge
          # forwards it: there endpoint-control owns a dedicated hostname, here
          # it shares the gateway's. The gateway serves /livez too and the docs
          # point operators' liveness checks at it, so a rule for it would
          # silently re-aim every external probe at the wrong process — and,
          # longest-prefix beating the "/" catch-all, would answer 503 whenever
          # this Deployment has no ready endpoints while the gateway is fine.
          - path: /api/v1/osquery
            pathType: Prefix
            backend:
              service:
                name: endpoint-control
                port:
                  number: 8090
          - path: /api/fleet/orbit
            pathType: Prefix
            backend:
              service:
                name: endpoint-control
                port:
                  number: 8090
          - path: /api/v1/evidence
            pathType: Prefix
            backend:
              service:
                name: endpoint-control
                port:
                  number: 8090
          {{- end }}
    {{- end }}
{{- end }}
