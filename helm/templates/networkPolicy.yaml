{{- if .Values.networkPolicy.enabled }}
{{- /*
Restrict who may reach the optimizer's :8088.

WHY. The optimizer is a ClusterIP Service and is deliberately not on the Ingress
or the HTTPRoute, so nothing outside the cluster can reach it. Inside the
namespace it is unrestricted: any pod that can read the deployment's Secret can
call it directly. The gateway is the only component that belongs on that path —
it is what applies your policy and records usage — so this policy makes that
explicit.

Defence in depth rather than the only control: the optimizer independently
verifies the deployment's signed entitlement lease, which travels with the image
and so applies on Compose, Railway, and ECS as well. This policy narrows the
in-cluster path on top of that.

Do NOT name a release number in this comment. The chart is written before the
release carrying a given server-side change is cut, and an earlier draft
asserted a version that turned out not to contain it — telling an operator a
control was live on their install when it was not. The same trap is recorded at
_helpers.tpl's probe floor ("verify against `git tag` before changing it"). Read
capability statements as: present in the appVersion this chart pins, or newer.

WHY IT IS OFF BY DEFAULT. Two reasons, both about not breaking working installs:

  1. Whether kubelet's liveness/readiness probes are subject to NetworkPolicy is
     CNI-dependent. Cilium and Calico allow host→local-pod by default; others do
     not, and there is no portable way to express "the node this pod runs on" in
     a NetworkPolicy. On a CNI that filters probes, every optimizer pod fails
     its liveness probe and crashloops — and an optimizer that is down is not a
     safe failure here: the gateway fails open, forwards the ORIGINAL request,
     and busts the provider prompt cache on every warm session. That costs
     considerably more than the trims it lost.
  2. On a cluster with no policy controller at all a NetworkPolicy is silently
     inert. Defaulting it on would put a rule in the manifest that reads like
     enforcement and enforces nothing.

So: enable it deliberately, then confirm the optimizer pods stay Ready. If they
do not, your CNI filters probes — set `networkPolicy.enabled: false`; the
optimizer's own lease gate still applies.

WHO IS ALLOWED. The gateway only. The console proxy does NOT dial the optimizer
(the console image dropped that upstream — /admin/optimizer/* rides the gateway
passthrough so the gateway's RBAC applies), and nothing else in the chart calls
it. Add your own callers via `networkPolicy.optimizerExtraIngress`.

EGRESS IS NOT RESTRICTED. The optimizer must reach Postgres and, with vision
strategies, nothing else outbound; an egress rule here would be a second way to
break a working install for no gain, since the concern is inbound.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anyray.fullname" . }}-optimizer
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: optimizer
spec:
  podSelector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" "optimizer" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "anyray.selectorLabels" (dict "component" "gateway" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8088
    {{- with .Values.networkPolicy.optimizerExtraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
