apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anyray.fullname" . }}-optimizer
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: optimizer
spec:
  {{- if .Values.optimizer.autoscaling.enabled }}
  {{- if eq (toString .Values.gateway.contentMode) "off" }}
  {{- fail "optimizer.autoscaling.enabled needs gateway.contentMode != off: the durable CCR stash is disabled when content mode is off, so retrieval handles won't resolve across replicas" }}
  {{- end }}
  {{- else }}
  {{- if gt (int .Values.optimizer.replicas) 1 }}
  {{- if eq (toString .Values.gateway.contentMode) "off" }}
  {{- fail "optimizer.replicas > 1 needs gateway.contentMode != off: the durable CCR stash is disabled when content mode is off, so retrieval handles won't resolve across replicas" }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.optimizer.replicas }}
  {{- end }}
  {{- if .Values.optimizer.persistence.enabled }}
  {{- if or .Values.optimizer.autoscaling.enabled (gt (int .Values.optimizer.replicas) 1) }}
  {{- fail "optimizer.replicas > 1 or optimizer.autoscaling.enabled needs optimizer.persistence.enabled=false: the data PVC is ReadWriteOnce" }}
  {{- end }}
  # Recreate: the RWO volume must detach before the replacement pod can mount it.
  # As with the gateway this is a downtime window by construction, and here it
  # costs money rather than availability: the gateway fails open when the
  # optimizer is unreachable and forwards the ORIGINAL request, which busts the
  # provider prompt cache on every warm session for the length of the gap. Set
  # optimizer.persistence.enabled=false for the RollingUpdate branch below.
  strategy:
    type: Recreate
  {{- else }}
  # No RWO volume to detach: surge a replacement, let it pass /health, then retire
  # the outgoing pod. Holding maxUnavailable at zero keeps an optimizer reachable
  # throughout, so no request has to take the fail-open path during an upgrade.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  {{- include "anyray.minReadySeconds" (dict "component" "optimizer" "context" .) | nindent 2 }}
  {{- include "anyray.rolloutMeta" (dict "component" "optimizer" "context" .) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" "optimizer" "context" .) | nindent 6 }}
  template:
    metadata:
      {{- include "anyray.podMetadata" (dict "component" "optimizer" "context" .) | nindent 6 }}
    spec:
      {{- include "anyray.podSpecCommon" (dict "component" "optimizer" "context" .) | nindent 6 }}
      containers:
        - name: optimizer
          image: {{ include "anyray.image" (dict "component" "optimizer" "context" .) }}
          imagePullPolicy: {{ include "anyray.imagePullPolicy" (dict "component" "optimizer" "context" .) }}
          {{- include "anyray.containerSecurityContext" . | nindent 10 }}
          env:
            - name: PORT
              value: "8088"
            - name: ANYRAY_OPTIMIZER_TOKEN
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_OPTIMIZER_TOKEN" "context" .) | nindent 16 }}
            {{- if .Values.optimizerRequestSigning.enforce }}
            # The PUBLIC half only (ANY-202) — verify-only, like the vendor
            # licence key. Holding it does not let this service, or anything
            # that can read its environment, mint a signature.
            #
            # SEPARATE value from `.enabled` on purpose: the optimizer REQUIRES
            # a signature the moment it has this key, so enforcing before the
            # gateway is signing refuses every optimize call. The gateway fails
            # open on that 401 rather than erroring, but it silently costs ALL
            # savings and busts the prompt cache — so this is a second,
            # deliberate step, never the same flag.
            - name: ANYRAY_OPTIMIZER_VERIFY_KEY
              valueFrom:
                {{- include "anyray.optionalSecretRef" (dict "key" "ANYRAY_OPTIMIZER_VERIFY_KEY" "context" .) | nindent 16 }}
            {{- end }}
            - name: ANYRAY_ADMIN_TOKEN
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_ADMIN_TOKEN" "context" .) | nindent 16 }}
            # Runtime config + audit log under ANYRAY_DATA_DIR; the runtime
            # config starts empty and is seeded from the image-baked
            # optimizer.config.json until the first admin edit writes here.
            - name: ANYRAY_DATA_DIR
              value: /data
            # Durable CCR stash tier (same Postgres as the gateway): stashed
            # originals persist as AES-256-GCM ciphertext, so retrieval handles
            # survive optimizer restarts and resolve from any replica.
            {{- include "anyray.spendDbEnv" . | nindent 12 }}
            - name: ANYRAY_CONTENT_KEY
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "ANYRAY_CONTENT_KEY" "context" .) | nindent 16 }}
            # Governs ONLY the paths that run without a gateway — BYO
            # /v1/record writes and attach mode, both in the optimizer process.
            # The gateway's own mode is console-set and stored in the DB, and it
            # pushes that mode here on every optimize call. The value key keeps
            # its gateway.* name so existing my-values.yaml files keep working.
            - name: ANYRAY_CONTENT_MODE
              value: {{ .Values.gateway.contentMode | quote }}
            - name: ANYRAY_ALLOW_PLAINTEXT
              value: {{ .Values.gateway.allowPlaintext | quote }}
            {{- with .Values.gateway.spendRetentionDays }}
            # Same trace-retention sweep as the gateway — must see the same override.
            - name: ANYRAY_SPEND_RETENTION_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.optimizer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          {{- /* The optimizer reuses /health for liveness rather than /livez, and
                 needs no version guard for it: the route is a static
                 dependency-free 200 present in every released image. Unlike the
                 gateway's `/`, it deliberately does NOT flip to 503 while the
                 process is draining — the optimizer has only this one health
                 route, serving both probes, so a 503 on drain would make the
                 LIVENESS probe restart the container in the middle of the very
                 drain it was added to protect. Keep that property if you ever
                 touch the route. What the probe does catch is the case that
                 matters here — an onnxruntime inference wedging the Node event
                 loop, which leaves the pod up, un-Ready, and never restarted, so
                 every request takes the fail-open path and busts the prompt
                 cache. */}}
          {{- include "anyray.startupProbe" (dict "component" "optimizer" "port" 8088 "path" "/health" "unguarded" true "context" .) | nindent 10 }}
          {{- include "anyray.livenessProbe" (dict "component" "optimizer" "port" 8088 "path" "/health" "unguarded" true "context" .) | nindent 10 }}
          # Holds the pod open, still answering /v1/optimize, until its removal
          # from the Service endpoints has reached the gateway — without it an
          # upgrade produces a burst of fail-open (cache-busting) requests.
          #
          # It pairs with, and does not replace, the optimizer's own SIGTERM
          # drain (15s, optimizer/src/index.ts): this pause covers requests the
          # gateway has not yet stopped SENDING, the drain covers the ones
          # already in flight when the signal lands. Both are charged against
          # terminationGracePeriodSeconds by the render guard in preStopDrain.
          # Nothing here is user-visible even when it fails — the gateway fails
          # open on an unreachable optimizer — but each cut call forwards the
          # ORIGINAL request and busts that session's prompt cache, which is
          # money.
          {{- include "anyray.preStopDrain" (dict "component" "optimizer" "context" .) | nindent 10 }}
          resources:
            {{- toYaml .Values.optimizer.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.optimizer.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anyray.fullname" . }}-optimizer-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.optimizer.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anyray.fullname" . }}-optimizer-data
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: optimizer
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.optimizer.persistence.storageClass }}
  storageClassName: {{ .Values.optimizer.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.optimizer.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Bare name: nginx in the proxy image hardcodes the upstream `optimizer:8088`.
  name: optimizer
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: optimizer
spec:
  type: ClusterIP
  selector:
    {{- include "anyray.selectorLabels" (dict "component" "optimizer" "context" .) | nindent 4 }}
  ports:
    - port: 8088
      targetPort: 8088
