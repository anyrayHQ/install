{{- /*
PodDisruptionBudgets for the gateway, optimizer and proxy Deployments.

These bound VOLUNTARY disruption only — a `kubectl drain` for a node upgrade, a
cluster-autoscaler scale-down, a machine-pool roll. They do not apply to node
failure, and they do not apply to `helm upgrade`, which is governed by each
Deployment's strategy instead. Without a budget the eviction API is free to take
every pod of a workload at once, so a routine node roll can produce the same
outage an upgrade does.

A budget is rendered only for a workload actually running two or more pods
(autoscaling.enabled, or replicas > 1). That skip is deliberate rather than an
oversight: over a single replica any budget that protects anything makes the only
pod permanently unevictable, and `kubectl drain` then blocks forever instead of
completing the node upgrade. At the default gateway/optimizer replicas: 1 this
file therefore emits nothing for them, and the proxy — two replicas by default —
is the one workload covered out of the box.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "gateway" "optimizer" "proxy" }}
{{- $cfg := index $.Values $component }}
{{- if or $cfg.autoscaling.enabled (gt (int $cfg.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "anyray.fullname" $ }}-{{ $component }}
  labels:
    {{- include "anyray.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" $component "context" $) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
