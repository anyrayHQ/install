{{- if .Values.postgres.enabled }}
{{- include "anyray.validatePostgresStorage" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anyray.fullname" . }}-postgres
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "anyray.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "anyray.selectorLabels" (dict "component" "postgres" "context" .) | nindent 6 }}
  template:
    metadata:
      {{- include "anyray.podMetadata" (dict "component" "postgres" "context" .) | nindent 6 }}
    spec:
      {{- include "anyray.podSpecCommon" (dict "component" "postgres" "context" .) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "anyray.image" (dict "component" "postgres" "context" .) }}
          imagePullPolicy: {{ include "anyray.imagePullPolicy" (dict "component" "postgres" "context" .) }}
          {{- include "anyray.containerSecurityContext" . | nindent 10 }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                {{- include "anyray.secretRef" (dict "key" "POSTGRES_PASSWORD" "context" .) | nindent 16 }}
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
            # Initialize into a subdirectory of the mount, not its root. A
            # directly mounted volume (e.g. an AWS EBS PVC, ext4) has a
            # lost+found at its root, and initdb refuses any non-empty data
            # directory. See helm/README.md → Troubleshooting.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          {{- /* Readiness alone only stops traffic being routed here; nothing
                 restarts a Postgres that is up but wedged, and while it is down
                 the gateway's client-key verify fails closed, so every /v1/*
                 request 401s. Thresholds are deliberately slack: interrupting
                 crash recovery is worse than waiting it out. */}}
          {{- with .Values.postgres.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: {{ .initialDelaySeconds | default 30 }}
            periodSeconds: {{ .periodSeconds | default 15 }}
            timeoutSeconds: {{ .timeoutSeconds | default 5 }}
            failureThreshold: {{ .failureThreshold | default 8 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anyray.fullname" . }}-postgres
  labels:
    {{- include "anyray.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "anyray.selectorLabels" (dict "component" "postgres" "context" .) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
