# Anyray Helm chart values.
# Run setup.sh --k8s --connect <adt_token> to generate the Secret and a starter
# values file, then install into your chosen namespace:
#   kubectl apply -n "$ANYRAY_NAMESPACE" -f anyray-secrets.yaml
#   helm install anyray ./helm -f my-values.yaml --namespace "$ANYRAY_NAMESPACE"
# Omit the namespace flags only when you intentionally want the current kubectl/Helm namespace.

# The cluster's external Ingress/LoadBalancer DNS endpoint (console + gateway).
# Required. Must be a hostname, not a node IP — it becomes the Ingress host: rule,
# which matches on the HTTP Host header.
host: ""

# In-cluster DNS domain, used to build the gateway/optimizer Service FQDNs the
# proxy's nginx dials. nginx's `resolver` does not apply Kubernetes search
# domains, so these must be fully qualified. Override only if your cluster was
# brought up with a non-default DNS domain (the kubeadm/EKS/GKE/AKS default is
# cluster.local).
clusterDomain: cluster.local

# Private-registry mirrors: set imageRegistry to your internal
# registry host to repoint EVERY image (gateway/optimizer/proxy/postgres) at it in
# one shot, e.g. "my.registry:5000" → my.registry:5000/anyray/gateway. The image
# path after the host is preserved, so mirror with a straight
#   crane cp public.ecr.aws/anyray/gateway:<tag> my.registry:5000/anyray/gateway:<tag>
# (per-image overrides under images.* still win). Empty = pull from public.ecr.aws.
# This changes image distribution only; the Billing app connection is mandatory.
global:
  imageRegistry: ""

image:
  # Empty → images pin to the chart's appVersion (the release this chart ships),
  # so production deploys are reproducible and auditable. Set to "policy-stable"
  # for the moving channel; it forces pullPolicy: Always.
  tag: ""
  # Pinned, immutable tags don't need re-pulling; a cached layer is the same build.
  pullPolicy: IfNotPresent
  pullSecrets: []

# Per-component image repository overrides. Empty app tags inherit image.tag,
# which in turn inherits the chart appVersion.
images:
  gateway:
    repository: public.ecr.aws/anyray/gateway
    tag: ""
  optimizer:
    repository: public.ecr.aws/anyray/optimizer
    tag: ""
  proxy:
    repository: public.ecr.aws/anyray/proxy
    tag: ""
  endpoint-control:
    repository: public.ecr.aws/anyray/endpoint-control
    tag: ""
  # Postgres is third-party, so its tag carries an immutable digest as well: `17`
  # is a floating minor and a tag can be re-pushed. The digest is the multi-arch
  # index (linux/amd64 + linux/arm64) for postgres 17.10, matching the pin in
  # docker-compose.yml. Bump the tag and the digest TOGETHER, in both files.
  # `crane cp` preserves manifest bytes, so a global.imageRegistry mirror of the
  # same digest still resolves. Refresh with:
  #   docker buildx imagetools inspect docker.io/postgres:17
  postgres:
    repository: docker.io/postgres
    tag: "17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317"

# Name of the Kubernetes Secret created by: ./setup.sh --k8s --connect <adt_token>
secretName: anyray-secrets

# Common pod/runtime controls. These apply to all workload pods.
serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
containerSecurityContext: {}

# Global scheduling defaults applied to every pod. Each component block below
# (gateway, optimizer, proxy, postgres) can override any of these per workload by
# setting the same key — e.g. pin the Postgres pod to a specific node pool while
# everything else stays on the default. A component-level value REPLACES the
# global for that field (it does not merge), and an unset component value inherits
# the global. All images are multi-arch, so an architecture nodeSelector is only
# needed for deliberate placement, not for the stack to run on mixed arm64/amd64
# nodes. Example:
#   postgres:
#     nodeSelector:
#       kubernetes.io/arch: amd64
#     tolerations:
#       - key: dedicated
#         operator: Equal
#         value: data-plane
#         effect: NoSchedule
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""

# Global rollout / termination defaults, applied to every pod. Any component block
# below can override one by setting the same key; unlike the scheduling fields
# above, an explicit 0 is honoured rather than read as "unset".
#
# preStopDrainSeconds — how long a pod keeps serving after Kubernetes starts
#   terminating it, before it is sent SIGTERM. Removal from the Service endpoints
#   is asynchronous and races the signal, so without this pause requests still
#   arrive at a process that has stopped listening and the caller sees a reset
#   connection instead of a retryable response. Note that on the default gateway
#   and optimizer path (persistence.enabled=true, which forces strategy:
#   Recreate) the pause also lengthens the upgrade gap, because no replacement
#   pod starts until the old one is fully gone; set 0 to trade in-flight requests
#   back for a shorter window.
# terminationGracePeriodSeconds — total budget from "terminating" to SIGKILL,
#   which has to cover preStopDrainSeconds PLUS the application's own drain. On
#   SIGTERM the gateway stops accepting connections and lets in-flight requests
#   (notably long streaming completions) finish for up to
#   ANYRAY_SHUTDOWN_DRAIN_MS, default 90000; if this budget runs out first the
#   kubelet SIGKILLs mid-drain and resets every open stream — which a coding
#   assistant reports as "Connection closed mid-response", blamed on the gateway
#   rather than on the rollout that cut it. It is a ceiling and not a delay — a
#   pod that exits sooner terminates sooner — so the default is set with headroom
#   above the 90s drain plus the 5s pre-stop pause. Raise it whenever you raise
#   ANYRAY_SHUTDOWN_DRAIN_MS for longer completions; the chart refuses to render
#   if the sum no longer fits.
# minReadySeconds — how long a new pod must stay Ready before the rollout counts
#   it as available, so a pod that passes one probe and then crashes cannot take
#   the previous version down with it.
preStopDrainSeconds: 5
terminationGracePeriodSeconds: 120
minReadySeconds: 10

# Retired ReplicaSets kept per Deployment for rollback (Kubernetes default 10).
revisionHistoryLimit: 3
# How long a rollout may make no progress before it is marked failed. Left unset
# Kubernetes waits 600s, so a rollout whose new pods never pass their probes
# stalls silently for ten minutes. Every rolling workload here holds
# maxUnavailable at 0, so the outgoing pods serve throughout and a short deadline
# costs no traffic — it just makes a stuck upgrade report itself, which is what
# `helm upgrade --atomic` needs to trigger its rollback. Must exceed
# minReadySeconds; the chart refuses to render otherwise.
progressDeadlineSeconds: 300

# Liveness and startup probes for the gateway and optimizer.
#
# Readiness alone cannot recover a WEDGED process: an exhausted connection pool
# or a hung await leaves a pod that is up, pulled from the Service by readiness,
# and never restarted — at replicas: 1 a silent permanent outage. The liveness
# probe is the only thing that restarts it.
#
# Both target `/livez`, which is deliberately NOT the readiness route: `/` turns
# 503 while draining, and a liveness probe there would kill the container
# mid-drain and reset every in-flight stream. `/livez` also checks no
# dependency — a probe that touched Postgres would turn a database blip into a
# fleet-wide crashloop.
#
# `/livez` ships from appVersion v1.10.268. Against an older image the probes are
# NOT rendered (they would 404 and crashloop the deployment), so an install
# pinned to an earlier tag keeps today's behaviour until it upgrades.
livenessProbe:
  enabled: true
  # 6 x 10s = a full minute of failure before a restart. Slack on purpose:
  # restarting a merely-slow pod is itself an outage, so liveness must fire well
  # after readiness has already taken the pod out of the Service.
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  # Holds liveness off until the process answers once, so the liveness budget
  # above can stay tight without having to cover a cold start.
  #
  # THIS BUDGET MUST COVER A FULL MIGRATION RUN. The gateway applies the ordered
  # migration ledger at boot and refuses to serve on an unmigrated schema, so it
  # opens no port (and cannot answer /livez) until every pending migration has
  # converged. The ledger allows a single statement 30 minutes
  # (MIGRATION_QUERY_TIMEOUT_MS), and eight of its migrations are
  # CREATE INDEX CONCURRENTLY against tables that hold real customer rows.
  #
  # 360 x 5s = 30 minutes, matching that ceiling. A 5-minute budget was a latent
  # boot loop for exactly the installs least able to absorb one: a self-hosted
  # client with months of spend data, or one jumping several releases at once.
  # The kubelet kills the pod mid-migration, the restart begins the same
  # migration again, and it never converges. Worse for the concurrent ones: an
  # interrupted CREATE INDEX CONCURRENTLY leaves an INVALID index that
  # `IF NOT EXISTS` then skips forever (silent sequential scans), or that a bare
  # re-CREATE errors on and wedges the boot outright.
  #
  # The long budget costs nothing. A startup probe only ever delays a RESTART,
  # never traffic (readiness is a separate probe), and a genuinely misconfigured
  # gateway exits fatally on its own rather than sitting unresponsive — so this
  # can never mask a real failure.
  #
  # CHANGE-BOTH-TOGETHER with MIGRATION_QUERY_TIMEOUT_MS in
  # packages/anyray-observability/src/spendStore/migrations.ts.
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 360

# PodDisruptionBudget for the gateway, optimizer and proxy Deployments: caps how
# many of a workload's pods VOLUNTARY disruption — a node drain, a cluster
# upgrade, an autoscaler scale-down — may take out at once. It does not apply to
# involuntary loss (node failure) or to `helm upgrade`, which is governed by the
# Deployment strategy instead.
#
# Rendered only for a workload that actually runs two or more pods
# (autoscaling.enabled, or replicas > 1). That exclusion is deliberate: a budget
# over a single replica can never allow its only pod to be evicted, so a
# `kubectl drain` for a node upgrade would block indefinitely — a worse outage
# than the one the budget prevents. To get a budget for the gateway or optimizer,
# raise their replicas, which needs persistence.enabled=false (see below); the
# proxy runs two pods by default and so is covered out of the box.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # What the eviction API may do with pods that are RUNNING BUT NOT READY.
  # Kubernetes defaults to IfHealthyBudget, which refuses to evict them unless
  # the workload is already at full health — so a workload whose pods are broken
  # (the wedge the liveness probe exists to catch, a bad image) becomes
  # permanently undrainable, and a node upgrade blocks forever on exactly the
  # pods that are serving nothing. AlwaysAllow lets an unready pod be evicted
  # while still protecting every READY one, which is the behaviour you want when
  # the goal is to stay up: it can only ever remove capacity that was already not
  # serving. Needs Kubernetes >= 1.26 (GA in 1.31); on older clusters the field
  # is ignored and the default applies. Set to "" to omit it entirely.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Gateway
gateway:
  # Two, so the gateway survives losing one. This is only possible because
  # persistence is off below; with the ReadWriteOnce volume mounted the chart
  # refuses anything above 1.
  replicas: 2
  # Autoscaling needs gateway.persistence.enabled=false because the bundled data
  # PVC is ReadWriteOnce. Use an external/shared state backend before enabling.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    # Set for NodePort installs, for example: 30787
    nodePort: null
    # Set for LoadBalancer installs to keep the gateway private to your org/VPN.
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Content privacy: encrypted | off. Never set to plaintext in production.
  #
  # NOTE the gateway no longer reads this. Its content mode is set in the console
  # (Privacy page) and stored in the shared database, so a change applies to every
  # replica and there is one place to audit it. This value now feeds only the
  # OPTIMIZER, which governs the paths that run without a gateway — BYO
  # /v1/record writes and attach mode. The key keeps its gateway.* name so
  # existing my-values.yaml files keep working; it is also what the
  # optimizer.replicas guards below check, since those are about the CCR stash.
  contentMode: encrypted
  allowPlaintext: "false"
  optimizerTimeoutMs: "800"
  optimizerVisionTimeoutMs: "10000"
  # Target for the `anyray-default` model alias (request names no model). Matches
  # the other deploy artifacts; blank it to fall back to the gateway's own default.
  defaultModel: "anthropic/claude-sonnet-4-5"
  # On-top mode: point Anyray at an existing OpenAI-compatible gateway (LiteLLM,
  # OpenRouter, …) so clients send NO per-request x-anyray-config header — the
  # gateway seeds its default routing config from this URL on first boot. For an
  # internal/loopback upstream, also set customHostAllowlist (hostname, no port)
  # and trustedCustomHosts so the host clears the SSRF proxy guard.
  upstreamUrl: ""
  customHostAllowlist: ""
  trustedCustomHosts: ""
  # Public URL the gateway advertises to Anyray Cloud (what enrollment links point
  # developer tools at). Leave blank on an Ingress install and it defaults to
  # https://<host>; set it explicitly for NodePort / non-TLS (e.g.
  # http://gw.example.com:30787) so enrollment links resolve.
  publicUrl: ""
  consolePublicUrl: ""
  # Note: /v1/* is always restricted to verified developers (a minted client key),
  # secure-by-default with no toggle — the former requireClientKeys /
  # requireVerifiedDev values were removed.
  hsts: ""
  # Trust the ingress/proxy X-Forwarded-For for client-IP attribution. ON by
  # default because this chart always fronts the gateway with the in-cluster
  # ingress/proxy, so the gateway's socket peer is that hop — NOT the developer.
  # Left off, every user collapses to one IP, so a handful of failed auths (e.g.
  # one stale client key) trips the always-on auth-failure guard and locks the
  # WHOLE cluster with "too many failed authentication attempts". The gateway
  # reads the leftmost XFF hop, which a standard ingress-nginx
  # (use-forwarded-headers=false, the default) sets to the real client and does
  # not let callers spoof. Set "false" ONLY if you expose the gateway Service
  # directly (NodePort / LoadBalancer with no proxy in front), where a client
  # could forge X-Forwarded-For.
  trustProxy: "true"
  rateLimitRpm: ""
  rateLimitIpRpm: ""
  rateLimitUnauthRpm: ""
  # Days: prunes spend rows (empty = keep forever); also the trace window (default 90d). Gateway + optimizer.
  spendRetentionDays: ""
  maxConcurrentRequests: ""
  authFailLimit: ""
  maxBodyBytes: ""
  # Billing is required. The chart always enables content-free usage metering.
  # `setup.sh --k8s --connect <token>` adds the required deployment token and
  # local pseudonym salt to the Secret. The Billing URL and key are image-pinned.
  metering:
    intervalMs: "900000"
    graceMs: "86400000"
    # Globs of x-anyray-metadata user ids to exclude from the billed seat
    # count (CI bots, service accounts) — e.g. "bot-*,ci-*". Empty = bill all.
    seatExclude: ""
  # Extra env vars (provider-key fallbacks, rate limits, …)
  # in plain k8s env syntax: [{name: ANYRAY_RATE_LIMIT_RPM, value: "600"}]
  extraEnv: []
  # OFF by default since chart 0.5.0, and that single value is the difference
  # between a gateway that can stay up and one that cannot.
  #
  # The volume is ReadWriteOnce, so only one pod can ever mount it: it caps the
  # gateway at replicas: 1 AND forces the Recreate rollout strategy, which makes
  # every `helm upgrade` a downtime window by construction. With it off the chart
  # takes the RollingUpdate path (maxUnavailable: 0) and scales out.
  #
  # Turning it off is safe because nothing authoritative lives here any more.
  # Provider keys, user access keys, routing config, content settings, per-user
  # caps, model aliases, team policy, the audit log, and (from appVersion
  # v1.10.268) the end-point lane's fleetd installers are all in the shared
  # Postgres, read identically by every replica. What remains on the volume is
  # the entitlement-lease cache, which is re-fetched, and legacy off-Postgres
  # fallbacks this chart never uses.
  #
  # UPGRADING AN EXISTING INSTALL: do it in two steps. The gateway copies
  # anything still on the volume into the database on boot, and it can only do
  # that while the volume is mounted. Upgrading the image and taking persistence
  # away in the SAME `helm upgrade` starts the pod with an empty volume, so there
  # is nothing to copy. Set `persistence.enabled: true` explicitly for the
  # upgrade that first lands v1.10.268+, then remove that override once the copy
  # has actually run. Do NOT use Ready as the signal: the copy is best-effort so
  # it can never hold up a boot, which means readiness does not wait for it.
  # `GET /admin/endpoint-fleet/installers` reads the database, so a non-empty
  # list there is the real proof (and if you never uploaded an installer there is
  # nothing to wait for). The old PVC is retained either way
  # ("helm.sh/resource-policy": keep), so the worst case is re-uploading them.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# Optimizer
optimizer:
  # replicas > 1 or autoscaling needs gateway.contentMode != off AND a non-empty
  # ANYRAY_CONTENT_KEY, else the durable CCR stash degrades to per-pod in-memory
  # (cross-replica retrieval breaks). Only off is render-guarded.
  replicas: 1
  # Autoscaling also needs optimizer.persistence.enabled=false because the
  # bundled data PVC is ReadWriteOnce.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Persist /data (optimizer config + audit log) across pod restarts.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  # 1 vCPU / 2 GB guaranteed. The optimizer runs onnxruntime (MiniLM re-rank,
  # OCR) synchronously on the Node event loop; at fractional vCPU a single
  # inference pegs CPU to 100%, blocking the loop long enough to fail the
  # readiness probe and churn the pod. A full-core request keeps each inference
  # block short so the gateway's optimize call lands before it times out.
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1500m"
      memory: "2Gi"
  extraEnv: []

# Proxy (nginx reverse proxy / console)
proxy:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    # Set for NodePort installs, for example: 30000
    nodePort: null
    # Set for LoadBalancer installs to keep the console private to your org/VPN.
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  extraEnv: []

# End-point control (RFC 0014) — the client-operated device-evidence service.
# Employee laptops run the signed fleetd agent against the deployment's public
# origin: the Ingress/HTTPRoute route the fixed agent-plane path families
# (/api/v1/osquery, /api/fleet/orbit, /api/v1/evidence) to it on the SAME host
# the console and gateway share, so no extra hostname or certificate is needed.
# Its admin token is PAIRED with ANYRAY_ADMIN_TOKEN (same Secret key — the
# gateway authenticates to it by falling back to its own admin token), and its
# endpoint_* tables live in the same Postgres as the gateway's spend store.
# Stateless (no volume), so replicas can scale freely.
endpoint-control:
  # On by default — it is part of the minimum stack, not an add-on. Turn it off
  # for the two cases where rendering it is worse than not having it:
  #   - a security review that has not cleared a device-evidence plane yet
  #     (nothing else in the chart changes; the gateway simply leaves the
  #     end-point lane dormant rather than pointing at an absent Service);
  #   - an image.tag pinned BELOW v1.10.246, the first release that published
  #     public.ecr.aws/anyray/endpoint-control. Older pins have no image to
  #     pull and the Deployment would sit in ImagePullBackOff forever, so an
  #     `helm upgrade --wait` (what the AKS/GKE scripts run) times out.
  enabled: true
  replicas: 1
  # Public origin fleetd is pointed at. Leave blank on an Ingress/HTTPRoute
  # install and it defaults to https://<host>; set it explicitly for
  # LoadBalancer / NodePort / non-TLS installs, where the chart routes no
  # agent-plane paths and the agent plane has no origin until you give it one.
  publicUrl: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  extraEnv: []

# Postgres — the Anyray spend + trace store. The gateway persists content-free
# traces + observations to the anyray_traces / anyray_observations tables
# (auto-created on first use; any stored content is AES-256-GCM encrypted at rest)
# and reads them in-process.
postgres:
  enabled: true
  # The bundled Postgres is a SINGLE pod on a ReadWriteOnce volume. It is sized
  # for a small team and it is the stack's one unavoidable single point of
  # failure: the gateway's auth hot path reads client keys from it, so while it
  # is down `/v1/*` fails closed. Nothing in this chart can make one pod highly
  # available — for an install that must not go down, run Postgres OUTSIDE this
  # chart (managed RDS/Cloud SQL, or an in-cluster operator such as CloudNativePG
  # that does real streaming replication and failover) and point
  # postgres.external.* at it with postgres.enabled=false. The settings below
  # only bound how BADLY the single pod fails, they do not make it redundant.
  #
  # A liveness probe restarts a Postgres that is up but no longer answering.
  # `pg_isready` is a local socket check, so it cannot be fooled by a busy
  # server, and the thresholds are slack — a restart mid-recovery is worse than
  # waiting, and crash recovery on a large volume legitimately takes minutes.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 8
  # Size for the steady state: encrypted trace content accumulates until the
  # 90-day retention window fills (roughly 90 x your daily request-content
  # volume; ANYRAY_SPEND_RETENTION_DAYS shortens the window). 10Gi suits a
  # small team — active orgs should start at 50Gi. Set this BEFORE first
  # install: it lands in a StatefulSet volumeClaimTemplate, which Kubernetes
  # makes immutable, so growing later means expanding the PVC by hand (only on
  # storage classes with allowVolumeExpansion) — a full volume stops Postgres.
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  external:
    # Point the gateway's trace + spend store at a managed Postgres instead of
    # the bundled StatefulSet (set postgres.enabled=false). The gateway reads this
    # as both ANYRAY_OBSERVABILITY_DB_URL and ANYRAY_SPEND_DB_URL (one DB serves
    # both). Prefer databaseUrlSecretKeyRef in production.
    databaseUrl: ""
    databaseUrlSecretKeyRef: {}
    # name: anyray-external-postgres
    # key: DATABASE_URL

# Ingress — disabled by default; fill in and set enabled: true to expose externally.
ingress:
  enabled: false
  className: ""
  # Streaming-safe ingress-nginx defaults for the /v1 path, applied unless you
  # turn them off: proxy-read-timeout / proxy-send-timeout 3600 (stock 60s cuts
  # a long completion mid-stream — the client then reports "Connection closed
  # mid-response" and blames the gateway), proxy-body-size 32m (stock 1m 413s an
  # ordinary coding request; mirrors the gateway's own ANYRAY_MAX_BODY_BYTES),
  # proxy-buffering off (buffering defeats SSE). Anything you set in
  # `annotations` below wins over these key by key, so set this to false only if
  # your controller should carry none of them.
  streamingDefaults: true
  annotations: {}
  hosts: []
  # Optional override for one or more hosts. Leave empty to use `host`.
  # - host: anyray.example.com
  #   paths:
  #     console: /
  #     gateway: /v1
  #     connect: /connect
  #     admin: /admin
  # Example annotations for nginx ingress:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  # - secretName: anyray-tls
  #   hosts:
  #     - anyray.example.com

# Gateway API (gateway.networking.k8s.io) — the modern successor to Ingress.
# An alternative to `ingress` above: enable ONE of them. Generates an HTTPRoute
# with the SAME routing (/ and /admin -> console proxy; /v1 and /connect ->
# gateway), attached to a Gateway you already run (platform-managed) via
# parentRefs — the chart does not create the Gateway itself. Requires the
# Gateway API CRDs (gateway.networking.k8s.io/v1) installed in the cluster.
httpRoute:
  enabled: false
  # Disable the request timeout on the two gateway rules (/v1, /connect), which
  # carry streaming completions that run for minutes. Gateway API leaves an unset
  # request timeout implementation-specific — Envoy Gateway applies 15s — and
  # anything short cuts a turn mid-stream, which the developer's tool reports as
  # "Connection closed mid-response". Set false to leave every rule on the
  # implementation's own default.
  streamingDefaults: true
  # The Gateway(s) this route attaches to. REQUIRED when enabled.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system   # omit if the Gateway is in this namespace
  #    sectionName: https          # a specific listener on the Gateway (optional)
  # Hostnames the route matches. Leave empty to use the top-level `host`.
  hostnames: []
  #  - anyray.example.com
  annotations: {}
