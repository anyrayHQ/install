    matchLabels:
      app.kubernetes.io/name: anyray
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: topology-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anyray
        app.kubernetes.io/component: postgres
        app.kubernetes.io/instance: topology-test
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: postgres
                    app.kubernetes.io/instance: topology-test
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: postgres
                    app.kubernetes.io/instance: topology-test
      containers:
        - name: postgres
          image: docker.io/postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=300"]
          
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
            # Initialize into a subdirectory of the mount, not its root. A
            # directly mounted volume (e.g. an AWS EBS PVC, ext4) has a
            # lost+found at its root, and initdb refuses any non-empty data
            # directory. See helm/README.md → Troubleshooting.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 150Gi
