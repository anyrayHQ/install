apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyray-gateway
  labels:
    helm.sh/chart: anyray-CHART_VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: topology-test
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  # No RWO volume to detach, so a replacement can run alongside the outgoing pod:
  # surge one new pod, wait for it to pass the readinessProbe, then retire an old
  # one. Holding maxUnavailable at zero is the part that matters — it keeps the
  # Service endpoint list non-empty for the whole rollout, even at one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: anyray
      app.kubernetes.io/component: gateway
      app.kubernetes.io/instance: topology-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anyray
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: topology-test
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: gateway
                    app.kubernetes.io/instance: topology-test
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: gateway
                    app.kubernetes.io/instance: topology-test
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: public.ecr.aws/anyray/gateway:policy-stable
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: POSTGRES_PASSWORD
            - name: ANYRAY_OBSERVABILITY_DB_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@anyray-postgres:5432/postgres"
            - name: ANYRAY_SPEND_DB_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@anyray-postgres:5432/postgres"
            - name: ANYRAY_OPTIMIZER_URL
              value: "http://optimizer:8088"
            - name: ANYRAY_OPTIMIZER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_OPTIMIZER_TOKEN
            # What `anyray-default` routes to when a request names no model;
            # without it the gateway falls back to a stale alias and 404s.
            - name: ANYRAY_DEFAULT_MODEL
              value: "anthropic/claude-sonnet-5-5"
            - name: ANYRAY_CONTENT_KEY
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_CONTENT_KEY
            - name: ANYRAY_ALLOW_PLAINTEXT
              value: "false"
            - name: ANYRAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_ADMIN_TOKEN
            # All runtime-state files (settings, spend, provider/client keys,
            # routing, user caps, audit logs, GDPR log, entitlement lease) live
            # under one directory on the volume; the gateway derives every path
            # from ANYRAY_DATA_DIR. Override an individual file with its
            # ANYRAY_*_FILE var only if you need to (the per-file var wins).
            - name: ANYRAY_DATA_DIR
              value: /data
            # Billing is required. setup.sh writes the token and local salt to
            # the Secret; the image pins the Billing URL and verification key.
            # Kubernetes requires both Secret keys before starting this pod.
            - name: ANYRAY_METERING_ENABLED
              value: "true"
            - name: ANYRAY_DEPLOYMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_DEPLOYMENT_TOKEN
            - name: ANYRAY_PSEUDONYM_SALT
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_PSEUDONYM_SALT
            - name: ANYRAY_METERING_INTERVAL_MS
              value: "900000"
            - name: ANYRAY_ENTITLEMENT_GRACE_MS
              value: "86400000"
            - name: ANYRAY_GATEWAY_PUBLIC_URL
              value: "https://anyray.example.com"
            - name: ANYRAY_TRUST_PROXY
              value: "true"
          ports:
            - containerPort: 8787
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /livez
              port: 8787
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /livez
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Runs BEFORE SIGTERM, so the pod is still serving while its removal
          # from the Service endpoints propagates. Once SIGTERM lands the gateway
          # marks itself down on `/` (503) and drains in-flight requests for
          # ANYRAY_SHUTDOWN_DRAIN_MS; terminationGracePeriodSeconds has to cover
          # this pause plus that drain, or the kubelet kills it mid-stream.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
