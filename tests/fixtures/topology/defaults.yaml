# Source: anyray/templates/optimizer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyray-optimizer
  labels:
    helm.sh/chart: anyray-CHART_VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: topology-test
    app.kubernetes.io/component: optimizer
spec:
  replicas: 2
  # No RWO volume to detach: surge a replacement, let it pass /health, then retire
  # the outgoing pod. Holding maxUnavailable at zero keeps an optimizer reachable
  # throughout, so no request has to take the fail-open path during an upgrade.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: anyray
      app.kubernetes.io/component: optimizer
      app.kubernetes.io/instance: topology-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anyray
        app.kubernetes.io/component: optimizer
        app.kubernetes.io/instance: topology-test
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: optimizer
                    app.kubernetes.io/instance: topology-test
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: optimizer
                    app.kubernetes.io/instance: topology-test
      containers:
        - name: optimizer
          image: public.ecr.aws/anyray/optimizer:APP_VERSION
          imagePullPolicy: IfNotPresent
          
          env:
            - name: PORT
              value: "8088"
            - name: ANYRAY_OPTIMIZER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_OPTIMIZER_TOKEN
            - name: ANYRAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_ADMIN_TOKEN
            # Runtime config + audit log under ANYRAY_DATA_DIR; the runtime
            # config starts empty and is seeded from the image-baked
            # optimizer.config.json until the first admin edit writes here.
            - name: ANYRAY_DATA_DIR
              value: /data
            # Durable CCR stash tier (same Postgres as the gateway): stashed
            # originals persist as AES-256-GCM ciphertext, so retrieval handles
            # survive optimizer restarts and resolve from any replica.
            
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: POSTGRES_PASSWORD
            - name: ANYRAY_SPEND_DB_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@anyray-postgres:5432/postgres"
            - name: ANYRAY_CONTENT_KEY
              valueFrom:
                secretKeyRef:
                  name: anyray-secrets
                  key: ANYRAY_CONTENT_KEY
            # Governs ONLY the paths that run without a gateway — BYO
            # /v1/record writes and attach mode, both in the optimizer process.
            # The gateway's own mode is console-set and stored in the DB, and it
            # pushes that mode here on every optimize call. The value key keeps
            # its gateway.* name so existing my-values.yaml files keep working.
            - name: ANYRAY_CONTENT_MODE
              value: "encrypted"
            - name: ANYRAY_ALLOW_PLAINTEXT
              value: "false"
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /livez
              port: 8088
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /livez
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Holds the pod open, still answering /v1/optimize, until its removal
          # from the Service endpoints has reached the gateway — without it an
          # upgrade produces a burst of fail-open (cache-busting) requests.
          #
          # It pairs with, and does not replace, the optimizer's own SIGTERM
          # drain (15s, optimizer/src/index.ts): this pause covers requests the
          # gateway has not yet stopped SENDING, the drain covers the ones
          # already in flight when the signal lands. Both are charged against
          # terminationGracePeriodSeconds by the render guard in preStopDrain.
          # Nothing here is user-visible even when it fails — the gateway fails
          # open on an unreachable optimizer — but each cut call forwards the
          # ORIGINAL request and busts that session's prompt cache, which is
          # money.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
