# Source: anyray/templates/proxy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyray-proxy
  labels:
    helm.sh/chart: anyray-CHART_VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: topology-test
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  # The proxy holds no volume, so it can always roll seamlessly. Made explicit
  # rather than left to the Kubernetes default of 25%/25%, which rounds
  # maxUnavailable up to 1 as soon as an operator raises replicas past 3 and would
  # then drop part of the fleet mid-roll.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: anyray
      app.kubernetes.io/component: proxy
      app.kubernetes.io/instance: topology-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anyray
        app.kubernetes.io/component: proxy
        app.kubernetes.io/instance: topology-test
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: proxy
                    app.kubernetes.io/instance: topology-test
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: anyray
                    app.kubernetes.io/component: proxy
                    app.kubernetes.io/instance: topology-test
      containers:
        - name: proxy
          image: public.ecr.aws/anyray/proxy:APP_VERSION
          imagePullPolicy: IfNotPresent
          
          # The proxy image bakes nginx envsubst placeholders for the
          # Docker/Watchtower updater route and status endpoint. The updater is
          # not wired under Kubernetes (upgrades go through `helm upgrade`), but
          # these vars must still be present so the baked template renders and
          # nginx can start.
          env:
            - name: ANYRAY_UPDATER_ENABLED
              value: "false"
            - name: ANYRAY_UPDATER_PERIODIC_POLLS
              value: "false"
            - name: ANYRAY_UPDATER_POLL_INTERVAL
              value: "0"
            - name: ANYRAY_UPDATER_TOKEN
              value: ""
            # Point nginx at the gateway Service by FQDN. The proxy resolves
            # upstreams at request time via nginx's `resolver`, which — unlike
            # libc/Node — does NOT apply the cluster's DNS search domains. So the
            # image default (bare `gateway`, fine on Docker Compose) resolves to
            # NXDOMAIN here, and every gated route (/console/, /admin/*) 500s
            # when the /__auth subrequest can't reach the gateway ("gateway could
            # not be resolved (3: Host not found)"). The Service is named
            # `gateway` (see gateway.yaml).
            #
            # ANYRAY_OPTIMIZER_HOST used to sit here too and was dead: the console
            # image has no optimizer upstream any more. /admin/optimizer/* rides
            # the gateway passthrough on purpose, so the gateway's capability
            # checks apply — proxying straight to the optimizer let any
            # authenticated session, down to `viewer`, rewrite optimizer config.
            # Removed so the manifest cannot be read as a second caller of :8088
            # (see networkPolicy.yaml, which allows the gateway alone).
            # Listed before extraEnv so an operator override still wins (last
            # duplicate env entry is the one kubelet keeps).
            - name: ANYRAY_GATEWAY_HOST
              value: "gateway.topology-test.svc.cluster.local"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /anyray-login
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /anyray-login
              port: 80
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /anyray-login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # nginx proxies the streaming response bodies, so it needs the same
          # endpoint-drain pause as the gateway behind it. The image re-declares
          # STOPSIGNAL SIGQUIT (its `FROM scratch` final stage inherits no config
          # from the nginx base), which is what makes the signal that follows a
          # graceful worker drain rather than nginx's default fast shutdown.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
